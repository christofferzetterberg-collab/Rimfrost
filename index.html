<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1013">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rimfrost">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#swupdate{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100000;background:#1b2a33;color:#e8f4f8;border:1px solid #9fd6e8;border-radius:10px;padding:10px 16px;font:600 15px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:pointer}</style>
</head>
<body>
<title>Rimfrost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen canvas world with floating HUD frames; modal panels slide over the centre. Single dark "frost night" look by choice. */
:root{
  --night:#0d1216; --panel:#151c22; --panel2:#1c252c; --line:#2e3b45; --text:#e4ecef; --mute:#93a4ad;
  --frost:#9fd6e8; --ember:#f08a4b; --coin:#e6bd5c; --xp:#9b72e0; --hp:#4fbf5d; --bad:#e2534d;
  --mana:#3f86e0; --rage:#d2443c; --focus:#d6a13d; --energy:#e8d04a;
  --display:"Uncial Antiqua", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;background:#0b1013}
.hud{position:fixed;pointer-events:none;z-index:5}
.hud *{pointer-events:auto}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* unit frames */
#frames{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 200px)}
.frame{background:rgba(21,28,34,.92);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:220px;max-width:44vw}
.frame .top{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
.frame .top span:first-child{overflow:hidden;text-overflow:ellipsis}
.fxrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.fxrow:empty{display:none}.fxc{position:relative;width:26px;height:26px;border-radius:4px;border:1px solid #4caf50;overflow:hidden;background:#0d1419}.fxc.bad{border-color:#e05050}.fxc img{width:100%;height:100%;display:block}.fxc b{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:11px;text-align:center;background:rgba(0,0,0,.65);color:#fff;font-weight:800}
.frame .sub{font-size:12px;color:var(--mute);margin-bottom:4px}
.bar{position:relative;height:14px;background:#0a0e11;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .15s}
.bar b{position:absolute;inset:0;font-size:11px;font-weight:700;text-align:center;line-height:14px;text-shadow:0 1px 1px #000}
.bar .shield{background:rgba(230,240,255,.55)}
#tframe[hidden]{display:none}
.elite{color:var(--coin)}
.lvl-red{color:#ff5a4f}.lvl-orange{color:#ff9a3c}.lvl-yellow{color:#f3dc55}.lvl-green{color:#62d36b}.lvl-gray{color:#8d979c}

/* minimap + tracker */
#side{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:172px;display:flex;flex-direction:column;gap:8px}
#mmwrap{background:rgba(21,28,34,.92);border:1px solid var(--line);border-radius:6px;padding:6px}
#mm{display:block;width:160px;height:107px;border-radius:3px;image-rendering:pixelated}
#zone{font-family:var(--display);font-size:13px;text-align:center;margin-top:4px;color:var(--frost)}
#gold{font-size:13px;text-align:center;color:var(--coin);font-weight:700}
#tracker{background:rgba(21,28,34,.8);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;max-height:34vh;overflow:auto}
#tracker h4{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#tracker .q{margin-bottom:6px}
#tracker .q b{color:var(--coin);font-weight:700}
#tracker .q.done b{color:var(--hp)}
#tracker .o{color:var(--mute)}

/* bottom bar */
#bottom{left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,calc(100vw - 20px))}
#cast{width:240px;max-width:70vw}
#cast[hidden]{display:none}
#cast .bar{height:16px;border:1px solid var(--line)}
#cast i{background:linear-gradient(90deg,#c9a640,#f2d77a)}
#hotbar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:48px;height:48px;border-radius:6px;border:1px solid #3b4955;background:#10161a;padding:0;overflow:hidden;color:#fff}
.slot canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.ico{display:inline-block;width:32px;height:32px;vertical-align:middle;margin-right:6px;image-rendering:pixelated;background-repeat:no-repeat;flex:none}
.slot .k{position:absolute;top:1px;left:3px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
.slot.oom canvas{filter:saturate(.25) brightness(.55)}
.slot.oor{box-shadow:inset 0 0 0 2px rgba(226,83,77,.75)}
.slot.locked{opacity:.35}
.slot.active{box-shadow:0 0 0 2px var(--coin)}
.slot.pot .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
#xpbar{width:100%;height:10px;border-radius:5px;background:#0a0e11;border:1px solid var(--line);position:relative;overflow:hidden}
#xpbar i{position:absolute;inset:0 auto 0 0;background:var(--xp)}
#xpbar b{position:absolute;inset:0;font-size:9px;line-height:9px;text-align:center;font-weight:700}
#menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#menu button{background:rgba(21,28,34,.92);color:var(--text);border:1px solid var(--line);border-radius:4px;font-size:12px;padding:3px 8px}
#menu button .key{color:var(--mute);margin-left:4px}
#menu button.glow{border-color:var(--coin);color:var(--coin)}

/* log */
#log{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:280px;max-width:40vw;font-size:12.5px;line-height:1.35;pointer-events:none}
#log div{background:rgba(10,14,17,.55);padding:1px 6px;border-radius:3px;margin-top:2px;animation:fade 9s forwards}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}

/* centre banners */
#banner{left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none}
#banner .big{font-family:var(--display);font-size:clamp(24px,4vw,40px);color:var(--coin);text-shadow:0 2px 10px #000}
#banner .small{font-size:15px;color:var(--text);text-shadow:0 1px 4px #000}

/* panels */
.panel{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:16px 18px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px;color:var(--frost);text-wrap:balance}
.panel h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.panel .x{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:5px;width:30px;height:30px;font-size:16px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:14px;font-weight:700}
.btn.pri{background:var(--frost);color:#0d1216;border-color:var(--frost)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.item .d{font-size:12.5px;color:var(--mute)}
.item > div{min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.stats span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.coin{color:var(--coin);font-weight:700}

/* talents */
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:left;color:var(--text)}
.tal .n{font-weight:800;display:flex;justify-content:space-between;gap:6px}
.tal .r{font-variant-numeric:tabular-nums;color:var(--coin)}
.tal .d{font-size:12.5px;color:var(--mute);margin-top:3px}
.tal.can{border-color:var(--coin)}
.tal.max{border-color:var(--hp)}
.tal:disabled{opacity:.45;cursor:not-allowed}

/* creation */
#create{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#1d3340 0%,var(--night) 60%);padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#create .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#create h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,76px);margin:0;color:var(--frost);text-align:center;letter-spacing:.02em;text-shadow:0 0 30px rgba(159,214,232,.25)}
#create .tag{text-align:center;color:var(--mute);margin-top:-8px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:4px}
.pick b{font-size:16px}
.pick span{font-size:12.5px;color:var(--mute)}
.pick.sel{border-color:var(--frost);box-shadow:0 0 0 1px var(--frost) inset;background:#18262e}
.pick .sw{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:6px;border:1px solid rgba(255,255,255,.3)}
#cname{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 12px;font-size:16px;font-family:var(--body);width:min(320px,100%)}
#preview{display:block;width:120px;height:120px;margin:0 auto}
.chars{display:flex;flex-direction:column;gap:8px}
.gico{display:inline-flex;align-items:center;justify-content:center;border:2px solid;border-radius:6px;background:#0d1419;margin-right:8px;flex:none;box-sizing:border-box}.gico img{width:78%;height:78%;image-rendering:pixelated}.gico.empty{border-color:var(--line);width:34px;height:34px;border-style:dashed}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.eqs{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}.eqs b{font-size:13px}.eqs .d{font-size:11.5px}.btn.sm{padding:4px 8px;font-size:12px;flex:none}
@media (max-width:640px){.eqgrid{grid-template-columns:1fr}}
#restbtn.on{border-color:var(--frost);color:var(--frost)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.menu-grid .btn{text-align:left;padding:10px 12px}.btn.glowb{border-color:var(--coin);color:var(--coin)}
.kbgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.kbrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kbkey{min-width:64px;background:#0d1419;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:4px 8px;font-weight:700;cursor:pointer}.kbkey.wait{border-color:var(--coin);color:var(--coin)}
.barprev{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap}.bp{width:40px;height:40px;border:1px solid var(--line);border-radius:5px;background:#0d1419;position:relative;overflow:hidden}.bp img{width:100%;height:100%}.bp span{position:absolute;left:2px;top:0;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.abico{width:36px;height:36px;border-radius:5px;margin-right:10px;flex:none;border:1px solid var(--line)}.item.dim{opacity:.55}.item select{background:#0d1419;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px;max-width:170px;flex:none}
.smithgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}.smithgrid .btn{font-size:12.5px;padding:6px 8px;text-align:left}.btn.dimb{opacity:.45}
.abico.drag{cursor:grab;touch-action:none}.bp{cursor:default}.bp.has{cursor:grab;touch-action:none}.bp.over{border-color:var(--coin);box-shadow:0 0 0 2px var(--coin) inset}
.dragghost{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;z-index:9999;border-radius:6px;opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.slot.empty{opacity:.45;border-style:dashed}
@media (max-width:640px){.menu-grid,.kbgrid{grid-template-columns:1fr}}
.char{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left;color:var(--text);width:100%}
.char.sel{border-color:var(--frost);box-shadow:0 0 0 1px var(--frost) inset;background:#18262e}
.char canvas{width:56px;height:56px;flex:none;image-rendering:pixelated}
.char .ci{flex:1;min-width:0}
.char .ci b{font-size:17px}
.char .ci div{font-size:13px;color:var(--mute)}
.char .del{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:5px 9px;font-size:12px;flex:none}
.char .del.confirm{border-color:var(--bad);color:var(--bad);font-weight:800}
.abl{font-size:13px;color:var(--mute)}
.abl b{color:var(--text)}

/* death */
#dead{position:fixed;inset:0;z-index:25;background:rgba(40,46,52,.55);backdrop-filter:grayscale(1);display:flex;align-items:center;justify-content:center}
#dead .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;text-align:center}
#dead h2{font-family:var(--display);font-weight:400;color:var(--bad);margin:0 0 10px}

/* touch */
#joy{position:fixed;z-index:6;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(159,214,232,.35)}
#interact{position:fixed;z-index:6;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:rgba(21,28,34,.9);border:1px solid var(--coin);color:var(--coin);font-weight:800;font-size:13px}
#atkbtn{position:fixed;z-index:6;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(224px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:rgba(21,28,34,.9);border:1px solid var(--bad);color:var(--bad);font-weight:800;font-size:12px}
#tabbtn{position:fixed;z-index:6;right:max(96px,calc(env(safe-area-inset-right,0px) + 96px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:rgba(21,28,34,.9);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:12px}
@media (max-width:640px){
  .frame{width:160px;padding:4px 6px}
  #side{width:120px}
  #mm{width:110px;height:73px}
  #tracker{display:none}
  .slot{width:40px;height:40px}
  #log{display:none}
}
@media (prefers-reduced-motion:reduce){#log div{animation:none}.bar i{transition:none}}
</style>

<canvas id="game"></canvas>

<div class="hud" id="frames">
  <div class="frame" id="pframe">
    <div class="top"><span id="pname">-</span><span class="num" id="plvl">1</span></div>
    <div class="sub" id="pdesc">-</div>
    <div class="bar"><i id="phpi" style="background:var(--hp)"></i><i id="pshi" class="shield"></i><b class="num" id="phpt"></b></div>
    <div class="bar"><i id="presi"></i><b class="num" id="prest"></b></div>
    <div class="fxrow" id="pbuffs"></div>
  </div>
  <div class="frame" id="tframe" hidden>
    <div class="top"><span id="tname">-</span><span class="num" id="tlvl"></span></div>
    <div class="sub" id="tdesc"></div>
    <div class="bar"><i id="thpi" style="background:var(--bad)"></i><b class="num" id="thpt"></b></div>
    <div class="fxrow" id="tbuffs"></div>
  </div>
</div>

<div class="hud" id="side">
  <div id="mmwrap"><canvas id="mm" width="110" height="90"></canvas><div id="zone">-</div><div id="gold" class="num">0 guld</div></div>
  <div id="tracker"></div>
</div>

<div class="hud" id="log"></div>
<div class="hud" id="banner"></div>

<div class="hud" id="bottom">
  <div id="cast" hidden><div class="bar"><i id="casti"></i><b id="castt"></b></div></div>
  <div id="hotbar"></div>
  <div id="xpbar"><i id="xpi"></i><b class="num" id="xpt"></b></div>
  <div id="menu" hidden>
    <button data-p="menu" id="talbtn">Meny</button>
  </div>
</div>

<div id="panel" class="panel" hidden></div>
<div id="dead" hidden><div class="box"><h2>Du har dött</h2><p class="muted">Din ande vandrar tillbaka till närmaste by eller läger.</p><button class="btn pri" id="revive">Återuppstå</button></div></div>
<div id="joy" hidden><i></i></div>
<button id="interact" hidden>E</button>
<button id="tabbtn" hidden>Mål</button>
<button id="atkbtn" hidden>Slå</button>

<div id="create">
  <div class="wrap">
    <h1>Rimfrost</h1>
    <div id="selbox" class="list" style="gap:12px" hidden>
      <h3 class="muted" style="margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase">Välj karaktär</h3>
      <div id="charlist" class="chars"></div>
      <div class="row" style="justify-content:center;gap:10px"><button class="btn pri" id="playbtn" style="font-size:17px;padding:10px 26px">Spela</button><button class="btn" id="newcharbtn">Skapa ny karaktär</button></div>
      <div class="muted" id="charcount" style="text-align:center;font-size:13px"></div>
    </div>
    <div id="newbox" class="list" style="gap:14px">
      <div class="row"><button class="btn" id="backbtn" hidden>← Tillbaka</button></div>
      <canvas id="preview" width="120" height="120"></canvas>
      <div class="row" style="justify-content:center"><input id="cname" maxlength="16" placeholder="Namn på din hjälte" value="Christoffer"></div>
      <h3 class="muted" style="margin:6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase">Ras</h3>
      <div class="picks" id="races"></div>
      <h3 class="muted" style="margin:6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase">Klass</h3>
      <div class="picks" id="classes"></div>
      <div class="row" style="justify-content:center"><button class="btn pri" id="start" style="font-size:17px;padding:10px 26px">Börja äventyret</button></div>
    </div>
  </div>
</div>
<script>
"use strict";
// ======================= DATA =======================
const TILE = 32, MAX_LVL = 30;

<script>
// ======================= WORLD =======================
const T_GRASS=0,T_FOREST=1,T_WATER=2,T_ROCK=3,T_CLIFF=4,T_TREE=5,T_PATH=6,T_SWAMP=7,T_COBBLE=8,T_HOUSE=9,T_DEAD=10,T_BOULDER=11,T_CRYPT=12,T_CWALL=13,T_PINE=14,T_ASH=15,T_LAVA=16,T_SNOW=17,T_ICE=18,T_SPINE=19,T_OBSID=20,
  T_ELFGRASS=21,T_BIRCH=22,T_MOSS=23,T_VTREE=24,T_STEPPE=25,T_SAND=26,T_RCLIFF=27,T_CACTUS=28,T_BLIGHT=29,T_GLOOM=30,T_GATE=31;
const SOLID = new Set([T_WATER,T_CLIFF,T_TREE,T_HOUSE,T_DEAD,T_BOULDER,T_CWALL,T_PINE,T_LAVA,T_ICE,T_SPINE,T_OBSID,T_BIRCH,T_VTREE,T_RCLIFF,T_CACTUS,T_GATE]);
const TERRAIN = {
  meadow:(n,m)=> n>0.74?T_TREE : m>0.88?T_BOULDER : T_GRASS,
  forest:(n,m)=> n>0.53?T_TREE : T_FOREST,
  elfwood:(n,m)=> n>0.68?T_BIRCH : m>0.9?T_WATER : T_ELFGRASS,
  moonwood:(n,m)=> n>0.56?T_VTREE : T_MOSS,
  highland:(n,m)=> n>0.66?T_CLIFF : m>0.8?T_PINE : T_ROCK,
  snowhigh:(n,m)=> n>0.64?T_CLIFF : m>0.8?T_SPINE : m<0.18?T_ROCK : T_SNOW,
  steppe:(n,m)=> n>0.76?T_RCLIFF : m>0.87?T_CACTUS : T_STEPPE,
  canyon:(n,m)=> n>0.58?T_RCLIFF : m>0.86?T_CACTUS : T_SAND,
  rock:(n,m)=> n>0.62?T_CLIFF : m>0.82?T_PINE : m<0.1?T_BOULDER : T_ROCK,
  swamp:(n,m)=> n>0.6?T_WATER : m>0.83?T_DEAD : T_SWAMP,
  ash:(n,m)=> n>0.62?T_LAVA : m>0.82?T_OBSID : T_ASH,
  snow:(n,m)=> n>0.6?T_ICE : m>0.8?T_SPINE : T_SNOW,
  blight:(n,m)=> n>0.68?T_DEAD : m>0.87?T_BOULDER : T_BLIGHT,
  gloom:(n,m)=> n>0.6?T_DEAD : m>0.86?T_WATER : T_GLOOM
};
const BORDER = {blight:T_DEAD, gloom:T_DEAD, meadow:T_TREE, forest:T_TREE, elfwood:T_BIRCH, moonwood:T_VTREE, highland:T_CLIFF, snowhigh:T_CLIFF, steppe:T_RCLIFF, canyon:T_RCLIFF, rock:T_CLIFF, swamp:T_DEAD, ash:T_LAVA, snow:T_ICE};
const FLOOR = {blight:T_BLIGHT, gloom:T_GLOOM, meadow:T_GRASS, forest:T_FOREST, elfwood:T_ELFGRASS, moonwood:T_MOSS, highland:T_ROCK, snowhigh:T_SNOW, steppe:T_STEPPE, canyon:T_SAND, rock:T_ROCK, swamp:T_SWAMP, ash:T_ASH, snow:T_SNOW};
let map, zmap, reach, deco = [];
const fmt = n => Math.round(n);
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise(seed, scale){
  const r = rng(seed), gw = Math.ceil(OW/scale)+3, gh = Math.ceil(MH/scale)+3, g = [];
  for(let i=0;i<gw*gh;i++) g.push(r());
  const sm = t => t*t*(3-2*t);
  return (x,y) => { const fx=x/scale, fy=y/scale, x0=Math.floor(fx), y0=Math.floor(fy), sx=sm(fx-x0), sy=sm(fy-y0);
    const v=(i,j)=>g[(j)*gw+(i)]; const a=v(x0,y0)+(v(x0+1,y0)-v(x0,y0))*sx, b=v(x0,y0+1)+(v(x0+1,y0+1)-v(x0,y0+1))*sx; return a+(b-a)*sy; };
}
const tileAt = (tx,ty) => (tx<0||ty<0||tx>=MW||ty>=MH) ? T_CLIFF : map[ty*MW+tx];
const solidAt = (tx,ty) => SOLID.has(tileAt(tx,ty));
const zoneAtTile = (tx,ty) => zmap[clamp(ty,0,MH-1)*MW+clamp(tx,0,MW-1)];
const zinfo = z => ZONES[z] || HUBS[z];
const parentZone = z => ZONES[z] ? z : HUBS[z] ? HUBS[z].zone : z;
const terrAt = (tx,ty) => (ZONES[parentZone(zoneAtTile(tx,ty))]||{}).t;
const hash = (x,y) => { let h = x*374761393 + y*668265263; h = (h^(h>>>13))*1274126177; return (h^(h>>>16))>>>0; };
const hubDist = (x,y,h) => Math.hypot(x-HUBS[h].x, y-HUBS[h].y);
const nearHub = (x,y,extra) => Object.keys(HUBS).some(h=>hubDist(x,y,h) < HUBS[h].r + extra);

function genWorld(){
  map = new Array(MW*MH); zmap = new Array(MW*MH);
  const n1 = noise(11,6), n2 = noise(23,2.5), wa = noise(37,9), wb = noise(41,9);
  const zl = Object.entries(ZONES).filter(([,z])=>!z.dungeon);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(x >= OW){ map[y*MW+x] = T_CLIFF; zmap[y*MW+x] = null; continue; }
    const wx = x + (wa(x,y)-0.5)*18, wy = y + (wb(x,y)-0.5)*18;
    let best = null, bd = 1e9;
    for(const [id,z] of zl){ const d = Math.hypot(wx-z.c[0], wy-z.c[1]) - (z.w||0); if(d < bd){ bd = d; best = id; } }
    zmap[y*MW+x] = best;
    const t = ZONES[best].t, n = n1(x,y)*0.65 + n2(x,y)*0.35, m2 = n2(x+50,y+50);
    map[y*MW+x] = (x<2||y<2||x>=OW-2||y>=MH-2) ? BORDER[t] : TERRAIN[t](n, m2);
  }
  for(const h of Object.values(HUBS)) h.zone = zmap[h.y*MW+h.x];
  const roadTiles = new Set();
  const set=(x,y,t)=>{ if(x>=2&&y>=2&&x<OW-2&&y<MH-2) map[y*MW+x]=t; };
  const floorAt=(x,y)=>FLOOR[ZONES[zmap[y*MW+x]].t];
  const clear=(cx,cy,r)=>{ for(let y=cy-r;y<=cy+r;y++) for(let x=cx-r;x<=cx+r;x++) if(x>=2&&y>=2&&x<OW-2&&y<MH-2&&Math.hypot(x-cx,y-cy)<=r) set(x,y,floorAt(x,y)); };
  const road=(x1,y1,x2,y2,ph)=>{ const L=Math.hypot(x2-x1,y2-y1); for(let i=0;i<=L*2;i++){ const t=i/(L*2), w=Math.sin(t*Math.PI*2.5+ph)*2.2*Math.sin(t*Math.PI);
    const nx=-(y2-y1)/L, ny=(x2-x1)/L; const x=Math.round(x1+(x2-x1)*t+nx*w), y=Math.round(y1+(y2-y1)*t+ny*w);
    for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){ set(x+ox,y+oy,T_PATH); roadTiles.add((y+oy)*MW+x+ox); } } };
  ROADS.forEach(([a,b],i)=>road(HUBS[a].x,HUBS[a].y,HUBS[b].x,HUBS[b].y,i*0.7));
  for(const [id,l] of Object.entries(LAIRS)){ road(HUBS[l.from].x,HUBS[l.from].y,l.x,l.y,id.length); clear(l.x,l.y,l.r); }
  road(HUBS.traskvakten.x,HUBS.traskvakten.y,(CRYPT.x0+CRYPT.x1)/2|0,CRYPT.y0-2,1.3);
  for(const D of Object.values(DUNGEONS)){ const h = HUBS[D.hub]; road(h.x, h.y, D.ent.x, D.ent.y, 0.4); clear(D.ent.x, D.ent.y, 3); }
  // crypt
  for(let y=CRYPT.y0;y<=CRYPT.y1;y++) for(let x=CRYPT.x0;x<=CRYPT.x1;x++){ const edge = y===CRYPT.y0||x===CRYPT.x0||x===CRYPT.x1||y===CRYPT.y1; map[y*MW+x] = edge?T_CWALL:T_CRYPT; zmap[y*MW+x] = "dimma"; }
  const mid = (CRYPT.x0+CRYPT.x1)/2|0; for(let x=mid-1;x<=mid+1;x++){ map[CRYPT.y0*MW+x]=T_CRYPT; map[(CRYPT.y0-1)*MW+x]=T_PATH; }
  // hubs: cobble discs, houses, decorations
  deco = [];
  for(const [id,h] of Object.entries(HUBS)){
    for(let y=h.y-h.r;y<=h.y+h.r;y++) for(let x=h.x-h.r;x<=h.x+h.r;x++) if(Math.hypot(x-h.x,y-h.y)<h.r+0.5){ set(x,y,T_COBBLE); zmap[y*MW+x]=id; }
    const spots = h.kind==="town" ? [[-7,-6],[4,-6],[-7,4],[4,4],[-2,-8],[-2,6],[-9,-1],[6,-1]] : [[-3,-h.r-1],[1,-h.r-1]];
    let made = 0;
    for(const [ox,oy] of spots){ if(made >= (h.kind==="town"?6:2)) break; const hx=h.x+ox, hy=h.y+oy; let ok = true;
      for(let j=-1;j<=2;j++) for(let i=-1;i<=3;i++){ if(roadTiles.has((hy+j)*MW+hx+i) && j>=0 && j<2 && i>=0 && i<3) ok = false; }
      if(!ok) continue; for(let j=0;j<2;j++) for(let i=0;i<3;i++) set(hx+i,hy+j,T_HOUSE); made++; }
    deco.push({k:h.kind==="town"?"fountain":"fire", x:h.x*TILE+16, y:h.y*TILE+16});
  }
  deco.push({k:"fire",x:LAIRS.banditcamp.x*TILE+16,y:LAIRS.banditcamp.y*TILE+16});
  [[-4,-3],[3,-4],[-5,2],[4,3],[0,5]].forEach(([dx,dy])=>deco.push({k:"tent",x:(LAIRS.banditcamp.x+dx)*TILE+16,y:(LAIRS.banditcamp.y+dy)*TILE+16}));
  [CRYPT.x0+3, CRYPT.x1-3].forEach(x=>deco.push({k:"brazier",x:x*TILE+16,y:(CRYPT.y0+4)*TILE+16}));
  [[-4,-3],[4,-3],[-4,3],[4,3]].forEach(([dx,dy])=>deco.push({k:"brazier",x:(LAIRS.magma.x+dx)*TILE+16,y:(LAIRS.magma.y+dy)*TILE+16}));
  const gr = rng(77); for(let i=0;i<12;i++){ const x=125+Math.floor(gr()*30), y=105+Math.floor(gr()*28); if(!solidAt(x,y)&&zmap[y*MW+x]==="dimma") deco.push({k:"grave",x:x*TILE+16,y:y*TILE+16}); }
  // reachability from the first town
  const h0 = HUBS.frostvik; reach = new Uint8Array(MW*MH); const q=[h0.y*MW+h0.x]; reach[q[0]]=1;
  while(q.length){ const i=q.pop(), x=i%MW, y=(i/MW)|0; for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+ox, ny=y+oy, j=ny*MW+nx; if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&!reach[j]&&!SOLID.has(map[j])){ reach[j]=1; q.push(j);} } }
  for(let i=0;i<MW*MH;i++) if(!reach[i]&&!SOLID.has(map[i])){ const z=ZONES[parentZone(zmap[i])]; map[i] = z ? BORDER[z.t] : T_CLIFF; }
  carveDungeons();
}

// random reachable tile matching a predicate
const R = rng(2024);
function pickTile(pred, tries=6000){
  for(let i=0;i<tries;i++){ const x=2+Math.floor(R()*(OW-4)), y=2+Math.floor(R()*(MH-4)); const j=y*MW+x;
    if(reach[j] && !SOLID.has(map[j]) && pred(x,y,zmap[j],map[j])) return {x,y}; }
  return null;
}

// ======================= STATE =======================
let S = null, P = null, mobs = [], nodes = [], npcs = [], qobjs = [], projs = [], parts = [], floats = [], zones = [];
let running = false, time = 0, curZone = null;
const T = id => (S && S.talents[id]) || 0;

function newSave(name, race, cls){
  return {v:3, name, race, cls, level:1, xp:0, gold:5, weapon:0, bag:{potHp:3}, qbag:{}, gear:[], eq:{}, skills:{mining: race==="dwarf"?25:1, herb:1}, talents:{}, quests:{}, learned:[BARS[cls][0]], x:null, y:null, t:Date.now()};
}

function spawnAll(){
  mobs = []; nodes = []; npcs = []; qobjs = [];
  const used = new Set();
  const free = (x,y,t) => !used.has(y*MW+x) && !(t===T_PATH && R()<0.7) && !nearHub(x,y,5) && !(y>=CRYPT.y0-1 && y<=CRYPT.y1+1 && x>=CRYPT.x0-1 && x<=CRYPT.x1+1);
  const mark = p => { for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++) used.add((p.y+oy)*MW+p.x+ox); };
  for(const [type, count, zone, opt] of SPAWNS){
    const d = MOBS[type];
    for(let i=0;i<count;i++){
      const p = pickTile((x,y,z,t)=>{ if(z!==zone || !free(x,y,t)) return false;
        if(opt && opt.near){ const l = LAIRS[opt.near]; if(Math.hypot(x-l.x,y-l.y) > opt.r) return false; }
        for(const l of Object.values(LAIRS)) if(!(opt&&opt.near) && Math.hypot(x-l.x,y-l.y) < l.r+3) return false;
        return true; });
      if(!p) continue; mark(p);
      mobs.push(makeMob(type, p.x, p.y, d.lv[0] + Math.floor(R()*(d.lv[1]-d.lv[0]+1))));
    }
  }
  for(const [type, o] of FIXED_MOBS){
    let p = null;
    if(o.lair) p = {x:LAIRS[o.lair].x, y:LAIRS[o.lair].y+1};
    else if(o.crypt) p = CRYPT.boss;
    else p = pickTile((x,y,z,t)=>z===o.zone && free(x,y,t) && hubDist(x,y,o.far) > o.d);
    if(p) mobs.push(makeMob(type, p.x, p.y, MOBS[type].lv[0]));
  }
  for(const [kind, count, zone] of NODE_SPAWNS){ for(let i=0;i<count;i++){
    const p = pickTile((x,y,z,t)=>z===zone && t!==T_PATH && free(x,y,t)); if(!p) continue; used.add(p.y*MW+p.x);
    nodes.push({kind, def:NODES[kind], x:p.x*TILE+16, y:p.y*TILE+16, active:true, respawn:0}); } }
  for(const [id, it] of Object.entries(QITEMS)){ if(!it.zone) continue; for(let i=0;i<it.count;i++){
    const p = pickTile((x,y,z,t)=>z===it.zone && t!==T_PATH && free(x,y,t) && (!it.far || hubDist(x,y,it.far) > it.d)); if(!p) continue; used.add(p.y*MW+p.x);
    qobjs.push({qitem:id, def:it, x:p.x*TILE+16, y:p.y*TILE+16, active:true, respawn:0}); } }
  const byHub = {};
  for(const n of NPCS){ if(n.at){ npcs.push({...n, x:n.at.x*TILE+16, y:n.at.y*TILE+16, fx:1}); continue; } (byHub[n.hub] = byHub[n.hub] || []).push(n); }
  for(const [hid, list] of Object.entries(byHub)){ const h = HUBS[hid], rad = h.kind==="town" ? 4.9 : 2.4;
    list.forEach((n,i)=>{ const a = i/list.length*Math.PI*2 - Math.PI/2 + 0.3; let rr = rad, x, y;
      do { x = h.x*TILE+16 + Math.cos(a)*rr*TILE; y = h.y*TILE+16 + Math.sin(a)*rr*TILE; rr -= 0.25; } while(collides(x, y, 10) && rr > 1);
      npcs.push({...n, x, y, fx: x < h.x*TILE ? 1 : -1}); }); }
  spawnDungeons();
}

function makeMob(type, tx, ty, lvl){
  const d = MOBS[type], el = d.elite||1;
  const m = {type, def:d, name:d.name, lvl, elite:!!d.elite, x:tx*TILE+16, y:ty*TILE+16, hx:tx*TILE+16, hy:ty*TILE+16, r:d.r, sp:d.sp,
    maxHp:Math.round((30+lvl*18)*el*(d.hpm||1)), dmg:(3+lvl*2.4)*(d.elite?1.25:1)*(d.passive?0.6:1)*(d.dmm||1), atkSpd:d.boss?2.2:2.0, state:"idle", dots:[], slowT:0, slowPct:0, rootT:0, stunT:0,
    atkT:0, wanderT:rand(1,4), wx:null, wy:null, specT:d.special?d.special.every:0, tele:null, dead:false, respawn:0, fx:1, flash:0, swing:0, evading:false, ph:Math.random()*6};

}
function respawnMob(m){ Object.assign(m, {dead:false, hp:m.maxHp, x:m.hx, y:m.hy, state:"idle", dots:[], slowT:0, rootT:0, stunT:0, tele:null, evading:false}); }

// ======================= STATS =======================
function resType(){ return P.form==="bear"?"rage" : P.form==="cat"?"energy" : CLASSES[S.cls].res; }
function maxRes(type){ return type==="mana" ? P.maxMana : 100; }
function addRes(type, n){ P[type] = clamp(P[type]+n, 0, maxRes(type)); }
// attack power (weapons, arrows, physical abilities) and spell power (spells and healing)
function pow(){ return 6 + S.level*2.6 + S.weapon*2.5 + gearStat("pow"); }
function spow(){ return (6 + S.level*2.6 + S.weapon*2.5 + gearStat("sp")) * (P && P.buffs && P.buffs.sage ? 1.2 : 1); }
function teff(k){ if(!S) return 0; let v=0; for(const t of TALENTS[S.cls]) if(t.eff&&t.eff[k]) v += t.eff[k]*T(t.id); return v; }
function genMult(){ let m=1+teff("dmg"); if(S.race==="orc") m*=1.1; if(P.buffs.shout) m*=1.15; if(P.buffs.elixir) m*=1.2; if(P.buffs.avenging) m*=1.2; if(T("trueshot")) m*=1.1; if(T("heartWild")) m*=1.1; return m; }
function tmul(ab, school){
  let m = 1;
  if(S.cls==="mage"){ if(school==="fire") m*=1+0.08*T("impFire"); if(school==="frost") m*=1+0.08*T("iceShards"); }
  if(S.cls==="warrior"){ if(ab==="heroic") m*=1+0.1*T("impHS"); if(ab==="whirlwind"||ab==="execute") m*=1+0.1*T("bloodFury"); }
  if(S.cls==="hunter"){ if(ab==="firearrow") m*=1+0.15*T("fireArrows"); if(ab==="icearrow") m*=1+0.15*T("iceArrows"); }
  if(S.cls==="priest"){ if(ab==="swp") m*=1+0.1*T("impSWP"); if(school==="shadow") m*=(1+0.06*T("shadowWeave"))*(T("shadowform")?1.15:1); }
  if(S.cls==="paladin" && school==="holy") m*=1+0.08*T("palHoly");
  if(S.cls==="druid"){ if(["wrath","moonfire","starfire"].includes(ab)) m*=1+0.08*T("moonfury"); if(P.form) m*=1+0.08*T("feral"); }
  return m;
}
function critChance(m, school){
  let c = 0.05 + gearStat("crit")/100 + (P && P.buffs && P.buffs.keen ? 0.05 : 0); if(S.race==="elf") c+=0.05;
  c += 0.03*T("cruelty") + 0.03*T("lethal") + teff("crit");
  if(school==="holy") c += 0.03*T("holySpec");
  if(S.cls==="mage" && m && (m.slowT>0||m.rootT>0)) c += 0.12*T("shatter");
  return c;
}
function takenMult(){ let m = CLASSES[S.cls].armor; if(P.form==="bear") m = 0.6*(1-0.05*T("thickHide")); if(P.form==="cat") m = 0.9; if(T("shadowform")) m*=0.85; if(P.buffs.bark) m*=0.75; m *= 1-teff("def"); m *= 1 - Math.min(0.25, gearStat("def")/100); if(P.buffs.ironskin) m *= 0.85; return m; }
function costOf(id){ let c = AB[id].cost||0; if(S.cls==="hunter") c *= 1-0.1*T("efficiency"); return Math.round(c); }
function castTime(id){ const a = AB[id]; let c = a.cast||0; if(!c) return 0;
  if(["fireball","frostbolt","pyroblast"].includes(id)) c -= 0.25*T("quickCast");
  if(["wrath","starfire"].includes(id)) c -= 0.15*T("naturesGrace");
  if(id==="aimed"&&T("trueshot")) c -= 1;
  if(id==="palheal") c -= 0.3*T("palQuick");
  if(id==="pyroblast"&&P.buffs.hotstreak) c = 0;
  return Math.max(0,c); }
function xpNeed(l){ return Math.round((100 + l*l*12 + l*40)*2); }
function talentPoints(){ return Math.max(0, S.level-9); }
function talentsSpent(){ return Object.values(S.talents).reduce((a,b)=>a+b,0); }

function recompute(full){
  const c = CLASSES[S.cls]; let hp = (80+S.level*22)*c.hp + gearStat("hp");
  if(S.race==="dwarf") hp*=1.15;
  hp *= 1 + 0.06*T("toughness") + 0.06*T("endurance") + 0.05*T("naturalist") + teff("hp");
  if(P.form==="bear") hp *= 1.6*(1+0.1*T("heartWild"));
  const pct = P.maxHp ? P.hp/P.maxHp : 1;
  P.maxHp = Math.round(hp); P.hp = full ? P.maxHp : Math.max(1, P.maxHp*pct);
  let mana = 100 + S.level*22 + gearStat("mana"); if(S.race==="elf") mana*=1.1; mana *= 1 + 0.1*T("arcMind") + 0.1*T("spiritual") + 0.1*T("palWis");
  P.maxMana = Math.round(mana); P.mana = full ? P.maxMana : Math.min(P.mana, P.maxMana);
}

// ======================= COMBAT =======================
function setTarget(m){ P.target = m; }
function nearestEnemy(range){ let best=null, bd=range; for(const m of mobs){ if(m.dead||m.evading) continue; const d=dist(P,m)-m.r; if(d<bd){bd=d;best=m;} } return best; }
function cycleTarget(){ const list = mobs.filter(m=>!m.dead&&!m.evading&&dist(P,m)<420).sort((a,b)=>dist(P,a)-dist(P,b)); if(!list.length){ setTarget(null); return; } const i = list.indexOf(P.target); setTarget(list[(i+1)%list.length]); }
function aggroRange(m){ if(m.def.boss) return 170; return clamp(120 + (m.lvl-S.level)*8, 50, 170); }
function anchor(m){ m.lx = m.x; m.ly = m.y; m.lastHit = time; }
function aggro(m){ m.state = "chase"; m.path = null; anchor(m); }
function engage(m){ if(m && !m.dead && m.state==="idle"){ aggro(m); social(m); } P.combatT = 6; }
function social(m){ if(m.def.boss || m.def.passive) return; for(const o of mobs) if(o!==m&&!o.dead&&o.state==="idle"&&o.type===m.type&&dist(o,m)<110){ aggro(o); } }
// line of sight for a moving body, and a tile path (BFS) around obstacles
function clearLine(ax, ay, bx, by, r){ const d = Math.hypot(bx-ax, by-ay), n = Math.ceil(d/8); for(let i=1;i<=n;i++){ const t = i/n; if(collides(ax+(bx-ax)*t, ay+(by-ay)*t, r)) return false; } return true; }
function findPath(m, gx, gy){
  const sx = Math.floor(m.x/TILE), sy = Math.floor(m.y/TILE), tx = Math.floor(gx/TILE), ty = Math.floor(gy/TILE), pad = 14;
  const x0 = Math.max(0, Math.min(sx,tx)-pad), x1 = Math.min(MW-1, Math.max(sx,tx)+pad), y0 = Math.max(0, Math.min(sy,ty)-pad), y1 = Math.min(MH-1, Math.max(sy,ty)+pad);
  const w = x1-x0+1, h = y1-y0+1, prev = new Int32Array(w*h).fill(-1), start = (sy-y0)*w+(sx-x0), goal = (ty-y0)*w+(tx-x0);
  const q = [start]; prev[start] = start; let head = 0, found = false;
  while(head < q.length){ const i = q[head++]; if(i === goal){ found = true; break; } const x = i%w, y = (i/w)|0;
    for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x+ox, ny = y+oy; if(nx<0||ny<0||nx>=w||ny>=h) continue; const j = ny*w+nx; if(prev[j] !== -1 || solidAt(x0+nx, y0+ny)) continue; prev[j] = i; q.push(j); } }
  if(!found) return null;
  const out = []; for(let i = goal; i !== start; i = prev[i]) out.push({x:(x0+i%w)*TILE+16, y:(y0+((i/w)|0))*TILE+16});
  return out.reverse();
}
function steer(m, gx, gy, dt, spd){
  const r = Math.min(m.r, 12) - 1; let tx = gx, ty = gy;
  if(!clearLine(m.x, m.y, gx, gy, r)){
    m.pathT = (m.pathT||0) - dt;
    if(!m.path || m.pathT <= 0){ m.path = findPath(m, gx, gy); m.pathT = 0.6; }
    if(m.path && m.path.length){ while(m.path.length > 1 && clearLine(m.x, m.y, m.path[1].x, m.path[1].y, r)) m.path.shift();
      tx = m.path[0].x; ty = m.path[0].y; if(Math.hypot(tx-m.x, ty-m.y) < 6) m.path.shift(); }
  } else m.path = null;
  const d = Math.hypot(tx-m.x, ty-m.y) || 1, dx = (tx-m.x)/d, dy = (ty-m.y)/d;
  moveEnt(m, dx*spd*dt, dy*spd*dt); m.fx = dx<0?-1:1; m.walk = true;
}

function hit(m, base, school, ab){
  if(!m || m.dead) return null;
  if(m.evading){ floatText(m.x, m.y-m.r-10, "Undvek", "#cfd8dc"); return null; }
  const ld = m.lvl - S.level;
  if(ld > 0 && Math.random() < Math.min(0.35, 0.06*ld)){ floatText(m.x, m.y-m.r-14, "Miss", "#cfd8dc"); engage(m); return null; }
  let amt = base * genMult() * tmul(ab, school) * rand(0.92, 1.08) * lvlPenalty(m);
  const crit = Math.random() < critChance(m, school);
  if(crit) amt *= 2*(1+0.1*T("mortal"));
  amt = Math.max(1, Math.round(amt));
  damageMob(m, amt, crit, school);
  if(crit){
    if(school==="holy" && T("lightbringer")) healP(amt*0.3);
    if(school==="fire" && T("ignite")) dot(m, "ignite", amt*0.15*T("ignite"), 4, "fire", true);
    if(S.cls==="warrior" && school==="phys" && T("deepWounds")) dot(m, "deep", amt*0.15*T("deepWounds"), 4, "phys", true);
    if(T("hotStreak") && (ab==="fireball"||ab==="fireblast")){ buff("hotstreak", 15); log("Het svit! Nästa Pyroblast är omedelbar.", "#ffb347"); }
  }
  return {amt, crit};
}
function lvlPenalty(m){ const d = m.lvl - S.level; return d > 0 ? Math.max(0.5, 1 - 0.06*d) : 1; }
function damageMob(m, amt, crit, school){
  if(m.dead) return;
  m.hp -= amt; m.flash = 0.12; anchor(m);
  floatText(m.x + rand(-8,8), m.y - m.r - 14, crit ? amt+"!" : ""+amt, SCHOOL_COLOR[school]||"#fff", crit);
  engage(m);
  if(m.hp <= 0) killMob(m);
}
function dot(m, key, total, dur, school, raw){
  if(!m || m.dead || m.evading) return;
  if(!raw) total *= genMult();
  total *= lvlPenalty(m);
  m.dots = m.dots.filter(d=>d.key!==key);
  m.dots.push({key, per:total/dur, left:dur, tick:1, school});
  engage(m);
}
function slow(m, pct, dur){ if(!m||m.dead) return; engage(m); anchor(m); m.slowPct = Math.max(pct, m.slowT>0?m.slowPct:0); m.slowT = Math.max(m.slowT, dur); }
function root(m, dur){ if(!m||m.dead||m.def.boss) return; engage(m); anchor(m); m.rootT = Math.max(m.rootT, dur); }
function stun(m, dur){ if(!m||m.dead) return; engage(m); anchor(m); m.stunT = Math.max(m.stunT, m.def.boss?dur*0.4:dur); m.tele = null; }
function aoe(x, y, r, fn){ mobs.filter(m=>!m.dead&&!m.evading&&Math.hypot(m.x-x,m.y-y)<r+m.r).forEach(fn); }
function zone(x, y, r, dur, dmg, school, ab, slows){ zones.push({x, y, r, left:dur, tick:0.4, dmg, school, ab, slows}); }
function proj(t, color, size, onHit, kind, sp){ projs.push({x:P.x, y:P.y-14, t, color, size, onHit, kind:kind||"orb", sp:sp||(kind==="arrow"?680:540)}); }
function buff(name, dur){ P.buffs[name] = dur; }
// ---- resting: sit down out of combat (X) for faster health and mana regen
const REST_DELAY = 5;
function canRest(){ if(!P || P.dead) return "Du kan inte vila nu"; if(P.combatT > 0) return "Du kan inte vila i strid";
  if(P.combatT > -REST_DELAY) return `Vänta ${Math.ceil(REST_DELAY + P.combatT)} sek efter striden`; if(P.form) return "Återgå till normal form för att vila"; return null; }
function sitDown(){ const why = canRest(); if(why) return err(why); P.sitting = true;  P.sitFull = false; P.casting = null; P.autoTarget = null; floatText(P.x, P.y-56, "Vilar", "#9fd6e8"); }
function standUp(){ P.sitting = false;  }
function toggleRest(){ if(P.sitting) standUp(); else sitDown(); }
function healP(n){ n = Math.round(n); const before = P.hp; P.hp = Math.min(P.maxHp, P.hp+n); const got = Math.round(P.hp-before); if(got>0) floatText(P.x, P.y-40, "+"+got, "#7be08a"); }
function hot(key, total, dur){ P.hots = P.hots.filter(h=>h.key!==key); P.hots.push({key, per:total/dur, left:dur, tick:1}); }
function addCP(){ P.cp = Math.min(5, P.cp+1); }
function setForm(f){
  if(P.casting) cancelCast();
  P.form = f; P.cp = 0;
  if(f==="bear") P.rage = Math.max(P.rage, 10);
  if(f==="cat") P.energy = 100;
  recompute(false);
  ring(P.x, P.y, 40, f==="bear"?"#c89a68":f==="cat"?"#c9a3ff":f==="leopard"?"#ffd36b":"#9cf07a");
  buildHotbar();
}

function killMob(m){
  m.dead = true; m.hp = 0; m.dots = []; m.tele = null; m.state = "idle";
  m.respawn = m.def.dg ? 1e9 : m.def.boss ? 150 : m.elite ? 90 : 28;
  if(P.target === m) P.target = null;
  const diff = m.lvl - S.level;
  let xp = 0;
  if(diff > -5){ xp = (18 + m.lvl*9) * (m.elite ? 4 : 1) * clamp(1 + diff*0.1, 0.3, 1.5); }
  const got = [];
  if(!BEASTS.has(m.type)){ const gold = Math.max(1, Math.round((1 + m.lvl*0.8) * (m.elite?6:1) * rand(0.7,1.3))); S.gold += gold; got.push(`${gold} guld`); }
  for(const [it, ch] of (LOOT[m.type] || [[m.def.drop, m.elite ? 1 : 0.35]])) if(ITEMS[it] && Math.random() < ch){ addItem(it, 1); got.push(ITEMS[it].name); }
  if(m.elite && Math.random()<0.7){ addItem("potHp2",1); got.push("Stor läkedryck"); }
  log(got.length ? `${m.name} besegrad. Du plundrade ${got.join(", ")}.` : `${m.name} besegrad.`, "#d9e3e7");
  mobGearDrop(m);
  burst(m.x, m.y, m.def.color, 16);
  if(T("bloodthirst")) healP(P.maxHp*0.15);
  if(xp>0) gainXP(xp);
  questKill(m.type);
  if(m.def.boss || m.elite){ showBanner(`${m.name} har fallit!`, "", 4); }
  if(m.def.dg) dungeonKill(m);
}

function avoidChances(){
  const pb = (S.cls==="warrior"||S.cls==="paladin") ? 0.04 : S.cls==="hunter" ? 0.02 : (S.cls==="druid" && P.form==="bear") ? 0.02 : 0;
  const dodge = 0.04 + teff("dodge") + (P.form==="cat" ? 0.03 : 0) + (S.race==="elf" ? 0.01 : 0);
  const parry = pb > 0 ? pb + teff("parry") : 0;
  return {dodge:Math.min(dodge, 0.1), parry:Math.min(parry, 0.09)};
}
function mobMiss(m){ return m ? clamp(0.05 + (S.level - m.lvl)*0.01, 0.01, 0.1) : 0.05; }
function playerDamage(raw, src, kind){
  if(P.dead) return;
  if(P.buffs.bubble){ floatText(P.x, P.y-44, "Immun", "#fff2b0"); return; }
  if(kind){ const av = avoidChances(), r = Math.random(); let txt = null;
    if(r < mobMiss(src)) txt = "Miss";
    else if(r < mobMiss(src) + av.dodge) txt = "Undvek";
    else if(kind==="melee" && r < mobMiss(src) + av.dodge + av.parry) txt = "Parerade";
    if(txt){ floatText(P.x + rand(-6,6), P.y-44, txt, "#cfe0e6"); P.combatT = 6; if(src && (!P.target || P.target.dead)) setTarget(src); return; } }
  if(src && src.lvl > S.level) raw *= 1 + 0.1*(src.lvl - S.level);
  let amt = Math.max(1, Math.round(raw * rand(0.9,1.1) * takenMult()));
  if(P.shield > 0){ const ab = Math.min(P.shield, amt); P.shield -= ab; amt -= ab; if(ab>0) floatText(P.x+10, P.y-46, "Absorberat", "#fff6d0"); }
  if(amt>0){ P.hp -= amt; floatText(P.x + rand(-6,6), P.y-44, "-"+amt, "#ff6b5e"); P.hurt = 0.18; }
  P.combatT = 6;
  if(resType()==="rage") addRes("rage", 2 + amt/P.maxHp*60);
  if(src && (!P.target || P.target.dead)) setTarget(src);
  if(P.hp <= 0) die();
}
function die(){
  P.dead = true; P.hp = 0; P.casting = null; if(P.sitting) standUp(); P.dash = null; P.leap = null;
  for(const m of mobs) if(m.state==="chase") evade(m);
  document.getElementById("dead").hidden = false;
  log("Du har dött.", "#ff6b5e");
}
function revive(){
  P.dead = false;
  if(P.inDungeon){ reviveFromDungeon(); return; }
  const sp = Object.values(HUBS).sort((a,b)=>Math.hypot(P.x/TILE-a.x,P.y/TILE-a.y)-Math.hypot(P.x/TILE-b.x,P.y/TILE-b.y))[0];
  P.x = sp.x*TILE+16; P.y = (sp.y+2)*TILE+16;
  P.hp = P.maxHp*0.6; P.mana = P.maxMana*0.6; P.target = null; P.shield = 0;
  document.getElementById("dead").hidden = true;
  showBanner(sp.name, "Du har återuppstått", 2.5);
  save(true);
}
function evade(m){ m.state = "return"; m.evading = true; m.dots = []; m.tele = null; }

// ---- abilities
function tryUse(id){
  if(!id || P.dead || !running) return;
  const a = AB[id];
  if(!S.learned.includes(id)) return;
  if(P.casting){ if(P.casting.kind==="gather") cancelCast(); else return; }
  if(P.form==="leopard" && !a.form) return err("Du kan inte attackera eller kasta formler i leopardform");
  if(!a.offGcd && P.gcd > 0) return;
  if((P.cds[id]||0) > 0) return err("Inte redo än");
  let t = null;
  if(a.tgt === "enemy"){
    t = P.target;
    if(!t || t.dead || t.evading){ t = nearestEnemy(a.range + 60); if(!t) return err("Du har inget mål"); setTarget(t); }
    const d = dist(P,t) - t.r;
    if(d > a.range) return err("För långt bort");
    if(a.minRange && d < a.minRange) return err("För nära");
  }
  if(a.check){ const c = a.check(t); if(c !== true) return err(c); }
  const type = resType(), cost = costOf(id);
  if(P[type] < cost) return err(`Inte tillräckligt med ${RES_NAME[type].toLowerCase()}`);
  const ct = castTime(id);
  if(!a.offGcd) P.gcd = 1.0;
  if(ct > 0){ P.casting = {kind:"spell", id, t, total:ct, el:0, label:a.name}; }
  else { P[type] -= cost; finishAbility(id, t); }
}
function finishAbility(id, t){
  const a = AB[id];
  if(a.cd) P.cds[id] = a.cd;
  if(id==="pyroblast" && P.buffs.hotstreak) delete P.buffs.hotstreak;
  a.run(t);
  if(!a.form && !P.form){ const cls = S.cls; setAct(P, cls==="paladin" ? ((a.tgt==="enemy" && a.range<=60) || id==="consecrate" ? "slash" : "cast") : cls==="warrior" ? (a.tgt==="enemy"||a.range===0 ? "slash" : null) : cls==="hunter" ? (a.tgt==="enemy" ? "bow" : null) : "cast"); }
  if(t) P.dir = dirOf(t.x-P.x, t.y-P.y);
  if(t) P.combatT = 6;
  if(t && P.target !== t) setTarget(t);
}
function cancelCast(why){ if(!P.casting) return; if(why && P.casting.kind==="spell") err(why); P.casting = null; }
function completeCast(){
  const c = P.casting; P.casting = null;
  if(c.kind === "gather") return finishGather(c.node);
  const a = AB[c.id], t = c.t;
  if(a.tgt==="enemy"){ if(!t || t.dead) return; if(dist(P,t)-t.r > a.range+40) return err("För långt bort"); }
  const type = resType(), cost = costOf(c.id);
  if(P[type] < cost) return err(`Inte tillräckligt med ${RES_NAME[type].toLowerCase()}`);
  P[type] -= cost; finishAbility(c.id, t);
}
function autoInfo(){
  if(P.form==="bear") return {range:55, spd:2.0, mult:1.0, rage:8};
  if(P.form==="cat") return {range:52, spd:1.1, mult:0.55};
  if(S.cls==="warrior") return {range:52, spd:2.2, mult:1.0, rage:9};
  if(S.cls==="hunter") return {range:320, spd:2.0, mult:0.85, ranged:true};
  if(S.cls==="paladin") return {range:52, spd:2.4, mult:1.0};
  return {range:52, spd:2.4, mult:0.6};
}
function autoAttack(dt){
  const ai = autoInfo(); P.autoT = Math.max(0, P.autoT - dt);
  const t = P.target; if(P.autoTarget && (P.autoTarget!==t || P.autoTarget.dead)) P.autoTarget = null;
  if(P.form==="leopard") return;
  if(!ai || !t || t!==P.autoTarget || t.dead || t.evading || P.casting || P.dash || P.autoT>0) return;
  if(dist(P,t) - t.r > ai.range) return;
  P.autoT = ai.spd; P.swing = 0.2; P.dir = dirOf(t.x-P.x, t.y-P.y);
  if(!P.form) setAct(P, (S.cls==="warrior"||S.cls==="paladin") ? "slash" : S.cls==="hunter" ? "bow" : "thrust");
  if(ai.ranged) proj(t, "#e9e2c8", 3, ()=>hit(t, pow()*ai.mult, "phys", "auto"), "arrow");
  else { hit(t, pow()*ai.mult, "phys", "auto"); if(ai.rage) addRes("rage", ai.rage); }
  P.combatT = 6;
}
function usePotion(kind){
  if(P.dead) return;
  if(P.potCd > 0) return err("Drycker är inte redo än");
  if(kind==="hp"){ const k = ["potHp3","potHp2","potHp"].find(x=>S.bag[x]>0); if(!k) return err("Du har inga läkedrycker"); useItem(k); }
  else { const k = ["potMana2","potMana"].find(x=>S.bag[x]>0); if(!k) return err("Du har inga manadrycker"); useItem(k); }
}
function useItem(k){
  if(!S.bag[k]) return;
  if(k.startsWith("pot")){ if(P.potCd>0) return err("Drycker är inte redo än"); P.potCd = 20; }
  if(k==="potHp") healP(P.maxHp*0.4);
  else if(k==="potHp2") healP(P.maxHp*0.75);
  else if(k==="potHp3") healP(P.maxHp);
  else if(k==="potMana"||k==="potMana2"){ P.mana = Math.min(P.maxMana, P.mana + P.maxMana*(k==="potMana2"?1:0.5)); floatText(P.x, P.y-40, "+mana", "#7fb2ff"); }
  else if(k==="elixir"){ buff("elixir", 300); log("Styrkeelixiret ger dig +20% skada i 5 minuter.", "#ffd36b"); }
  else if(k==="elixirIron"){ buff("ironskin", 600); log("Järnhudselixiret: du tar 15% mindre skada i 10 minuter.", "#c8c8d0"); }
  else if(k==="elixirKeen"){ buff("keen", 600); log("Skärpeelixiret: +5% kritisk träff i 10 minuter.", "#ffb347"); }
  else if(k==="elixirSage"){ buff("sage", 600); log("Visdomselixiret: +20% formelkraft i 10 minuter.", "#9fd6e8"); }
  else return;
  removeItem(k, 1); burst(P.x, P.y-10, "#ff6b8a", 8);
  if(panelKind==="bag") renderPanel();
}

// ---- items / gathering / xp
function addItem(k, n){ S.bag[k] = (S.bag[k]||0) + n; }
function removeItem(k, n){ S.bag[k] = (S.bag[k]||0) - n; if(S.bag[k] <= 0) delete S.bag[k]; }
function startGather(n){
  if(n.qitem){ if(!needsQItem(n.qitem)) return err("Du behöver inte det här just nu"); P.casting = {kind:"gather", node:n, total:1.2, el:0, label:"Plockar upp "+n.def.name}; return; }
  const d = n.def, sk = S.skills[d.skill];
  if(sk < d.req) return err(`Kräver ${d.skill==="mining"?"Gruvdrift":"Örtplockning"} ${d.req} (du har ${sk})`);
  P.casting = {kind:"gather", node:n, total:1.6, el:0, label:(d.skill==="mining"?"Bryter ":"Plockar ")+ITEMS[d.item].name};
}
function finishGather(n){
  if(!n.active) return;
  if(n.qitem){ n.active = false; n.respawn = 25; S.qbag[n.qitem] = (S.qbag[n.qitem]||0) + 1; floatText(n.x, n.y-24, "+1 "+n.def.name, "#f2e2a0"); burst(n.x, n.y, "#f2e2a0", 10); questProgressLog(n.qitem); refreshTracker(); return; }
  const d = n.def; n.active = false; n.respawn = 45;
  const qty = Math.random()<0.25 ? 2 : 1; addItem(d.item, qty);
  floatText(n.x, n.y-24, `+${qty} ${ITEMS[d.item].name}`, "#f2e2a0");
  const sk = S.skills[d.skill], diff = sk - d.req;
  const gain = diff < 30 ? 2 : diff < 60 ? 1 : 0;
  if(gain && sk < SKILL_MAX){ S.skills[d.skill] = Math.min(SKILL_MAX, sk + gain); log(`${d.skill==="mining"?"Gruvdrift":"Örtplockning"} ökade till ${S.skills[d.skill]}.`, "#9fd6e8"); }
  gainXP((6 + S.level*3) * (gain?1:0.5));
  burst(n.x, n.y, d.color, 10);
  refreshTracker();
}
function gainXP(n){
  if(S.level >= MAX_LVL) return;
  n = Math.round(n * (S.race==="human" ? 1.1 : 1));
  S.xp += n; floatText(P.x, P.y-58, `+${n} XP`, "#b79bff");
  while(S.level < MAX_LVL && S.xp >= xpNeed(S.level)){ S.xp -= xpNeed(S.level); S.level++; levelUp(); }
  if(S.level >= MAX_LVL) S.xp = 0;
}
function levelUp(){
  recompute(true); P.rage = P.rage||0;
  ring(P.x, P.y, 70, "#ffd36b"); burst(P.x, P.y, "#ffd36b", 30);
  const canTrain = allBarIds().some(id=>AB[id].lvl===S.level && !S.learned.includes(id));
  let sub = canTrain ? "Din tränare i hembyn har något nytt att lära dig." : "Du känner dig starkare.";
  if(S.level === 10) sub = "Talangsystemet är upplåst! Tryck N." + (canTrain ? " Besök också din tränare." : "");
  else if(S.level > 10) sub += " +1 talangpoäng.";
  if(canTrain) log("Du kan lära dig något nytt hos din tränare.", "#9fd6e8");
  showBanner(`Nivå ${S.level}!`, sub, 4);
  log(`Du nådde nivå ${S.level}.`, "#ffd36b");
  buildHotbar(); save(true);
}
function allBarIds(){ return S.cls==="druid" ? [...new Set([...BARS.druid, ...BARS.druid_bear, ...BARS.druid_cat])] : BARS[S.cls]; }

// ---- quests
const qById = id => QUESTS.find(q=>q.id===id);
const prereqOk = q => (q.req||[]).every(r=>S.quests[r]&&S.quests[r].state==="done");
function qAvailable(q){ return !S.quests[q.id] && prereqOk(q) && S.level >= q.lvl; }
function qSoon(q){ return !S.quests[q.id] && prereqOk(q) && S.level < q.lvl; }
function qGray(q){ return S.level - q.lvl >= 5; }
function qXP(q){ const d = S.level - q.lvl, f = d<=1 ? 1 : Math.max(0.1, 1-(d-1)*0.2); return Math.round(xpNeed(q.lvl)*0.3*(q.mult||1)*f); }
function qGold(q){ return Math.round((3 + q.lvl*q.lvl*0.5)*(q.mult||1)); }
const qTurnInNpc = q => q.to || q.npc;
function qProg(q, i){ const o = q.obj[i]; if(o[0]==="gather") return Math.min(S.bag[o[1]]||0, o[2]); if(o[0]==="collect"||o[0]==="loot") return Math.min(S.qbag[o[1]]||0, o[2]); return Math.min(S.quests[q.id].prog[i]||0, o[2]); }
function qReady(q){ const s = S.quests[q.id]; return !!s && s.state==="active" && q.obj.every((o,i)=>qProg(q,i)>=o[2]); }
function objName(o){ return o[0]==="kill" ? MOBS[o[1]].name : o[0]==="gather" ? ITEMS[o[1]].name : QITEMS[o[1]].name; }
function needsQItem(item){ return QUESTS.some(q=>{ const s = S.quests[q.id]; return s && s.state==="active" && q.obj.some(o=>(o[0]==="collect"||o[0]==="loot") && o[1]===item && (S.qbag[item]||0) < o[2]); }); }
function questProgressLog(item){ for(const q of QUESTS){ const s = S.quests[q.id]; if(!s || s.state!=="active") continue; q.obj.forEach((o,i)=>{ if(o[1]===item && (o[0]==="collect"||o[0]==="loot")) log(`${q.name}: ${QITEMS[item].name} ${qProg(q,i)}/${o[2]}`, "#e6bd5c"); }); if(qReady(q)) log(`${q.name} är klart – lämna in hos ${npcName(qTurnInNpc(q))}.`, "#7be08a"); } }
const npcName = id => (NPCS.find(n=>n.id===id)||{}).name || id;
function acceptQuest(id){ const q = qById(id); if(!qAvailable(q)) return; S.quests[id] = {state:"active", prog:q.obj.map(()=>0)}; log(`Nytt uppdrag: ${q.name}`, "#e6bd5c"); if(qReady(q) && q.to) log(`Gå till ${npcName(q.to)}.`, "#e6bd5c"); refreshTracker(); save(); }
function questKill(type){
  for(const q of QUESTS){ const s = S.quests[q.id]; if(!s || s.state!=="active") continue;
    q.obj.forEach((o,i)=>{
      if(o[0]==="kill" && o[1]===type && s.prog[i] < o[2]){ s.prog[i]++; log(`${q.name}: ${MOBS[type].name} ${s.prog[i]}/${o[2]}`, "#e6bd5c"); if(qReady(q)) log(`${q.name} är klart – lämna in hos ${npcName(qTurnInNpc(q))}.`, "#7be08a"); }
      if(o[0]==="loot" && o[3]===type && (S.qbag[o[1]]||0) < o[2] && Math.random() < o[4]){ S.qbag[o[1]] = (S.qbag[o[1]]||0)+1; questProgressLog(o[1]); }
    }); }
  refreshTracker();
}
function turnIn(id){
  const q = qById(id); if(!qReady(q)) return;
  q.obj.forEach(o=>{ if(o[0]==="gather") removeItem(o[1], o[2]); if(o[0]==="collect"||o[0]==="loot"){ S.qbag[o[1]] -= o[2]; if(S.qbag[o[1]]<=0) delete S.qbag[o[1]]; } });
  const xp = qXP(q), gold = qGold(q);
  S.quests[id].state = "done"; S.gold += gold;
  if(q.items) for(const [k,n] of Object.entries(q.items)) addItem(k, n);
  const qg = questGear(q); if(qg) gainGear(qg, "Uppdragsbelöning");
  log(`Uppdrag klart: ${q.name}. +${gold} guld.`, "#7be08a");
  gainXP(xp); refreshTracker(); save(true);
  if(id==="f7") showBanner("Rimfrosts hjälte", `${S.name} har besegrat Isjätten!`, 6);
}
// where on the map a quest is done (tile coords)
function questSpot(q){
  if(qReady(q)){ const n = npcs.find(n=>n.id===qTurnInNpc(q)); return n ? {x:n.x/TILE, y:n.y/TILE, turnin:true} : null; }
  const i = q.obj.findIndex((o,k)=>qProg(q,k) < o[2]); const o = q.obj[i];
  const avg = list => list.length ? {x:list.reduce((a,b)=>a+b.x,0)/list.length/TILE, y:list.reduce((a,b)=>a+b.y,0)/list.length/TILE} : null;
  if(!o) return null;
  const dgt = o[0]==="kill" ? MOBS[o[1]].dg : o[0]==="loot" ? MOBS[o[3]].dg : null;
  if(dgt && !(P && P.inDungeon===dgt)) return {x:DUNGEONS[dgt].ent.x, y:DUNGEONS[dgt].ent.y};
  if(o[0]==="kill") return avg(mobs.filter(m=>m.type===o[1]).map(m=>({x:m.hx,y:m.hy})));
  if(o[0]==="loot") return avg(mobs.filter(m=>m.type===o[3]).map(m=>({x:m.hx,y:m.hy})));
  if(o[0]==="collect") return avg(qobjs.filter(n=>n.qitem===o[1]));
  if(o[0]==="gather"){ const g = npcs.find(n=>n.id===q.npc); const list = nodes.filter(n=>n.def.item===o[1]); if(!list.length||!g) return null;
    const near = list.reduce((a,b)=>dist(a,g)<dist(b,g)?a:b); const z = zmap[Math.floor(near.y/TILE)*MW+Math.floor(near.x/TILE)]; return avg(list.filter(n=>zmap[Math.floor(n.y/TILE)*MW+Math.floor(n.x/TILE)]===z)); }
  return null;
}

// ======================= UPDATE =======================
const keys = new Set(); const joy = {x:0, y:0};
function collides(x, y, r){
  const x0 = Math.floor((x-r)/TILE), x1 = Math.floor((x+r)/TILE), y0 = Math.floor((y-r)/TILE), y1 = Math.floor((y+r)/TILE);
  for(let ty=y0; ty<=y1; ty++) for(let tx=x0; tx<=x1; tx++){ if(!solidAt(tx,ty)) continue;
    const cx = clamp(x, tx*TILE, tx*TILE+TILE), cy = clamp(y, ty*TILE, ty*TILE+TILE); if((x-cx)**2 + (y-cy)**2 < r*r) return true; }
  return false;
}
function moveEnt(e, dx, dy){ if(Math.abs(dx)+Math.abs(dy) > 0.01 && !(e===P && P.act && P.act.t < P.act.dur)) e.dir = dirOf(dx, dy); const r = Math.min(e.r, 12); if(!collides(e.x+dx, e.y, r)) e.x += dx; if(!collides(e.x, e.y+dy, r)) e.y += dy; }

function update(dt){
  time += dt;
  updPlayer(dt);
  for(const m of mobs) updMob(m, dt);
  // separation between chasing mobs
  const act = mobs.filter(m=>!m.dead && m.state==="chase");
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){ const a=act[i], b=act[j], d=dist(a,b), min=a.r+b.r; if(d<min && d>0.01){ const push=(min-d)/2, ux=(a.x-b.x)/d, uy=(a.y-b.y)/d; moveEnt(a, ux*push, uy*push); moveEnt(b, -ux*push, -uy*push); } }
  for(const n of nodes) if(!n.active){ n.respawn -= dt; if(n.respawn <= 0) n.active = true; }
  // projectiles
  for(const p of projs){
    if(p.toPlayer){ const dx=P.x-p.x, dy=(P.y-14)-p.y, d=Math.hypot(dx,dy); if(d < 10 || P.dead){ p.done=true; if(!P.dead) playerDamage(p.dmg, p.src, "ranged"); burst(p.x,p.y,p.color,6); continue; } p.x+=dx/d*p.sp*dt; p.y+=dy/d*p.sp*dt; continue; }
    if(!p.t || p.t.dead){ p.done = true; continue; }
    const dx = p.t.x-p.x, dy = (p.t.y-10)-p.y, d = Math.hypot(dx,dy);
    if(d < 10){ p.done = true; p.onHit(); burst(p.x, p.y, p.color, p.kind==="arrow"?4:9); continue; }
    p.x += dx/d*p.sp*dt; p.y += dy/d*p.sp*dt; p.ang = Math.atan2(dy,dx);
    if(p.kind!=="arrow" && Math.random()<0.6) parts.push({x:p.x, y:p.y, vx:rand(-20,20), vy:rand(-20,20), life:0.35, max:0.35, color:p.color, size:3});
  }
  projs = projs.filter(p=>!p.done);
  // ground effects
  for(const z of zones){ z.left -= dt; z.tick -= dt;
    if(z.tick <= 0){ z.tick += 1; aoe(z.x, z.y, z.r, m=>{ hit(m, z.dmg, z.school, z.ab); if(z.slows) slow(m, 0.5, 2); }); }
    for(let i=0;i<2;i++){ const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*z.r; parts.push({x:z.x+Math.cos(a)*r, y:z.y+Math.sin(a)*r-30, vx:-30, vy:120, life:0.3, max:0.3, color:SCHOOL_COLOR[z.school], size:2}); } }
  zones = zones.filter(z=>z.left>0);
  for(const p of parts){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  parts = parts.filter(p=>p.life>0);
  for(const f of floats) f.t += dt;
  floats = floats.filter(f=>f.t<1.2);
  // zone banner
  const z = zoneAtTile(Math.floor(P.x/TILE), Math.floor(P.y/TILE));
  if(z !== curZone){ const was = curZone; curZone = z; const zi = zinfo(z); if(ZONES[z] && parentZone(was)!==z) showBanner(zi.name, `Nivå ${zi.lv[0]}–${zi.lv[1]}`, 2.5); else if(HUBS[z]) showBanner(zi.name, "Tryggt område", 2); }
  // safe camps: monsters give up at the gates
  for(const m of mobs) if(m.state==="chase" && nearHub(m.x/TILE, m.y/TILE, 2)) evade(m);
  for(const n of qobjs) if(!n.active){ n.respawn -= dt; if(n.respawn <= 0) n.active = true; }
}

function updPlayer(dt){
  P.hurt = Math.max(0, (P.hurt||0)-dt); P.swing = Math.max(0, (P.swing||0)-dt); if(P.act) P.act.t += dt;
  if(P.dead) return;
  P.gcd = Math.max(0, P.gcd-dt); P.potCd = Math.max(0, P.potCd-dt);
  for(const k in P.cds){ P.cds[k] -= dt; if(P.cds[k] <= 0) delete P.cds[k]; }
  for(const k in P.buffs){ P.buffs[k] -= dt; if(P.buffs[k] <= 0) delete P.buffs[k]; }
  if(P.shield>0){ P.shieldT -= dt; if(P.shieldT<=0) P.shield = 0; }
  let ix = 0, iy = 0;
  if(keys.has("left")) ix -= 1; if(keys.has("right")) ix += 1;
  if(keys.has("up")) iy -= 1; if(keys.has("down")) iy += 1;
  if(panelKind && panelKind!=="help") { /* movement still allowed */ }
  ix += joy.x; iy += joy.y;
  const il = Math.hypot(ix, iy); if(il > 1){ ix /= il; iy /= il; }
  P.moving = false;
  if(P.dash){
    const t = P.dash.t; P.dash.el = (P.dash.el||0) + dt;
    if(!t || t.dead || P.dash.el > 0.6){ P.dash = null; }
    else { const d = dist(P,t), dx = (t.x-P.x)/d, dy = (t.y-P.y)/d; moveEnt(P, dx*P.dash.speed*dt, dy*P.dash.speed*dt); P.fx = dx<0?-1:1; P.moving = true;
      if(Math.random()<0.8) parts.push({x:P.x, y:P.y-10, vx:0, vy:0, life:0.3, max:0.3, color:"#d9c49a", size:4});
      if(d < t.r + P.r + 14){ stun(t, 1); P.dash = null; } }
  } else if(P.leap){ moveEnt(P, P.leap.vx*dt, P.leap.vy*dt); P.leap.t -= dt; P.moving = true; if(P.leap.t <= 0) P.leap = null; }
  else if(il > 0.05){
    if(P.casting) cancelCast(P.casting.kind==="spell" ? "Avbrutet – du rörde dig" : null);
    const sp = 150 * (P.form==="cat"?1.3:P.form==="leopard"?1.5:1) * (P.buffs.dash?1.7:1);
    moveEnt(P, ix*sp*dt, iy*sp*dt); if(Math.abs(ix) > 0.1) P.fx = ix<0?-1:1; P.moving = true;
  }
  if(P.casting){ P.casting.el += dt; if(P.casting.kind==="gather" && !P.casting.node.active) P.casting = null; else if(P.casting.el >= P.casting.total) completeCast(); }
  autoAttack(dt);
  P.combatT -= dt; const inC = P.combatT > 0;
  if(P.sitting && (P.moving || P.casting || P.autoTarget || P.dash || P.leap || inC || P.dead)) standUp();
  if(P.sitting && P.hp >= P.maxHp && P.mana >= P.maxMana && !P.sitFull){ P.sitFull = true; log("Du är fullt utvilad.", "#7be08a"); }
  const rg = S.race==='undead' ? 1.5 : 1, rest = P.sitting ? 2.5 : 1;
  P.mana = Math.min(P.maxMana, P.mana + P.maxMana*(inC?0.012:0.05*rg*rest)*dt);
  P.focus = Math.min(100, P.focus + (inC?7:15)*dt);
  P.energy = Math.min(100, P.energy + 12*dt);
  if(!inC) P.rage = Math.max(0, P.rage - 3*dt);
  if(!inC && (P.combatT < -1 || P.sitting)) P.hp = Math.min(P.maxHp, P.hp + P.maxHp*0.04*rg*rest*dt);
  for(const h of P.hots){ h.tick -= dt; if(h.tick <= 0){ h.tick += 1; h.left -= 1; healP(h.per); } }
  P.hots = P.hots.filter(h=>h.left>0);
}

function updMob(m, dt){
  if(m.dead){ m.respawn -= dt; if(m.respawn <= 0) respawnMob(m); return; }
  m.flash = Math.max(0, m.flash-dt); m.swing = Math.max(0, m.swing-dt); if(m.act) m.act.t += dt;
  for(const d of m.dots){ d.tick -= dt; if(d.tick <= 0){ d.tick += 1; d.left -= 1; damageMob(m, Math.max(1, Math.round(d.per)), false, d.school); if(m.dead) return; } }
  m.dots = m.dots.filter(d=>d.left>0);
  m.slowT = Math.max(0, m.slowT-dt); m.rootT = Math.max(0, m.rootT-dt); m.stunT = Math.max(0, m.stunT-dt);
  const dp = P.dead ? 1e9 : dist(m, P);
  const spd = m.sp * (m.slowT>0 ? 1-m.slowPct : 1);
  if(m.state === "idle"){
    m.hp = Math.min(m.maxHp, m.hp + m.maxHp*0.1*dt);
    if(!m.def.passive && dp < aggroRange(m)){ aggro(m); social(m); return; }
    m.wanderT -= dt;
    if(m.wanderT <= 0){ m.wanderT = rand(3,7); if(!m.def.boss && m.type!=="leader"){ m.wx = m.hx + rand(-60,60); m.wy = m.hy + rand(-60,60); } }
    if(m.wx !== null){ const dx = m.wx-m.x, dy = m.wy-m.y, d = Math.hypot(dx,dy); if(d < 4) m.wx = null; else { moveEnt(m, dx/d*spd*0.35*dt, dy/d*spd*0.35*dt); m.fx = dx<0?-1:1; m.walk = true; } } else m.walk = false;
  } else if(m.state === "chase"){
    if(P.dead){ evade(m); return; }
    if(m.lx === undefined) anchor(m);
    if(time - m.lastHit > 8 && (Math.hypot(m.x-m.lx, m.y-m.ly) > 600 || dp > 380)){ evade(m); log(`${m.name} ger upp och återvänder.`, "#93a4ad"); return; }
    P.combatT = Math.max(P.combatT, 2);
    if(m.stunT > 0) return;
    if(m.tele){ m.tele.t -= dt;
      if(m.tele.t <= 0){ spawnBossFx(m); const sp = m.def.special; if(Math.hypot(P.x-m.tele.x, P.y-m.tele.y) < m.tele.r + P.r) playerDamage(m.dmg*sp.mult, m); ring(m.tele.x, m.tele.y, m.tele.r, "#ff5a40"); burst(m.tele.x, m.tele.y, "#ff8a5a", 24); m.tele = null; }
      return; }
    if(m.def.special){ m.specT -= dt; if(m.specT <= 0 && dp < 240){ const sp = m.def.special; m.specT = sp.every; m.tele = {x:m.x, y:m.y, r:sp.r, t:sp.windup, max:sp.windup}; floatText(m.x, m.y-m.r-30, sp.name+"!", "#ff8a5a", true); log(`${m.name} förbereder ${sp.name} – spring ut ur cirkeln!`, "#ff8a5a"); return; } }
    const reach = m.def.ranged || (m.r + P.r + 8);
    m.walk = false;
    if(dp > reach-4 && m.rootT <= 0) steer(m, P.x, P.y, dt, spd);
    else m.fx = P.x<m.x?-1:1;
    m.atkT -= dt;
    if(dp <= reach + 6 && m.atkT <= 0){ m.atkT = m.atkSpd; m.swing = 0.2; m.dir = dirOf(P.x-m.x, P.y-m.y); const L = MOB_LOOK[m.type]; if(L) setAct(m, L.cast||m.def.ranged ? "cast" : "slash");
      if(m.def.ranged) projs.push({toPlayer:true, x:m.x, y:m.y-16, dmg:m.dmg, src:m, color:"#cfe9ff", size:5, sp:300, bullet:!!(BOSS_LOOK[m.type]&&BOSS_LOOK[m.type].bullet)});
      else playerDamage(m.dmg, m, "melee"); }
  } else if(m.state === "return"){
    const dx = m.hx-m.x, dy = m.hy-m.y, d = Math.hypot(dx,dy);
    m.hp = Math.min(m.maxHp, m.hp + m.maxHp*0.5*dt);
    if(d < 8){ m.state = "idle"; m.evading = false; m.hp = m.maxHp; }
    else { const s = m.sp*1.4*dt; m.x += dx/d*s; m.y += dy/d*s; m.fx = dx<0?-1:1; m.dir = dirOf(dx, dy); m.walk = true; }
  }
}

// ---- effects
function floatText(x, y, txt, color, big){ floats.push({x, y, txt, color, t:0, big}); }
function burst(x, y, color, n){ const el = fxEl(color); if(el) sfx("explo", el, x, y, 30+n*2.2, 0.55); for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = rand(30,140); parts.push({x, y:y-10, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.3,0.6), max:0.6, color, size:rand(2,4)}); } }
function ring(x, y, r, color){ const el = color!=="#ff5a40" && fxEl(color); if(el) sfx("ring", el, x, y, r*2.5, 0.75); for(let i=0;i<36;i++){ const a = i/36*Math.PI*2; parts.push({x:x+Math.cos(a)*r*0.3, y:y+Math.sin(a)*r*0.3, vx:Math.cos(a)*r*1.6, vy:Math.sin(a)*r*1.6, life:0.42, max:0.42, color, size:3}); } }
function slash(t){ if(!t) return; for(let i=0;i<8;i++){ const a = -0.8 + i*0.2; parts.push({x:t.x+Math.cos(a)*14, y:t.y-12+Math.sin(a)*14, vx:Math.cos(a+1.5)*60, vy:Math.sin(a+1.5)*60, life:0.22, max:0.22, color:"#ffffff", size:3}); } P.swing = 0.2; }
</script>
<script>
// ======================= GEAR / EQUIPMENT =======================
// quality 0..5: grå, vit, grön, blå, lila, orange
const QUAL = [
  {name:"Dålig",       color:"#9d9d9d", mult:0.5},
  {name:"Vanlig",      color:"#ffffff", mult:0.8},
  {name:"Ovanlig",     color:"#1eff00", mult:1.0},
  {name:"Sällsynt",    color:"#0070dd", mult:1.25},
  {name:"Episk",       color:"#a335ee", mult:1.55},
  {name:"Legendarisk", color:"#ff8000", mult:1.9}
];
const SLOTS = {
  head:{name:"Huvud", w:0.5}, shoulder:{name:"Axlar", w:0.4}, chest:{name:"Bröst", w:0.6}, hands:{name:"Händer", w:0.35},
  legs:{name:"Ben", w:0.55}, feet:{name:"Fötter", w:0.35}, weapon:{name:"Vapen", w:1.0}, offhand:{name:"Andra handen", w:0.4},
  neck:{name:"Halsband", w:0.3}, ring:{name:"Ring", w:0.3}
};
const SLOT_ORDER = ["head","neck","shoulder","chest","hands","legs","feet","ring","weapon","offhand"];
// armor types and which classes may use them
const ARMOR = {
  cloth:{name:"Tyg", cls:["mage","priest"], def:0.10},
  leather:{name:"Läder", cls:["hunter","druid"], def:0.20},
  plate:{name:"Platta", cls:["warrior","paladin"], def:0.30}
};
const CLASS_ARMOR = {mage:"cloth", priest:"cloth", hunter:"leather", druid:"leather", warrior:"plate", paladin:"plate"};
// weapon / offhand types
const WTYPES = {
  sword:{name:"Svärd", cls:["warrior","paladin"], icon:"sword", base:["Långsvärd","Bredsvärd","Klinga"]},
  axe:{name:"Yxa", cls:["warrior"], icon:"axeDouble", base:["Stridsyxa","Klyvare","Bila"]},
  mace:{name:"Hammare", cls:["paladin"], icon:"hammer", base:["Krigshammare","Klubba","Stridshammare"]},
  bow:{name:"Båge", cls:["hunter"], icon:"bow", base:["Långbåge","Jaktbåge","Krigsbåge"]},
  staff:{name:"Stav", cls:["mage","priest","druid"], icon:"upg_wand", base:["Stav","Vandringsstav","Runstav"]},
  wand:{name:"Trollspö", cls:["mage","priest"], icon:"wand", base:["Trollspö","Spira"]},
  shield:{name:"Sköld", cls:["warrior","paladin"], icon:"shield", base:["Sköld","Rundsköld","Tornsköld"], off:true},
  tome:{name:"Bok", cls:["mage","priest","druid"], icon:"tome", base:["Bok","Formelbok","Grimoar"], off:true}
};
const CLASS_WEAP = {warrior:["sword","axe"], paladin:["sword","mace"], hunter:["bow"], mage:["staff","wand"], priest:["staff","wand"], druid:["staff"]};
const CLASS_OFF = {warrior:["shield"], paladin:["shield"], mage:["tome"], priest:["tome"], druid:["tome"], hunter:[]};
const ARMOR_BASE = {
  cloth:{head:"Huva", shoulder:"Axelkappa", chest:"Klädnad", hands:"Handskar", legs:"Byxor", feet:"Tofflor"},
  leather:{head:"Läderhuva", shoulder:"Läderaxlar", chest:"Läderväst", hands:"Läderhandskar", legs:"Läderbyxor", feet:"Läderstövlar"},
  plate:{head:"Hjälm", shoulder:"Axelplåtar", chest:"Bröstharnesk", hands:"Järnhandskar", legs:"Benskenor", feet:"Sabatoner"}
};
const JEWEL_BASE = {neck:["Halsband","Amulett","Hänge"], ring:["Ring","Signetring","Band"]};
const SLOT_ICON = {head:"helmet", shoulder:"upg_helmet", chest:"armor", hands:"upg_armor", legs:"armor", feet:"upg_armor", neck:"gemBlue", ring:"gemRed"};
const STAT_NAME = {pow:"Attackkraft", sp:"Formelkraft", hp:"Hälsa", mana:"Mana", crit:"Kritisk träff", def:"Skydd"};
const STAT_SUFFIX = {pow:"Kraften", sp:"Trolldomen", hp:"Uthålligheten", mana:"Visdomen", crit:"Precisionen", def:"Skyddet"};
const PREFIX = [["Tiggarens","Trälens","Lärlingens"], [""], [""], ["Väktarens","Mästarens","Riddarens","Jägarmästarens"], ["Stormens","Nattens","Runsmedens","Vargkungens"], ["Rimfrostens","Isjättens","Draugkungens","Urtidens"]];
const GEAR_MAX = 30;

function mulberry(seed){ return ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h; }
const pickR = (arr, r) => arr[Math.floor(r()*arr.length)];

// which classes can use an item
function gearClasses(it){ if(it.arm) return ARMOR[it.arm].cls; if(it.wt) return WTYPES[it.wt].cls; return Object.keys(CLASSES); }
function canWear(it){ return gearClasses(it).includes(S.cls); }
function gearTypeName(it){ return it.arm ? ARMOR[it.arm].name : it.wt ? WTYPES[it.wt].name : "Smycke"; }

// make one item. opts: {slot, cls, q, il, r}
function makeGear(opts){
  const r = opts.r || Math.random, q = opts.q, il = Math.max(1, Math.min(MAX_LVL, Math.round(opts.il)));
  const cls = opts.cls || pickR(Object.keys(CLASSES), r);
  let slot = opts.slot;
  if(!slot){ const pool = SLOT_ORDER.filter(s=>s!=="offhand" || CLASS_OFF[cls].length); slot = pickR(pool, r); }
  const it = {id:Math.random().toString(36).slice(2,10), slot, q, il, st:{}};
  let base;
  if(slot==="weapon"){ it.wt = pickR(CLASS_WEAP[cls], r); base = pickR(WTYPES[it.wt].base, r); }
  else if(slot==="offhand"){ it.wt = pickR(CLASS_OFF[cls].length ? CLASS_OFF[cls] : ["shield"], r); base = pickR(WTYPES[it.wt].base, r); }
  else if(slot==="neck"||slot==="ring"){ base = pickR(JEWEL_BASE[slot], r); }
  else { it.arm = CLASS_ARMOR[cls]; base = ARMOR_BASE[it.arm][slot]; }
  // stat budget
  let pts = (4 + il*1.15) * QUAL[q].mult * SLOTS[slot].w * 2;
  const role = ["warrior","hunter"].includes(cls) ? "phys" : ["mage","priest"].includes(cls) ? "caster" : "hybrid";
  const add = (k, p) => { if(p <= 0) return; it.st[k] = (it.st[k]||0) + p; };
  let defShare = it.arm ? ARMOR[it.arm].def : it.wt==="shield" ? 0.4 : 0;
  add("def", pts*defShare); pts *= 1-defShare;
  if(slot==="weapon"){ if(role==="phys") add("pow", pts*0.75); else if(role==="caster") add("sp", pts*0.75); else { add("pow", pts*0.4); add("sp", pts*0.35); } pts *= 0.25; }
  else if(it.wt==="tome"){ add("sp", pts*0.5); pts *= 0.5; }
  // spread the rest over 1-3 random stats (better items get more stats)
  const pool = role==="phys" ? ["pow","hp","crit"] : role==="caster" ? ["sp","hp","mana","crit"] : ["pow","sp","hp","mana","crit"];
  const n = q <= 1 ? 1 : q === 2 ? 2 : 3;
  const chosen = []; while(chosen.length < Math.min(n, pool.length)){ const k = pickR(pool, r); if(!chosen.includes(k)) chosen.push(k); }
  const weights = chosen.map(()=>0.5 + r()); const tot = weights.reduce((a,b)=>a+b,0);
  chosen.forEach((k,i)=>add(k, pts*weights[i]/tot));
  // points -> real numbers
  const conv = {pow:0.17, sp:0.17, hp:2.4, mana:3, crit:0.07, def:0.1};
  for(const k of Object.keys(it.st)){ let v = it.st[k]*conv[k]; v = (k==="crit"||k==="def") ? Math.round(v*10)/10 : Math.round(v); if(v <= 0) delete it.st[k]; else it.st[k] = v; }
  // name
  const pre = pickR(PREFIX[q], r);
  const top = Object.keys(it.st).filter(k=>k!=="def").sort((a,b)=>it.st[b]*(b==="crit"?40:(b==="pow"||b==="sp")?10:1) - it.st[a]*(a==="crit"?40:(a==="pow"||a==="sp")?10:1))[0];
  it.n = (pre ? pre+" " : "") + base.toLowerCase().replace(/^./, c=>pre ? c : c.toUpperCase()) + (q >= 2 && top ? " av " + STAT_SUFFIX[top] : "");
  if(!pre) it.n = it.n.charAt(0).toUpperCase() + it.n.slice(1);
  return it;
}
function gearPrice(it){ return Math.max(2, Math.round(Math.pow(it.il, 1.5) * QUAL[it.q].mult * SLOTS[it.slot].w * 3 + 3)); }
function gearSell(it){ return Math.max(1, Math.round(gearPrice(it) / 5)); }
function gearIcon(it){ return it.wt ? WTYPES[it.wt].icon : SLOT_ICON[it.slot]; }

// total stats from what you wear
function gearStat(k){ if(!S || !S.eq) return 0; let v = 0; for(const it of Object.values(S.eq)) if(it && it.st[k]) v += it.st[k]; return v; }

// quality roll for drops
function rollQuality(src){
  const r = Math.random();
  const table = src==="boss" ? [[3,0.70],[4,0.26],[5,0.04]] : src==="elite" ? [[2,0.55],[3,0.35],[4,0.09],[5,0.01]]
    : [[0,0.45],[1,0.30],[2,0.20],[3,0.045],[4,0.0045],[5,0.0005]];
  let acc = 0; for(const [q,p] of table){ acc += p; if(r < acc) return q; } return table[table.length-1][0];
}
function gainGear(it, how){
  if(!S.gear) S.gear = [];
  if(S.gear.length >= GEAR_MAX){ log(`Väskan är full – ${it.n} gick förlorad. Sälj något hos en handlare.`, "#ff6b5e"); return false; }
  S.gear.push(it);
  log(`${how||"Du fick"}: [${it.n}]`, QUAL[it.q].color);
  if(it.q >= 4) showBanner(QUAL[it.q].name + " utrustning!", it.n, 4);
  return true;
}
// gear drop when a monster dies
function mobGearDrop(m){
  if(m.def.mini){ gainGear(makeGear({q:2, il:m.lvl, cls:S.cls}), "Byte"); return; }
  if(BEASTS.has(m.type) || m.def.passive) return;
  const src = m.def.boss ? "boss" : m.elite ? "elite" : "normal";
  const chance = src==="boss" ? 1 : src==="elite" ? 0.6 : 0.08;
  if(Math.random() >= chance) return;
  const cls = Math.random() < 0.7 ? S.cls : null;
  gainGear(makeGear({q:rollQuality(src), il:m.lvl, cls}), "Byte");
  if(src==="boss" && Math.random() < 0.5) gainGear(makeGear({q:rollQuality("elite"), il:m.lvl, cls:S.cls}), "Byte");
}
// quest rewards: every third quest and every chain's last quest give gear
function questGearQ(q){ const num = +q.id.replace(/\D/g,""); const last = !QUESTS.some(o=>o.id[0]===q.id[0] && +o.id.replace(/\D/g,"") > num); return last ? 3 : num % 3 === 0 ? 2 : -1; }
function questGear(q){ const qq = questGearQ(q); if(qq < 0) return null; return makeGear({q:qq, il:q.lvl + 1, cls:S.cls}); }

// vendor stock: stable per vendor, class and level band
function vendorLevel(n){ const z = zinfo(zoneAtTile(Math.floor(n.x/TILE), Math.floor(n.y/TILE))); const max = z && z.lv ? z.lv[1] : 5; return Math.max(1, Math.min(max, Math.max(S.level, 3))); }
function vendorStock(n){
  const il = vendorLevel(n), r = mulberry(hashStr(n.id + S.cls + il));
  const out = [];
  for(const slot of SLOT_ORDER){ if(slot==="offhand" && !CLASS_OFF[S.cls].length) continue; out.push(makeGear({slot, cls:S.cls, q:1, il, r})); }
  for(let i=0;i<3;i++) out.push(makeGear({cls:S.cls, q:2, il, r}));
  out.forEach((it,i)=>it.id = "v_"+n.id+"_"+i);
  return out;
}

// equip / unequip
function equipGear(id){
  const i = S.gear.findIndex(x=>x.id===id); if(i<0) return;
  const it = S.gear[i];
  if(!canWear(it)) return err(`${CLASSES[S.cls].name} kan inte använda ${gearTypeName(it).toLowerCase()}.`);
  if(S.level < it.il) return err(`Kräver nivå ${it.il}.`);
  S.gear.splice(i, 1);
  const old = S.eq[it.slot]; if(old) S.gear.push(old);
  S.eq[it.slot] = it; recompute(false); log(`Du tog på dig ${it.n}.`, QUAL[it.q].color); save();
}
function unequipGear(slot){
  const it = S.eq[slot]; if(!it) return;
  if(S.gear.length >= GEAR_MAX) return err("Väskan är full.");
  delete S.eq[slot]; S.gear.push(it); recompute(false); save();
}

// html helpers
function gearIco(it, px){ px = px||34; return `<span class="gico" style="width:${px}px;height:${px}px;border-color:${QUAL[it.q].color}"><img src="assets/weapons/${gearIcon(it)}.png" alt=""></span>`; }
function statLines(it, cmp){
  return Object.keys(STAT_NAME).filter(k=>it.st[k] || (cmp && cmp.st[k])).map(k=>{
    const v = it.st[k]||0, unit = (k==="crit"||k==="def") ? "%" : "";
    let diff = ""; if(cmp){ const d = Math.round((v - (cmp.st[k]||0))*10)/10; if(d) diff = ` <span style="color:${d>0?"#7be08a":"#ff6b5e"}">(${d>0?"+":""}${d}${unit})</span>`; }
    return v ? `+${v}${unit} ${STAT_NAME[k]}${diff}` : `<span class="muted">${STAT_NAME[k]}${diff}</span>`; }).join(" · ");
}
function gearDesc(it, showCmp){
  const ok = canWear(it), lvlOk = S.level >= it.il, cur = S.eq ? S.eq[it.slot] : null;
  return `<b style="color:${QUAL[it.q].color}">${esc(it.n)}</b> <span class="muted">· ${QUAL[it.q].name} · ${SLOTS[it.slot].name} · ${gearTypeName(it)}</span>
    <div class="d">${statLines(it, showCmp && cur && cur!==it ? cur : null)}</div>

<script>
// ======================= DUNGEONS: carving, spawning, puzzles, entering/leaving =======================
const DG_W = 102, DG_H = 40;

function dgLayout(D){

      for(let x=a.x+a.w-1; x<=gx+2; x++) for(let k=-1;k<=1;k++) setT(x, a.cy+k, L.floor);

      for(let x=gx+1; x<=b.x; x++) for(let k=-1;k<=1;k++) setT(x, b.cy+k, L.floor);

      {k:"brazier", x:(br.x+1)*TILE+16, y:(br.y+br.h-2)*TILE+16}, {k:"brazier", x:(br.x+br.w-2)*TILE+16, y:(br.y+br.h-2)*TILE+16});
    deco.push({k:"brazier", x:(D.ent.x-1)*TILE+16, y:(D.ent.y-1)*TILE+16}, {k:"brazier", x:(D.ent.x+1)*TILE+16, y:(D.ent.y-1)*TILE+16});
