}
function setGate(D, g, closed){ for(const [x,y] of g.tiles) map[y*MW+x] = closed ? T_GATE : D.L.floor; }
// (re)build a dungeon: fresh monsters, closed gates, unsolved puzzles

}
function spawnDungeons(){ dobjs = []; for(const D of Object.values(DUNGEONS)){ resetDungeon(D); dobjs.push({dg:null, dgEnt:D.id, kind:"entrance", x:D.ent.x*TILE+16, y:D.ent.y*TILE+16}); } }

// ---- puzzles
function openGate(D, pi){ const g = D.gates[pi]; if(g.open) return; g.open = true; setGate(D, g, false);
  const [gx, gy] = g.tiles[1]; ring(gx*TILE+16, gy*TILE+16, 70, "#ffd36b"); showBanner(`${D.gate}en öppnas!`, "Vägen framåt är fri", 3); log(`${D.gate}en öppnades.`, "#7be08a"); }
function useDObj(o){
  const D = DUNGEONS[o.dg];
  if(o.kind === "entrance") return openPanel("npc", DUNGEONS[o.dgEnt].keeper.id);
  if(o.kind === "exit" || o.kind === "exitEnd") return leaveDungeon(false);
  if(o.kind === "lever"){
    if(o.on) return; o.on = true; burst(o.x, o.y-10, "#ffd36b", 10);
    const all = dobjs.filter(x=>x.dg===o.dg && x.kind==="lever" && x.gate===o.gate), n = all.filter(x=>x.on).length;

  }
  if(o.kind === "tablet"){
    const ord = D.order[o.gate].map(i=>RUNE_COL[i][0]).join(" → ");

  }

    else { D.prog[o.gate] = 0; dobjs.filter(x=>x.dg===o.dg && x.kind==="rune" && x.gate===o.gate).forEach(x=>x.on=false);
      floatText(o.x, o.y-40, "Fel ordning! Runorna slocknar.", "#ff6b5e"); burst(o.x, o.y-10, "#ff5a40", 12); playerDamage(P.maxHp*0.08, null); }

}
// ---- boss / progress
function dungeonKill(m){

  if(m.def.boss){ DSTATE[D.id].done = true; const br = D.L.rooms[D.L.rooms.length-1];
    dobjs.push({dg:D.id, kind:"exitEnd", x:(br.x+br.w-3)*TILE+16, y:br.cy*TILE+16});
    setTimeout(()=>showBanner(`${ZONES[D.id].name} rensad!`, "En portal ut har öppnats", 5), 1500); log(`Du har rensat ${ZONES[D.id].name}! Gå in i portalen för att komma ut.`, "#7be08a"); }
}
function camBounds(){ if(P && P.inDungeon){ const L = DUNGEONS[P.inDungeon].L; return {x0:L.x0*TILE, y0:L.y0*TILE, x1:Math.min(MW, L.x0+DG_W)*TILE, y1:(L.y0+DG_H)*TILE}; } return {x0:0, y0:0, x1:OW*TILE, y1:MH*TILE}; }
function mapRegion(){ if(P && P.inDungeon){ const L = DUNGEONS[P.inDungeon].L; return {x:L.x0, y:L.y0, w:Math.min(MW, L.x0+DG_W)-L.x0, h:DG_H}; } return {x:0, y:0, w:OW, h:MH}; }
// ---- entering and leaving
function enterDungeon(id){
  const D = DUNGEONS[id]; if(!D || P.dead) return;

  log(`Du gick in i ${ZONES[id].name}. Portalen bakom dig tar dig ut igen.`, "#9fd6e8"); save(true);
}
function placeAtEntrance(D){ P.x = D.ent.x*TILE+16; P.y = (D.ent.y+1)*TILE+16; }
function leaveDungeon(){

function dungeonInfoHTML(id){
  const D = DUNGEONS[id], z = ZONES[id], st = DSTATE[id] || {}, lvlCol = S.level < z.lv[0]-1 ? "var(--bad)" : S.level > z.lv[1]+3 ? "var(--mute)" : "var(--coin)";

    <div class="d">Svårare än vanliga områden – grupper av fiender, två pussel, två minibossar (släpper alltid grön utrustning) och en slutboss som alltid släpper blå eller bättre. Dör du vaknar du här utanför, och det du redan rensat ligger kvar.</div>

    ${st.keep && !st.done ? `<div class="row" style="margin-top:6px"><button class="btn" data-act="resetdg" data-id="${id}">Börja om från början</button></div>` : ""}`;

// drawing of puzzle objects and portals
function drawDObj(c, o){
  const t = time;
  c.save(); c.translate(o.x, o.y);
  if(o.kind === "lever"){
    c.fillStyle = "rgba(0,0,0,.3)"; ell(c, 0, 4, 12, 4); c.fillStyle = "#4a4d55"; c.fillRect(-9, -6, 18, 10); c.fillStyle = "#2a2d33"; c.fillRect(-9, 2, 18, 2);

  } else if(o.kind === "tablet"){
    c.fillStyle = "rgba(0,0,0,.3)"; ell(c, 0, 4, 14, 4); c.fillStyle = "#7a7468"; c.fillRect(-12, -24, 24, 28); c.fillStyle = "#5a554b";
    for(let i=0;i<4;i++) c.fillRect(-8, -19+i*6, 16, 2);

  } else { // portal (purple = way out / entrance, gold = cleared)
    const done = o.kind === "exitEnd";
    if(o.kind === "entrance"){ c.fillStyle = "#2a2a30"; c.beginPath(); c.ellipse(0, -18, 26, 34, 0, Math.PI, 0); c.lineTo(26, 6); c.lineTo(-26, 6); c.fill(); c.fillStyle = "#5a5a64"; c.fillRect(-30, -4, 8, 10); c.fillRect(22, -4, 8, 10); }
    for(let i=0;i<3;i++){ c.strokeStyle = done ? `rgba(255,211,107,${0.8-i*0.2})` : `rgba(160,120,255,${0.8-i*0.2})`; c.lineWidth = 3; c.beginPath(); c.ellipse(0, -22, 16+i*3+Math.sin(t*3+i)*1.5, 26+i*3, 0, 0, 7); c.stroke(); }
    const g = c.createRadialGradient(0,-22,2,0,-22,26); g.addColorStop(0, done ? "rgba(255,240,180,.9)" : "rgba(220,200,255,.9)"); g.addColorStop(1, done ? "rgba(255,180,60,.15)" : "rgba(100,60,200,.15)");

}
function dobjLabel(o){ if(o.kind==="entrance") return `[E] Gå in i ${ZONES[o.dgEnt].name}`; const D = DUNGEONS[o.dg];
  return o.kind==="lever" ? (o.on ? null : `[E] Dra i ${D.lever.toLowerCase()}`) : o.kind==="rune" ? (o.on ? null : `[E] Väck den ${RUNE_COL[o.c][0].toLowerCase()} runan`) : o.kind==="tablet" ? "[E] Läs tavlan" : "[E] Lämna instansen"; }
// darkness inside dungeons: only a circle around the hero (and fires) is lit
function drawDungeonDark(c, cam, vw, vh){

<script>
// ======================= RENDER =======================
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, ZOOM = 1; const cam = {x:0, y:0};
function resize(){ DPR = Math.min(2, window.devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ZOOM = W < 700 ? 0.8 : 1; }
addEventListener("resize", resize);

// tile sprites (3 variants each)
let tileSprites = {}, OVL = {}, BASEOFF = false;
function makeTiles(){ makeTilesInner(); const normal = tileSprites; tileSprites = {}; BASEOFF = true; makeTilesInner(); OVL = tileSprites; tileSprites = normal; BASEOFF = false; }
function makeTilesInner(){

  const forest = (g, r) => { if(BASEOFF) return; g.fillStyle = "#2b4628"; g.fillRect(0,0,TILE,TILE); speck(g, r, 16, ["#375733","#22391f","#4a3d28"], 2); };
  const rock = (g, r) => { if(BASEOFF) return; g.fillStyle = "#666a6e"; g.fillRect(0,0,TILE,TILE); speck(g, r, 12, ["#777c81","#575b5f","#70746f"], 3); };
  const swamp = (g, r) => { if(BASEOFF) return; g.fillStyle = "#38452f"; g.fillRect(0,0,TILE,TILE); speck(g, r, 10, ["#46563a","#2f3b28","#3f5a52"], 3); };
  tileSprites[T_GRASS] = mk(grass);
  tileSprites[T_FOREST] = mk(forest);
  tileSprites[T_ROCK] = mk(rock);

// ground textures (CC0, Screaming Brain Studios) drawn continuously across tiles; objects drawn on top
const GROUND_ORDER = ["grass","forest","elfgrass","moss","steppe","sand","path","rock","snow","swamp","ash","lava","water","blight","gloom"];
const GIDX = Object.fromEntries(GROUND_ORDER.map((k,i)=>[k,i]));
const GSCALE = {rock:2, snow:2, lava:2, ash:2};
let GTEX = null, OBJECT_T = null;
function groundTex(t){ if(!GTEX){ GTEX = {[T_GRASS]:"grass",[T_FOREST]:"forest",[T_ELFGRASS]:"elfgrass",[T_MOSS]:"moss",[T_STEPPE]:"steppe",[T_SAND]:"sand",[T_PATH]:"path",[T_ROCK]:"rock",[T_SNOW]:"snow",[T_SWAMP]:"swamp",[T_ASH]:"ash",[T_LAVA]:"lava",[T_WATER]:"water",[T_BLIGHT]:"blight",[T_GLOOM]:"gloom"};
  OBJECT_T = new Set([T_TREE,T_PINE,T_BIRCH,T_VTREE,T_DEAD,T_BOULDER,T_CACTUS,T_OBSID,T_SPINE]); } return GTEX[t]; }
function drawTile(c, x, y){
  const t = map[y*MW+x], g = sImg("assets/environment/ground.png");
  if(!g.complete || !g.naturalWidth){ c.drawImage(tileSprite(t,x,y), x*TILE, y*TILE); return; }
  let tex = groundTex(t), obj = false;
  if(!tex && OBJECT_T.has(t)){ tex = groundTex(FLOOR[terrAt(x,y)]); obj = true; }
  if(!tex){ c.drawImage(tileSprite(t,x,y), x*TILE, y*TILE); return; }
  const s = GSCALE[tex] || 1, per = 128*s, sx = ((x*TILE) % per)/s, sy = ((y*TILE) % per)/s;
  c.drawImage(g, GIDX[tex]*128 + sx, sy, TILE/s, TILE/s, x*TILE, y*TILE, TILE, TILE);
  if(obj){ const v = hash(x,y) % 3, ov = (t===T_TREE && terrAt(x,y)==="forest") ? OVL.ftree : (t===T_BOULDER && terrAt(x,y)!=="meadow") ? OVL.rboulder : OVL[t]; if(ov) c.drawImage(ov[v], x*TILE, y*TILE); }
}
function tileSprite(t, x, y){
  const v = hash(x,y) % 3;
  if(t===T_TREE && terrAt(x,y)==="forest") return tileSprites.ftree[v];
  if(t===T_BOULDER && terrAt(x,y)!=="meadow") return tileSprites.rboulder[v];
  return tileSprites[t][v];
}

function makeMinimap(){ const mm = document.getElementById("mm"); mm.width = 120; mm.height = 80; const g = mmBase.getContext("2d"); for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){ g.fillStyle = MM_COL[map[y*MW+x]]; g.fillRect(x,y,1,1); } }

function shade(hex, f){ const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255; r=clamp(Math.round(r*f),0,255); g=clamp(Math.round(g*f),0,255); b=clamp(Math.round(b*f),0,255); return `rgb(${r},${g},${b})`; }
function ell(c, x, y, rx, ry){ c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); c.fill(); }

  c.fillStyle = "rgba(0,0,0,.32)"; ell(c, 0, 0, 11, 4);

<script>
// ======================= UI =======================
const $ = id => document.getElementById(id);

// item icons from sprite sheets (falls back to nothing when an item has no sprite)
function icoHTML(k){ const it = ITEMS[k]; if(!it || !it.spr) return ""; const [sh,i] = it.spr; return `<span class="ico" style="background-image:url('${SHEETS[sh]}');background-position:-${i*32}px 0"></span>`; }

  if(img && img.complete && img.naturalWidth){ const g = cv.getContext("2d"); g.clearRect(0,0,cv.width,cv.height); const bg = g.createRadialGradient(cv.width/2,cv.height/2,4,cv.width/2,cv.height/2,cv.width*0.7); bg.addColorStop(0,"#2a3540"); bg.addColorStop(1,"#0d1216"); g.fillStyle = bg; g.fillRect(0,0,cv.width,cv.height);
    g.imageSmoothingEnabled = false; const s = Math.floor(cv.width/32); const o = (cv.width-32*s)/2; g.drawImage(img, it.spr[1]*32, 0, 32, 32, o, o, 32*s, 32*s); }

// ---- icons
function drawIcon(cv, icon, color){
  const g = cv.getContext("2d"), s = cv.width; g.clearRect(0,0,s,s);
  const bg = g.createRadialGradient(s*0.35,s*0.3,2,s/2,s/2,s*0.75); bg.addColorStop(0, color); bg.addColorStop(1, "#0d1216"); g.fillStyle = bg; g.fillRect(0,0,s,s);
  g.save(); g.translate(s/2, s/2); g.scale(s/48, s/48);
  g.strokeStyle = "#fff"; g.fillStyle = "rgba(255,255,255,.92)"; g.lineWidth = 3; g.lineCap = "round"; g.lineJoin = "round";
  const P_ = (pts, fill) => { g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); if(fill){ g.closePath(); g.fill(); } else g.stroke(); };
  const C = (x,y,r,fill) => { g.beginPath(); g.arc(x,y,r,0,7); fill?g.fill():g.stroke(); };
  switch(icon){
    case "orb": C(4,-3,9,true); P_([[-4,3],[-16,14]]); P_([[0,7],[-10,16]]); break;
    case "shard": P_([[0,-16],[8,0],[0,16],[-8,0]], true); break;
    case "burst": for(let i=0;i<8;i++){ const a=i*Math.PI/4; P_([[Math.cos(a)*5,Math.sin(a)*5],[Math.cos(a)*15,Math.sin(a)*15]]); } break;
    case "nova": C(0,0,5,true); C(0,0,11); C(0,0,17); break;
    case "storm": C(-5,-6,7,true); C(5,-7,8,true); for(let i=-1;i<=1;i++) P_([[i*7,6],[i*7-4,16]]); break;
    case "meteor": C(5,5,10,true); P_([[-3,-3],[-16,-16]]); P_([[2,-6],[-8,-17]]); P_([[-6,2],[-17,-8]]); break;
    case "sword": P_([[-12,12],[12,-12]]); P_([[-14,6],[-6,14]]); break;
    case "axe": P_([[-12,14],[8,-10]]); g.beginPath(); g.arc(8,-10,9,-2.4,0.8); g.fill(); break;
    case "dash": P_([[-14,-10],[-2,0],[-14,10]]); P_([[0,-10],[12,0],[0,10]]); break;
    case "horn": g.beginPath(); g.moveTo(-14,8); g.quadraticCurveTo(0,-14,14,-6); g.lineTo(12,4); g.quadraticCurveTo(0,-4,-10,12); g.closePath(); g.fill(); break;
    case "claw": for(let i=-1;i<=1;i++) P_([[i*8-6,-14],[i*8+6,14]]); break;
    case "whirl": g.beginPath(); for(let a=0;a<12;a+=0.2){ const r=2+a*1.3; const x=Math.cos(a)*r, y=Math.sin(a)*r; a?g.lineTo(x,y):g.moveTo(x,y);} g.stroke(); break;
    case "arrow": case "firearrow": case "icearrow": P_([[-14,14],[12,-12]]); P_([[12,-12],[2,-12],[12,-12],[12,-2]]); P_([[-14,14],[-14,7]]); P_([[-14,14],[-7,14]]); break;
    case "multi": for(let i=-1;i<=1;i++) P_([[-12+i*6,12+i*0],[8+i*6,-12]]); break;
    case "leap": g.beginPath(); g.moveTo(12,12); g.quadraticCurveTo(0,-20,-12,4); g.stroke(); P_([[-12,4],[-12,-6],[-12,4],[-3,6]]); break;
    case "aim": C(0,0,11); P_([[0,-17],[0,-6]]); P_([[0,6],[0,17]]); P_([[-17,0],[-6,0]]); P_([[6,0],[17,0]]); C(0,0,2.5,true); break;
    case "sun": C(0,0,7,true); for(let i=0;i<8;i++){ const a=i*Math.PI/4; P_([[Math.cos(a)*11,Math.sin(a)*11],[Math.cos(a)*16,Math.sin(a)*16]]); } break;
    case "cross": g.fillRect(-4,-15,8,30); g.fillRect(-15,-4,30,8); break;
    case "skull": C(0,-3,11,true); g.fillRect(-6,6,12,7); g.fillStyle = "#222"; C(-4,-3,3,true); C(4,-3,3,true); break;
    case "shield": P_([[-12,-13],[12,-13],[11,2],[0,15],[-11,2]], true); break;
    case "mind": C(0,0,13); g.beginPath(); g.ellipse(0,0,13,6,0,0,7); g.stroke(); C(0,0,4,true); break;
    case "leaf": g.beginPath(); g.moveTo(-13,13); g.quadraticCurveTo(-12,-12,13,-13); g.quadraticCurveTo(12,12,-13,13); g.fill(); g.strokeStyle = "#2c5a24"; g.lineWidth = 2; P_([[-11,11],[9,-9]]); break;
    case "moon": C(0,0,13,true); g.globalCompositeOperation = "destination-out"; C(7,-4,11,true); g.globalCompositeOperation = "source-over"; break;
    case "bloom": for(let i=0;i<5;i++){ const a=i*Math.PI*0.4; C(Math.cos(a)*8,Math.sin(a)*8,6,true); } g.fillStyle = "#f2e86b"; C(0,0,4,true); break;
    case "roots": for(let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(i*9,16); g.quadraticCurveTo(i*9+8,0,i*9-2,-15); g.stroke(); } break;
    case "star": { g.beginPath(); for(let i=0;i<10;i++){ const r=i%2?6:16, a=i*Math.PI/5-Math.PI/2; const x=Math.cos(a)*r, y=Math.sin(a)*r; i?g.lineTo(x,y):g.moveTo(x,y);} g.closePath(); g.fill(); } break;
    case "bear": C(0,5,10,true); C(-11,-7,4.5,true); C(-4,-12,4.5,true); C(4,-12,4.5,true); C(11,-7,4.5,true); break;
    case "cat": P_([[-13,-14],[-6,-4],[6,-4],[13,-14],[13,4],[0,14],[-13,4]], true); g.fillStyle = "#222"; C(-5,1,2,true); C(5,1,2,true); break;
    case "fist": g.beginPath(); g.roundRect(-11,-10,22,20,5); g.fill(); g.strokeStyle = "#555"; g.lineWidth = 1.5; for(let i=-1;i<=1;i++) P_([[i*6,-10],[i*6,-2]]); break;
    case "fang": P_([[-14,-10],[14,-10],[8,-10],[4,10],[0,-10],[-4,10],[-8,-10]], true); break;
    case "flask": g.fillRect(-3,-15,6,8); g.beginPath(); g.moveTo(-3,-7); g.lineTo(-12,10); g.quadraticCurveTo(0,17,12,10); g.lineTo(3,-7); g.closePath(); g.fill(); break;
    default: g.font = "800 20px sans-serif"; g.textAlign = "center"; g.fillText("?",0,7);
  }

}

function updHotbar(){

$("panel").addEventListener("change", e=>{ const s = e.target.closest("select[data-act=bind]"); if(!s) return; setBarSlot(s.dataset.bar, s.dataset.id, +s.value); renderPanel(); });
$("panel").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return; const a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;
  if(a==="close") return closePanel();
  if(a==="bind") return;
  if(a==="enterdg"){ enterDungeon(id); return; }
  if(a==="resetdg"){ const D = DUNGEONS[id]; resetDungeon(D); log(`${ZONES[id].name} har återställts.`, "#9fd6e8"); }
  if(a==="open"){ openPanel(k); return; }
  if(a==="rest"){ closePanel(); toggleRest(); return; }
  if(a==="rebind"){ startRebind(k); return; }
  if(a==="kbreset"){ KB = Object.assign({}, KB_DEFAULT); saveKB(); buildHotbar(); }
  if(a==="spelltab") spellTab = k;
  if(a==="crafttab") craftTab = k;
  if(a==="alch") doAlch(+b.dataset.i);
  if(a==="smith") doSmith(k, b.dataset.s);
  if(a==="accept") acceptQuest(id);
  if(a==="turnin") turnIn(id);
  if(a==="learn"){ const c = trainCost(id); if(S.gold>=c && !S.learned.includes(id)){ S.gold -= c; S.learned.push(id); autoPlace(id); log(`Du lärde dig ${AB[id].name}.`, "#9fd6e8"); burst(P.x,P.y,"#9fd6e8",16); buildHotbar(); save(true); } }
  if(a==="abandon"){ delete S.quests[id]; refreshTracker(); }
  if(a==="use") useItem(k);
  if(a==="buy"){ const p = +b.dataset.p; if(S.gold>=p){ S.gold -= p; addItem(k,1); } }
  if(a==="sell"){ S.gold += ITEMS[k].sell; removeItem(k,1); refreshTracker(); }
  if(a==="selljunk"){ for(const kk of Object.keys(S.bag)) if(ITEMS[kk].kind==="junk"){ S.gold += ITEMS[kk].sell*S.bag[kk]; delete S.bag[kk]; } for(const g of S.gear.filter(g=>g.q===0)) S.gold += gearSell(g); S.gear = S.gear.filter(g=>g.q!==0); }
  if(a==="equip") equipGear(id);
  if(a==="unequip") unequipGear(b.dataset.slot);
  if(a==="sellgear"){ const i = S.gear.findIndex(g=>g.id===id); if(i>=0){ S.gold += gearSell(S.gear[i]); log(`Du sålde ${S.gear[i].n} för ${gearSell(S.gear[i])} guld.`, "#e6bd5c"); S.gear.splice(i,1); } }
  if(a==="buygear"){ const n = NPCS.find(x=>x.id===panelArg), it = n && vendorStock(n).find(g=>g.id===id);
    if(it){ const p = gearPrice(it); if(S.gold < p) err("Inte tillräckligt med guld"); else if(S.gear.length >= GEAR_MAX) err("Väskan är full"); else { S.gold -= p; it.id = newId(); gainGear(it, "Du köpte"); save(); } } }
  if(a==="upgrade"){ const c = smithCost(S.weapon); if(c && (S.bag[c.ore]||0)>=c.n && S.gold>=c.gold){ removeItem(c.ore, c.n); S.gold -= c.gold; S.weapon++; log(`Ditt vapen är nu +${S.weapon}.`, "#e6bd5c"); burst(P.x,P.y,"#ffd36b",16); save(true); } }
  if(a==="craft"){ const r = RECIPES[+b.dataset.i]; for(const [kk,v] of Object.entries(r.need)) removeItem(kk, v); addItem(r.out, r.n); log(`Du bryggde ${ITEMS[r.out].name}.`, "#9cf07a"); refreshTracker(); }
  if(a==="tal"){ const t = TALENTS[S.cls].find(x=>x.id===id); S.talents[id] = (S.talents[id]||0)+1; recompute(false); buildHotbar(); log(`Talang: ${t.name} ${S.talents[id]}/${t.max}`, "#e6bd5c"); save(); }
  if(a==="respec"){ const c = respecCost();
    if(!respecArm){ respecArm = true; } else if(S.gold >= c && talentsSpent() > 0){ respecArm = false; S.gold -= c; S.talents = {}; recompute(false); buildHotbar(); log(`Dina talanger är återställda (${c} guld).`, "#e6bd5c"); burst(P.x, P.y, "#ffd36b", 16); save(true); } }
  else respecArm = false;
  if(a==="newchar"){ save(true); selChar = S.id; closePanel(); running = false; S = null; P = null; showCreate(); return; }
  renderPanel();
});

// ======================= CREATION / CHARACTER SELECT =======================
const MAX_CHARS = 5;
let pick = {race:"human", cls:"mage"}, localSave = null, chars = [], selChar = null, delArm = null;
const newId = () => Math.random().toString(36).slice(2,10);
function showCreate(){
  $("create").hidden = false; delArm = null;
  if(chars.length){ showSelect(); } else showNew(false);
}
function showSelect(){ $("selbox").hidden = false; $("newbox").hidden = true; if(!chars.find(c=>c.id===selChar)) selChar = chars[0] && chars[0].id; renderCharList(); }
function showNew(back){ $("selbox").hidden = true; $("newbox").hidden = false; $("backbtn").hidden = !back; $("start").textContent = "Börja äventyret"; renderPicks(); }
function renderCont(){ if(!running && !$("create").hidden){ if(chars.length && $("newbox").hidden) showSelect(); else if(chars.length && $("backbtn").hidden) showSelect(); } }
function charPlace(c){ if(c.x==null) return HUBS[RACE_HUB[c.race]].name; const z = zinfo(zoneAtTile(Math.floor(c.x/TILE), Math.floor(c.y/TILE))); return z ? z.name : ""; }
function renderCharList(){
  chars.sort((a,b)=>(b.t||0)-(a.t||0));
  $("charlist").innerHTML = chars.map(c=>`<div class="char ${c.id===selChar?"sel":""}" data-cid="${c.id}" role="button" tabindex="0"><canvas width="64" height="64" data-pv="${c.id}"></canvas><div class="ci"><b>${esc(c.name)}</b><div>Nivå ${c.level} ${RACES[c.race].name} ${CLASSES[c.cls].name} · ${esc(charPlace(c))}</div></div><button class="del ${delArm===c.id?"confirm":""}" data-del="${c.id}">${delArm===c.id?"Radera – är du säker?":"Radera"}</button></div>`).join("");
  $("charcount").textContent = `${chars.length} av ${MAX_CHARS} karaktärer`;
  $("newcharbtn").disabled = chars.length >= MAX_CHARS; $("newcharbtn").title = chars.length >= MAX_CHARS ? "Du har redan 5 karaktärer. Radera en för att skapa en ny." : "";
  $("playbtn").disabled = !selChar;
  drawCharPreviews(0);
}
// draw the little character portraits; retries only redraw the canvases (never rebuild the list, so clicks aren't lost)
function drawCharPreviews(tries){
  let missing = false;
  document.querySelectorAll("[data-pv]").forEach(cv=>{ const c = chars.find(x=>x.id===cv.dataset.pv), g = cv.getContext("2d"); g.clearRect(0,0,64,64);
    const [sx,sy] = raceScale(c.race); if(!drawLPC(g, raceLook(`p_${c.cls}_${c.race}`, c.cls, c.race), 32, 62, {anim:"walk", frame:0, dir:2}, sx, sy)) missing = true; });
  clearTimeout(drawCharPreviews._t);
  if(missing && tries < 20) drawCharPreviews._t = setTimeout(()=>{ if(!running && !$("selbox").hidden) drawCharPreviews(tries+1); }, 300);
}
$("charlist").addEventListener("click", e=>{
  const d = e.target.closest("[data-del]");
  if(d){ const id = d.dataset.del; if(delArm === id){ chars = chars.filter(c=>c.id!==id); delArm = null; storeChars(true); if(!chars.length){ showNew(false); return; } } else delArm = id; renderCharList(); return; }
  const c = e.target.closest("[data-cid]"); if(!c) return;
  const id = c.dataset.cid, now = performance.now();
  // double click = two clicks on the same character within 450 ms (works even though the list is redrawn)
  if(lastCharClick.id === id && now - lastCharClick.t < 600){ lastCharClick = {id:null, t:0}; const ch = chars.find(x=>x.id===id); if(ch && !running) startGame(ch); return; }
  lastCharClick = {id, t:now};
  selChar = id; if(delArm){ delArm = null; renderCharList(); return; }
  document.querySelectorAll("#charlist [data-cid]").forEach(el=>el.classList.toggle("sel", el.dataset.cid===id)); $("playbtn").disabled = false;
});
let lastCharClick = {id:null, t:0};
$("charlist").addEventListener("dblclick", e=>{ if(e.target.closest("[data-del]")) return; const c = e.target.closest("[data-cid]"); if(!c) return; const ch = chars.find(x=>x.id===c.dataset.cid); if(ch && !running) startGame(ch); });
$("charlist").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const c = e.target.closest("[data-cid]"); if(c){ const ch = chars.find(x=>x.id===c.dataset.cid); if(ch) startGame(ch); } } });
$("playbtn").addEventListener("click", ()=>{ const c = chars.find(x=>x.id===selChar); if(c) startGame(c); });
$("newcharbtn").addEventListener("click", ()=>{ if(chars.length < MAX_CHARS) showNew(true); });
$("backbtn").addEventListener("click", showSelect);
function renderPicks(){
  $("races").innerHTML = Object.entries(RACES).map(([k,r])=>`<button class="pick ${pick.race===k?"sel":""}" data-race="${k}"><b><i class="sw" style="background:${r.skin}"></i>${r.name}</b><span>${r.desc}</span></button>`).join("");
  $("classes").innerHTML = Object.entries(CLASSES).map(([k,c])=>`<button class="pick ${pick.cls===k?"sel":""}" data-cls="${k}"><b><i class="sw" style="background:${c.color}"></i>${c.name}</b></button>`).join("");
  const pv = $("preview").getContext("2d"); pv.setTransform(1,0,0,1,0,0); pv.clearRect(0,0,120,120); pv.setTransform(2.2,0,0,2.2,0,0);
  const look = raceLook(`p_${pick.cls}_${pick.race}`, pick.cls, pick.race); const [sx,sy] = raceScale(pick.race);
  pv.setTransform(1.7,0,0,1.7,0,0);
  if(!drawLPC(pv, look, 35, 66, {anim:"walk", frame:0, dir:2}, sx, sy)){ pv.setTransform(2.2,0,0,2.2,0,0); drawHero(pv, 27, 48, {race:pick.race, cls:pick.cls, skin:RACES[pick.race].skin, hair:RACES[pick.race].hair, body:CLASSES[pick.cls].color, fx:1}); clearTimeout(renderPicks._t); renderPicks._t = setTimeout(()=>{ if(!running) renderPicks(); }, 250); }
}
$("races").addEventListener("click", e=>{ const b = e.target.closest("[data-race]"); if(b){ pick.race = b.dataset.race; renderPicks(); } });
$("classes").addEventListener("click", e=>{ const b = e.target.closest("[data-cls]"); if(b){ pick.cls = b.dataset.cls; renderPicks(); } });
$("start").addEventListener("click", ()=>{
  const name = ($("cname").value||"").trim().slice(0,16) || "Hjälte";
  if(chars.length >= MAX_CHARS) return;
  const sv = newSave(name, pick.race, pick.cls); sv.id = newId(); chars.push(sv); selChar = sv.id;
  startGame(sv, true);
});

function startGame(sv, fresh){
  S = Object.assign(newSave(sv.name, sv.race, sv.cls), sv); if(!S.id){ S.id = newId(); }
  S.skills = Object.assign({mining:1, herb:1}, sv.skills||{});
  if(!Array.isArray(sv.learned)) S.learned = allBarIds().filter(id=>AB[id].lvl<=S.level && AB[id].lvl<=16);
  S.learned = S.learned.filter(id=>AB[id]); ensureBars();
  spawnAll();
  if(!sv.v || sv.v < 3){ S.quests = {}; S.qbag = {}; S.x = S.y = null; }
  S.qbag = S.qbag || {}; S.gear = Array.isArray(S.gear) ? S.gear : []; S.eq = S.eq || {};
  const home = HUBS[RACE_HUB[S.race]];
  P = {x:home.x*TILE+16, y:(home.y+2)*TILE+16, r:11, hp:1, maxHp:0, mana:0, maxMana:0, rage:0, focus:100, energy:100, cp:0, form:null, target:null, casting:null,
    gcd:0, cds:{}, buffs:{}, hots:[], shield:0, shieldT:0, autoT:0, combatT:0, potCd:0, fx:1, moving:false, dash:null, leap:null, dead:false};
  if(S.x && S.y && !collides(S.x, S.y, 10)){ P.x = S.x; P.y = S.y; }
  recompute(true);
  $("create").hidden = true; $("dead").hidden = true; closePanel();
  buildHotbar(); refreshTracker(); running = true; curZone = null;
  localSave = serialize();
  if(fresh){ log(`Välkommen till ${home.name}! Prata med personerna med gult ! för dina första uppdrag.`, "#e6bd5c"); log("Tryck H för hjälp med kontrollerna.", "#93a4ad"); save(true); }
}

// ======================= INPUT =======================
const ARROWS = {arrowup:"up", arrowdown:"down", arrowleft:"left", arrowright:"right"};
function moveDir(k){ if(ARROWS[k]) return ARROWS[k]; const a = kbAction(k); return a==="up"||a==="down"||a==="left"||a==="right" ? a : null; }
addEventListener("keydown", e=>{
  if(!running || e.target.tagName==="INPUT" || e.target.tagName==="SELECT") return;
  const k = e.key.toLowerCase();
  if(rebinding){ e.preventDefault(); if(!["shift","control","alt","meta"].includes(k)) finishRebind(k); return; }
  const dir = moveDir(k); if(dir){ keys.add(dir); e.preventDefault(); return; }
  if(e.repeat) return;
  if(k==="escape"){ if(panelKind) closePanel(); else if(P.casting) cancelCast(); else if(P.target) setTarget(null); else openPanel("menu"); return; }
  const a = kbAction(k); if(!a) return;
  if(a.startsWith("bar")){ const id = currentBar()[+a.slice(3)-1]; if(id) tryUse(id); return; }
  if(a==="target"){ e.preventDefault(); cycleTarget(); return; }
  if(a==="attack") return startAttack();
  if(a==="interact") return interact();
  if(a==="potHp") return usePotion("hp");
  if(a==="potMana") return usePotion("mana");
  if(a==="rest") return toggleRest();
  const pm = {char:"char", bag:"bag", talents:"talents", quests:"quests", info:"help", map:"map", spells:"spells", craft:"craft"}; if(pm[a]){ e.preventDefault(); return openPanel(pm[a]); }
});
addEventListener("keyup", e=>{ const d = moveDir(e.key.toLowerCase()); if(d) keys.delete(d); });
addEventListener("blur", ()=>keys.clear());
$("menu").addEventListener("click", e=>{ const b = e.target.closest("[data-p]"); if(b) openPanel(b.dataset.p); });
$("revive").addEventListener("click", revive);
// start auto attack on the current target (right-click, T or the touch button)
function startAttack(m){ m = m || P.target; if(!m || m.dead || P.dead) return; setTarget(m); P.autoTarget = m; P.autoT = Math.min(P.autoT, 0.2); }
function mobAt(e){ const wx = e.clientX/ZOOM + cam.x, wy = e.clientY/ZOOM + cam.y; let best = null, bd = 34;
  for(const m of mobs){ if(m.dead) continue; const cy = m.y - Math.max(m.r, 22); const d = Math.hypot(m.x-wx, cy-wy); if(d < bd + m.r*0.5){ bd = d; best = m; } } return best; }
let lastRight = 0;
// right-click (also Ctrl+click on a Mac, and double-click) starts attacking
cv.addEventListener("contextmenu", e=>{ e.preventDefault(); if(running && performance.now()-lastRight > 150) startAttack(mobAt(e)); });
cv.addEventListener("dblclick", e=>{ if(running){ const m = mobAt(e); if(m) startAttack(m); } });
cv.addEventListener("pointerdown", e=>{
  if(!running) return;
  const wx = e.clientX/ZOOM + cam.x, wy = e.clientY/ZOOM + cam.y;
  const best = mobAt(e);
  if(e.button === 2 || (e.button === 0 && e.ctrlKey)){ lastRight = performance.now(); startAttack(best); return; }
  if(best){ setTarget(best); return; }
  for(const n of npcs){ if(Math.hypot(n.x-wx, n.y-20-wy) < 26){ if(dist(P,n) < 90) openPanel("npc", n.id); else err("För långt bort"); return; } }
  for(const n of nodes){ if(n.active && Math.hypot(n.x-wx, n.y-wy) < 22){ if(dist(P,n) < 60) startGather(n); else err("För långt bort"); return; } }
});
// touch joystick
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
if(isTouch){ $("menu").hidden = false; $("joy").hidden = false; $("interact").hidden = false; $("tabbtn").hidden = false; $("atkbtn").hidden = false; }
(function(){ const j = $("joy"), k = j.querySelector("i"); let id = null;
  const mv = e=>{ const r = j.getBoundingClientRect(); let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2); const l = Math.hypot(dx,dy), mx = 45; if(l > mx){ dx = dx/l*mx; dy = dy/l*mx; } joy.x = dx/mx; joy.y = dy/mx; k.style.transform = `translate(${dx}px,${dy}px)`; };
  j.addEventListener("pointerdown", e=>{ id = e.pointerId; j.setPointerCapture(id); mv(e); });
  j.addEventListener("pointermove", e=>{ if(e.pointerId===id) mv(e); });
  const end = e=>{ if(e.pointerId!==id) return; id = null; joy.x = joy.y = 0; k.style.transform = ""; };
  j.addEventListener("pointerup", end); j.addEventListener("pointercancel", end);
})();
$("interact").addEventListener("click", interact);
$("tabbtn").addEventListener("click", cycleTarget);
$("atkbtn").addEventListener("click", ()=>startAttack());

// ======================= SAVE =======================
// Up to 5 characters, kept in this browser and (on claude.ai) in your account.
const LS_KEY = "rimfrost-save-v1", LS_CHARS = "rimfrost-chars-v1";
let cloud = null, cloudBusy = false, cloudDirty = false, lastCloud = 0, saveT = 0;
function serialize(){ return {v:3, id:S.id, qbag:S.qbag, name:S.name, race:S.race, cls:S.cls, level:S.level, xp:S.xp, gold:S.gold, weapon:S.weapon, bag:S.bag, gear:S.gear||[], eq:S.eq||{}, bars:S.bars||null, skills:S.skills, talents:S.talents, quests:S.quests, learned:S.learned, x:P?(P.inDungeon?DUNGEONS[P.inDungeon].ent.x*TILE+16:Math.round(P.x)):null, y:P?(P.inDungeon?(DUNGEONS[P.inDungeon].ent.y+1)*TILE+16:Math.round(P.y)):null, t:Date.now()}; }
function storeChars(important){
  try{ localStorage.setItem(LS_CHARS, JSON.stringify(chars)); }catch(_){}
  if(cloud && (important || Date.now()-lastCloud > 30000)) pushCloud();
}
function save(important){
  if(!S || !running) return;
  const data = serialize(); localSave = data;
  const i = chars.findIndex(c=>c.id===data.id); if(i>=0) chars[i] = data; else chars.push(data);
  storeChars(important);
}
function pushCloud(){
  if(!cloud) return; if(cloudBusy){ cloudDirty = true; return; }
  cloudBusy = true; lastCloud = Date.now();
  cloud.ref.set({json: JSON.stringify({v:4, chars}), t: Date.now()}).catch(()=>{ cloud = null; }).finally(()=>{ cloudBusy = false; if(cloudDirty && cloud){ cloudDirty = false; pushCloud(); } });
}
function mergeChars(list){
  for(const c of list){ if(!c || !c.name) continue; if(!c.id) c.id = newId();
    const i = chars.findIndex(x=>x.id===c.id); if(i<0) chars.push(c); else if((c.t||0) > (chars[i].t||0)) chars[i] = c; }
  chars.sort((a,b)=>(b.t||0)-(a.t||0)); chars = chars.slice(0, MAX_CHARS);
}
function loadLocalChars(){
  try{ const raw = localStorage.getItem(LS_CHARS); if(raw) mergeChars(JSON.parse(raw)); }catch(_){}
  try{ const old = localStorage.getItem(LS_KEY); if(old){ const s = JSON.parse(old); if(s && s.name && !chars.some(c=>c.name===s.name && c.race===s.race && c.cls===s.cls)){ s.id = s.id || newId(); mergeChars([s]); } localStorage.removeItem(LS_KEY); localStorage.setItem(LS_CHARS, JSON.stringify(chars)); } }catch(_){}
}
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/" + id + "/save");
    const snap = await ref.get();
    cloud = {ref};
    if(snap.exists){ const d = snap.data(); const s = d && d.json ? JSON.parse(d.json) : null;
      if(s){ const before = chars.length; mergeChars(Array.isArray(s.chars) ? s.chars : [s]); if(!running){ if(!before && chars.length) showSelect(); else if(!$("selbox").hidden) renderCharList(); } } }
  }catch(_){ cloud = null; }
}
addEventListener("visibilitychange", ()=>{ if(document.hidden) save(true); });
addEventListener("pagehide", ()=>save());

// ======================= LOOP / BOOT =======================
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0); last = ts;
  if(running){ update(dt); updHUD(dt); saveT += dt; if(saveT > 5){ saveT = 0; save(); } }
  render();
  if(running && panelKind==="map") drawMapPlayer($("wmap"));
  requestAnimationFrame(loop);
}
function boot(data){
  resize(); genWorld(); makeTiles(); makeMinimap();
  loadLocalChars();
  const hs = data && data.save;
  if(hs && hs.name) startGame(hs); else showCreate();
  initCloud();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({save: running && S ? serialize() : null}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

<script>
// installable web app: register the service worker and offer updates
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => { const b = document.getElementById("swupdate"); b.hidden = false; b.onclick = () => { try{ if(typeof save === "function" && typeof running !== "undefined" && running) save(true); }catch(_){} w.postMessage("skipWaiting"); }; };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if(!w) return;
      w.addEventListener("statechange", () => { if(w.state === "installed" && navigator.serviceWorker.controller) offer(w); }); });
    setInterval(() => reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
}
</script>
