<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rimfrost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen canvas world with floating HUD frames; modal panels slide over the centre. Single dark "frost night" look by choice. */
:root{
  --night:#0d1216; --panel:#151c22; --panel2:#1c252c; --line:#2e3b45; --text:#e4ecef; --mute:#93a4ad;
  --frost:#9fd6e8; --ember:#f08a4b; --coin:#e6bd5c; --xp:#9b72e0; --hp:#4fbf5d; --bad:#e2534d;
  --mana:#3f86e0; --rage:#d2443c; --focus:#d6a13d; --energy:#e8d04a;
  --display:"Uncial Antiqua", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;background:#0b1013}
.hud{position:fixed;pointer-events:none;z-index:5}
.hud *{pointer-events:auto}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* unit frames */
#frames{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 200px)}
.frame{background:rgba(21,28,34,.92);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:220px;max-width:44vw}
.frame .top{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
.frame .top span:first-child{overflow:hidden;text-overflow:ellipsis}
.frame .sub{font-size:12px;color:var(--mute);margin-bottom:4px}
.bar{position:relative;height:14px;background:#0a0e11;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .15s}
.bar b{position:absolute;inset:0;font-size:11px;font-weight:700;text-align:center;line-height:14px;text-shadow:0 1px 1px #000}
.bar .shield{background:rgba(230,240,255,.55)}
#tframe[hidden]{display:none}
.elite{color:var(--coin)}
.lvl-red{color:#ff5a4f}.lvl-orange{color:#ff9a3c}.lvl-yellow{color:#f3dc55}.lvl-green{color:#62d36b}.lvl-gray{color:#8d979c}

/* minimap + tracker */
#side{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:172px;display:flex;flex-direction:column;gap:8px}
#mmwrap{background:rgba(21,28,34,.92);border:1px solid var(--line);border-radius:6px;padding:6px}
#mm{display:block;width:160px;height:90px;border-radius:3px;image-rendering:pixelated}
#zone{font-family:var(--display);font-size:13px;text-align:center;margin-top:4px;color:var(--frost)}
#gold{font-size:13px;text-align:center;color:var(--coin);font-weight:700}
#tracker{background:rgba(21,28,34,.8);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;max-height:34vh;overflow:auto}
#tracker h4{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#tracker .q{margin-bottom:6px}
#tracker .q b{color:var(--coin);font-weight:700}
#tracker .q.done b{color:var(--hp)}
#tracker .o{color:var(--mute)}

/* bottom bar */
#bottom{left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,calc(100vw - 20px))}
#cast{width:240px;max-width:70vw}
#cast[hidden]{display:none}
#cast .bar{height:16px;border:1px solid var(--line)}
#cast i{background:linear-gradient(90deg,#c9a640,#f2d77a)}
#hotbar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:48px;height:48px;border-radius:6px;border:1px solid #3b4955;background:#10161a;padding:0;overflow:hidden;color:#fff}
.slot canvas{display:block;width:100%;height:100%}
.slot .k{position:absolute;top:1px;left:3px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
.slot.oom canvas{filter:saturate(.25) brightness(.55)}
.slot.oor{box-shadow:inset 0 0 0 2px rgba(226,83,77,.75)}
.slot.locked{opacity:.35}
.slot.active{box-shadow:0 0 0 2px var(--coin)}
.slot.pot .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
#xpbar{width:100%;height:10px;border-radius:5px;background:#0a0e11;border:1px solid var(--line);position:relative;overflow:hidden}
#xpbar i{position:absolute;inset:0 auto 0 0;background:var(--xp)}
#xpbar b{position:absolute;inset:0;font-size:9px;line-height:9px;text-align:center;font-weight:700}
#menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#menu button{background:rgba(21,28,34,.92);color:var(--text);border:1px solid var(--line);border-radius:4px;font-size:12px;padding:3px 8px}
#menu button .key{color:var(--mute);margin-left:4px}
#menu button.glow{border-color:var(--coin);color:var(--coin)}

/* log */
#log{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:280px;max-width:40vw;font-size:12.5px;line-height:1.35;pointer-events:none}
#log div{background:rgba(10,14,17,.55);padding:1px 6px;border-radius:3px;margin-top:2px;animation:fade 9s forwards}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}

/* centre banners */
#banner{left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none}
#banner .big{font-family:var(--display);font-size:clamp(24px,4vw,40px);color:var(--coin);text-shadow:0 2px 10px #000}
#banner .small{font-size:15px;color:var(--text);text-shadow:0 1px 4px #000}

/* panels */
.panel{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:16px 18px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px;color:var(--frost);text-wrap:balance}
.panel h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.panel .x{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:5px;width:30px;height:30px;font-size:16px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:14px;font-weight:700}
.btn.pri{background:var(--frost);color:#0d1216;border-color:var(--frost)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.item .d{font-size:12.5px;color:var(--mute)}
.item > div{min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.stats span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.coin{color:var(--coin);font-weight:700}

/* talents */
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:left;color:var(--text)}
.tal .n{font-weight:800;display:flex;justify-content:space-between;gap:6px}
.tal .r{font-variant-numeric:tabular-nums;color:var(--coin)}
.tal .d{font-size:12.5px;color:var(--mute);margin-top:3px}
.tal.can{border-color:var(--coin)}
.tal.max{border-color:var(--hp)}
.tal:disabled{opacity:.45;cursor:not-allowed}

/* creation */
#create{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#1d3340 0%,var(--night) 60%);padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#create .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#create h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,76px);margin:0;color:var(--frost);text-align:center;letter-spacing:.02em;text-shadow:0 0 30px rgba(159,214,232,.25)}
#create .tag{text-align:center;color:var(--mute);margin-top:-8px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:4px}
.pick b{font-size:16px}
.pick span{font-size:12.5px;color:var(--mute)}
.pick.sel{border-color:var(--frost);box-shadow:0 0 0 1px var(--frost) inset;background:#18262e}
.pick .sw{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:6px;border:1px solid rgba(255,255,255,.3)}
#cname{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 12px;font-size:16px;font-family:var(--body);width:min(320px,100%)}
#preview{display:block;width:120px;height:120px;margin:0 auto}
.abl{font-size:13px;color:var(--mute)}
.abl b{color:var(--text)}

/* death */
#dead{position:fixed;inset:0;z-index:25;background:rgba(40,46,52,.55);backdrop-filter:grayscale(1);display:flex;align-items:center;justify-content:center}
#dead .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;text-align:center}
#dead h2{font-family:var(--display);font-weight:400;color:var(--bad);margin:0 0 10px}

/* touch */
#joy{position:fixed;z-index:6;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(159,214,232,.35)}
#interact{position:fixed;z-index:6;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:rgba(21,28,34,.9);border:1px solid var(--coin);color:var(--coin);font-weight:800;font-size:13px}
#tabbtn{position:fixed;z-index:6;right:max(96px,calc(env(safe-area-inset-right,0px) + 96px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:rgba(21,28,34,.9);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:12px}
@media (max-width:640px){
  .frame{width:160px;padding:4px 6px}
  #side{width:120px}
  #mm{width:110px;height:62px}
  #tracker{display:none}
  .slot{width:40px;height:40px}
  #log{display:none}
}
@media (prefers-reduced-motion:reduce){#log div{animation:none}.bar i{transition:none}}
</style>

<canvas id="game"></canvas>

<div class="hud" id="frames">
  <div class="frame" id="pframe">
    <div class="top"><span id="pname">-</span><span class="num" id="plvl">1</span></div>
    <div class="sub" id="pdesc">-</div>
    <div class="bar"><i id="phpi" style="background:var(--hp)"></i><i id="pshi" class="shield"></i><b class="num" id="phpt"></b></div>
    <div class="bar"><i id="presi"></i><b class="num" id="prest"></b></div>
    <div class="sub" id="pbuffs" style="margin:4px 0 0;min-height:0"></div>
  </div>
  <div class="frame" id="tframe" hidden>
    <div class="top"><span id="tname">-</span><span class="num" id="tlvl"></span></div>
    <div class="sub" id="tdesc"></div>
    <div class="bar"><i id="thpi" style="background:var(--bad)"></i><b class="num" id="thpt"></b></div>
  </div>
</div>

<div class="hud" id="side">
  <div id="mmwrap"><canvas id="mm" width="110" height="90"></canvas><div id="zone">-</div><div id="gold" class="num">0 guld</div></div>
  <div id="tracker"></div>
</div>

<div class="hud" id="log"></div>
<div class="hud" id="banner"></div>

<div class="hud" id="bottom">
  <div id="cast" hidden><div class="bar"><i id="casti"></i><b id="castt"></b></div></div>
  <div id="hotbar"></div>
  <div id="xpbar"><i id="xpi"></i><b class="num" id="xpt"></b></div>
  <div id="menu">
    <button data-p="char">Karaktär<span class="key">C</span></button>
    <button data-p="bag">Väska<span class="key">B</span></button>
    <button data-p="talents" id="talbtn">Talanger<span class="key">N</span></button>
    <button data-p="quests">Uppdrag<span class="key">L</span></button>
    <button data-p="help">Hjälp<span class="key">H</span></button>
  </div>
</div>

<div id="panel" class="panel" hidden></div>
<div id="dead" hidden><div class="box"><h2>Du har dött</h2><p class="muted">Din ande vandrar tillbaka till kyrkogården i Frostvik.</p><button class="btn pri" id="revive">Återuppstå</button></div></div>
<div id="joy" hidden><i></i></div>
<button id="interact" hidden>E</button>
<button id="tabbtn" hidden>Mål</button>

<div id="create">
  <div class="wrap">
    <h1>Rimfrost</h1>
    <div id="contbox" class="row" style="justify-content:center"></div>
    <div id="newbox" class="list" style="gap:14px">
      <canvas id="preview" width="120" height="120"></canvas>
      <div class="row" style="justify-content:center"><input id="cname" maxlength="16" placeholder="Namn på din hjälte" value="Christoffer"></div>
      <h3 class="muted" style="margin:6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase">Ras</h3>
      <div class="picks" id="races"></div>
      <h3 class="muted" style="margin:6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase">Klass</h3>
      <div class="picks" id="classes"></div>
      <div class="row" style="justify-content:center"><button class="btn pri" id="start" style="font-size:17px;padding:10px 26px">Börja äventyret</button></div>
    </div>
  </div>
</div>
<script>
"use strict";
// ======================= DATA =======================
const TILE = 32, MW = 160, MH = 90, TOWN = {x:55, y:45}, OUTPOST = {x:117, y:46}, MAX_LVL = 30;

const RACES = {
  human:{name:"Människa", skin:"#e2b48e", desc:"+10% erfarenhet (XP) från allt du gör.", hair:"#5b3a22"},
  orc:{name:"Orc", skin:"#6f9a4a", desc:"+10% skada med alla attacker och trollformler.", hair:"#1e1e1e"},
  elf:{name:"Alv", skin:"#efd8c8", desc:"+5% chans till kritisk träff och +10% mana.", hair:"#e7dca0"},
  dwarf:{name:"Dvärg", skin:"#d9a07c", desc:"+15% maxhälsa och börjar med Gruvdrift 25.", hair:"#a2462a"}
};

const CLASSES = {
  mage:{name:"Mage", color:"#4a7be0", res:"mana", hp:0.9, armor:1},
  warrior:{name:"Warrior", color:"#b0763a", res:"rage", hp:1.25, armor:0.85},
  hunter:{name:"Hunter", color:"#5f8f3e", res:"focus", hp:1.05, armor:0.92},
  priest:{name:"Priest", color:"#ecebe2", res:"mana", hp:0.95, armor:1},
  druid:{name:"Druid", color:"#b8742f", res:"mana", hp:1.05, armor:0.95}
};
const RES_COLOR = {mana:"var(--mana)", rage:"var(--rage)", focus:"var(--focus)", energy:"var(--energy)"};
const RES_NAME = {mana:"Mana", rage:"Ilska", focus:"Fokus", energy:"Energi"};
const SCHOOL_COLOR = {fire:"#ff8a3a", frost:"#8fd8ff", arcane:"#d38cff", nature:"#7fdc5a", holy:"#ffe37a", shadow:"#a77bff", phys:"#f2f2f2"};

// Abilities. run(t) fires when the cast finishes. Helpers (pow, hit, proj, dot...) live in the engine.
const AB = {
  // ---- Mage
  fireball:{name:"Eldklot", lvl:1, cost:22, cast:2.0, range:300, school:"fire", icon:"orb", tgt:"enemy",
    desc:()=>`Kastar ett eldklot som gör ${fmt(pow()*2.2)} eldskada.`,
    run:t=>proj(t,"#ff8a3a",7,()=>hit(t,pow()*2.2,"fire","fireball"))},
  frostbolt:{name:"Isspjut", lvl:2, cost:18, cast:1.7, range:300, school:"frost", icon:"shard", tgt:"enemy",
    desc:()=>`${fmt(pow()*1.7)} frostskada och saktar ner målet med 50% i 5 sek.`,
    run:t=>proj(t,"#8fd8ff",6,()=>{hit(t,pow()*1.7,"frost","frostbolt");slow(t,0.5,5);})},
  fireblast:{name:"Glödstöt", lvl:4, cost:20, cd:8, range:220, school:"fire", icon:"burst", tgt:"enemy",
    desc:()=>`Omedelbar eldstöt: ${fmt(pow()*1.5)} skada.`,
    run:t=>{burst(t.x,t.y,"#ff8a3a",14);hit(t,pow()*1.5,"fire","fireblast");}},
  frostnova:{name:"Frostring", lvl:6, cost:25, cd:20, range:0, school:"frost", icon:"nova", tgt:"self",
    desc:()=>`Fryser alla fiender inom 100 till marken i 4 sek och gör ${fmt(pow()*0.5)} skada.`,
    run:()=>{ring(P.x,P.y,100,"#bfe9ff");aoe(P.x,P.y,100,m=>{hit(m,pow()*0.5,"frost","frostnova");root(m,4);});}},
  blizzard:{name:"Snöstorm", lvl:10, cost:45, cd:12, range:300, school:"frost", icon:"storm", tgt:"enemy",
    desc:()=>`Iskall storm vid målet i 4 sek. ${fmt(pow()*0.7)} skada per sekund och saktar ner.`,
    run:t=>zone(t.x,t.y,90,4,pow()*0.7,"frost","blizzard",true)},
  pyroblast:{name:"Solbrand", lvl:14, cost:50, cd:10, cast:3.5, range:300, school:"fire", icon:"meteor", tgt:"enemy",
    desc:()=>`Enorm eldkula: ${fmt(pow()*4.2)} skada plus ${fmt(pow()*1.0)} brännskada över 8 sek.`,
    run:t=>proj(t,"#ffb347",11,()=>{hit(t,pow()*4.2,"fire","pyroblast");dot(t,"pyro",pow()*1.0,8,"fire");})},
  sparkrain:{name:"Gnistregn", lvl:18, cost:35, cd:6, range:300, school:"arcane", icon:"spark", tgt:"enemy",
    desc:()=>`Tre arkana gnistor som gör ${fmt(pow()*0.9)} skada var.`,
    run:t=>{[560,480,400].forEach(sp=>proj(t,"#d38cff",5,()=>hit(t,pow()*0.9,"arcane","sparkrain"),"orb",sp));}},
  icearmor:{name:"Ispansar", lvl:22, cost:40, cd:30, range:0, school:"frost", icon:"shield", tgt:"self",
    desc:()=>`Ett pansar av is som absorberar ${fmt(P.maxHp*0.35)} skada i 20 sek.`,
    run:()=>{P.shield=P.maxHp*0.35;P.shieldT=20;ring(P.x,P.y,30,"#bfe9ff");}},
  meteor:{name:"Meteorfall", lvl:26, cost:60, cd:20, cast:2.5, range:300, school:"fire", icon:"meteor", tgt:"enemy",
    desc:()=>`En meteor slår ner vid målet: ${fmt(pow()*4.0)} skada på alla fiender inom 90.`,
    run:t=>{const x=t.x,y=t.y;ring(x,y,90,"#ff8a3a");burst(x,y,"#ffb347",30);aoe(x,y,90,m=>hit(m,pow()*4.0,"fire","meteor"));}},

  // ---- Warrior
  heroic:{name:"Kraftigt hugg", lvl:1, cost:15, range:52, school:"phys", icon:"sword", tgt:"enemy",
    desc:()=>`Kraftigt hugg som gör ${fmt(pow()*1.7)} skada.`,
    run:t=>{slash(t);hit(t,pow()*1.7,"phys","heroic");}},
  charge:{name:"Stormlöpning", lvl:2, cost:0, cd:12, range:260, minRange:60, school:"phys", icon:"dash", tgt:"enemy", offGcd:true,
    desc:()=>`Rusar fram till målet, bedövar det i 1 sek och ger ${15+10*T("impCharge")} ilska.`,
    run:t=>{P.dash={t, speed:900}; addRes("rage",15+10*T("impCharge"));}},

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise(seed, scale){
  const r = rng(seed), gw = Math.ceil(MW/scale)+3, gh = Math.ceil(MH/scale)+3, g = [];

function clearLine(ax, ay, bx, by, r){ const d = Math.hypot(bx-ax, by-ay), n = Math.ceil(d/8); for(let i=1;i<=n;i++){ const t = i/n; if(collides(ax+(bx-ax)*t, ay+(by-ay)*t, r)) return false; } return true; }

    for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x+ox, ny = y+oy; if(nx<0||ny<0||nx>=w||ny>=h) continue; const j = ny*w+nx; if(prev[j] !== -1 || solidAt(x0+nx, y0+ny)) continue; prev[j] = i; q.push(j); } }

function steer(m, gx, gy, dt, spd){
  const r = Math.min(m.r, 12) - 1; let tx = gx, ty = gy;
  if(!clearLine(m.x, m.y, gx, gy, r)){
    m.pathT = (m.pathT||0) - dt;
    if(!m.path || m.pathT <= 0){ m.path = findPath(m, gx, gy); m.pathT = 0.6; }
    if(m.path && m.path.length){ while(m.path.length > 1 && clearLine(m.x, m.y, m.path[1].x, m.path[1].y, r)) m.path.shift();
      tx = m.path[0].x; ty = m.path[0].y; if(Math.hypot(tx-m.x, ty-m.y) < 6) m.path.shift(); }
  } else m.path = null;
  const d = Math.hypot(tx-m.x, ty-m.y) || 1, dx = (tx-m.x)/d, dy = (ty-m.y)/d;

function hit(m, base, school, ab){
  if(!m || m.dead) return null;
  if(m.evading){ floatText(m.x, m.y-m.r-10, "Undvek", "#cfd8dc"); return null; }
  const ld = m.lvl - S.level;
  if(ld > 0 && Math.random() < Math.min(0.35, 0.06*ld)){ floatText(m.x, m.y-m.r-14, "Miss", "#cfd8dc"); engage(m); return null; }
  let amt = base * genMult() * tmul(ab, school) * rand(0.92, 1.08) * lvlPenalty(m);
  const crit = Math.random() < critChance(m, school);
  if(crit) amt *= 2*(1+0.1*T("mortal"));
  amt = Math.max(1, Math.round(amt));
  damageMob(m, amt, crit, school);
  if(crit){
    if(school==="fire" && T("ignite")) dot(m, "ignite", amt*0.15*T("ignite"), 4, "fire", true);
    if(S.cls==="warrior" && school==="phys" && T("deepWounds")) dot(m, "deep", amt*0.15*T("deepWounds"), 4, "phys", true);
    if(T("hotStreak") && (ab==="fireball"||ab==="fireblast")){ buff("hotstreak", 15); log("Het svit! Nästa Pyroblast är omedelbar.", "#ffb347"); }
  }
  return {amt, crit};
}
function lvlPenalty(m){ const d = m.lvl - S.level; return d > 0 ? Math.max(0.5, 1 - 0.06*d) : 1; }
function damageMob(m, amt, crit, school){
  if(m.dead) return;
  m.hp -= amt; m.flash = 0.12; anchor(m);
  floatText(m.x + rand(-8,8), m.y - m.r - 14, crit ? amt+"!" : ""+amt, SCHOOL_COLOR[school]||"#fff", crit);
  engage(m);
  if(m.hp <= 0) killMob(m);
}
function dot(m, key, total, dur, school, raw){
  if(!m || m.dead || m.evading) return;
  if(!raw) total *= genMult();
  total *= lvlPenalty(m);
  m.dots = m.dots.filter(d=>d.key!==key);
  m.dots.push({key, per:total/dur, left:dur, tick:1, school});
  engage(m);
}
function slow(m, pct, dur){ if(!m||m.dead) return; m.slowPct = Math.max(pct, m.slowT>0?m.slowPct:0); m.slowT = Math.max(m.slowT, dur); }

function stun(m, dur){ if(!m||m.dead) return; m.stunT = Math.max(m.stunT, m.def.boss?dur*0.4:dur); m.tele = null; }
function aoe(x, y, r, fn){ mobs.filter(m=>!m.dead&&!m.evading&&Math.hypot(m.x-x,m.y-y)<r+m.r).forEach(fn); }
function zone(x, y, r, dur, dmg, school, ab, slows){ zones.push({x, y, r, left:dur, tick:0.4, dmg, school, ab, slows}); }
function proj(t, color, size, onHit, kind, sp){ projs.push({x:P.x, y:P.y-14, t, color, size, onHit, kind:kind||"orb", sp:sp||(kind==="arrow"?680:540)}); }
function buff(name, dur){ P.buffs[name] = dur; }
function healP(n){ n = Math.round(n); const before = P.hp; P.hp = Math.min(P.maxHp, P.hp+n); const got = Math.round(P.hp-before); if(got>0) floatText(P.x, P.y-40, "+"+got, "#7be08a"); }
function hot(key, total, dur){ P.hots = P.hots.filter(h=>h.key!==key); P.hots.push({key, per:total/dur, left:dur, tick:1}); }
function addCP(){ P.cp = Math.min(5, P.cp+1); }
function setForm(f){
  if(P.casting) cancelCast();
  P.form = f; P.cp = 0;
  if(f==="bear") P.rage = Math.max(P.rage, 10);
  if(f==="cat") P.energy = 100;
  recompute(false);
  ring(P.x, P.y, 40, f==="bear"?"#c89a68":f==="cat"?"#c9a3ff":"#9cf07a");
  buildHotbar();
}

function killMob(m){
  m.dead = true; m.hp = 0; m.dots = []; m.tele = null; m.state = "idle";
  m.respawn = m.def.boss ? 150 : m.elite ? 90 : 28;
  if(P.target === m) P.target = null;
  const diff = m.lvl - S.level;
  let xp = 0;
  if(diff > -5){ xp = (18 + m.lvl*9) * (m.elite ? 4 : 1) * clamp(1 + diff*0.1, 0.3, 1.5); }
  const gold = Math.max(1, Math.round((1 + m.lvl*0.8) * (m.elite?6:1) * rand(0.7,1.3)));
  S.gold += gold;
  let loot = `${gold} guld`;
  if(m.def.boss || Math.random() < 0.45){ addItem(m.def.drop, 1); loot += ` och ${ITEMS[m.def.drop].name}`; }
  if(m.elite && Math.random()<0.7){ addItem("potHp2",1); loot += " och Stor läkedryck"; }
  log(`${m.name} besegrad. Du plundrade ${loot}.`, "#d9e3e7");
  burst(m.x, m.y, m.def.color, 16);
  if(T("bloodthirst")) healP(P.maxHp*0.15);
  if(xp>0) gainXP(xp);
  questKill(m.type);
  if(m.def.boss){ showBanner(`${m.name} har fallit!`, m.type==="giant" ? "Väktaren Runa väntar på dig i Askvakten." : "Kapten Edda vill tacka dig.", 6); }
}

function avoidChances(){
  const pb = S.cls==="warrior" ? 0.04 : S.cls==="hunter" ? 0.02 : (S.cls==="druid" && P.form==="bear") ? 0.02 : 0;
  const dodge = 0.04 + teff("dodge") + (P.form==="cat" ? 0.03 : 0) + (S.race==="elf" ? 0.01 : 0);
  const parry = pb > 0 ? pb + teff("parry") : 0;
  return {dodge:Math.min(dodge, 0.1), parry:Math.min(parry, 0.09)};
}
function mobMiss(m){ return m ? clamp(0.05 + (S.level - m.lvl)*0.01, 0.01, 0.1) : 0.05; }
function playerDamage(raw, src, kind){
  if(P.dead) return;
  if(kind){ const av = avoidChances(), r = Math.random(); let txt = null;
    if(r < mobMiss(src)) txt = "Miss";
    else if(r < mobMiss(src) + av.dodge) txt = "Undvek";
    else if(kind==="melee" && r < mobMiss(src) + av.dodge + av.parry) txt = "Parerade";
    if(txt){ floatText(P.x + rand(-6,6), P.y-44, txt, "#cfe0e6"); P.combatT = 6; if(src && (!P.target || P.target.dead)) setTarget(src); return; } }
  if(src && src.lvl > S.level) raw *= 1 + 0.1*(src.lvl - S.level);
  let amt = Math.max(1, Math.round(raw * rand(0.9,1.1) * takenMult()));
  if(P.shield > 0){ const ab = Math.min(P.shield, amt); P.shield -= ab; amt -= ab; if(ab>0) floatText(P.x+10, P.y-46, "Absorberat", "#fff6d0"); }
  if(amt>0){ P.hp -= amt; floatText(P.x + rand(-6,6), P.y-44, "-"+amt, "#ff6b5e"); P.hurt = 0.18; }
  P.combatT = 6;
  if(resType()==="rage") addRes("rage", 2 + amt/P.maxHp*60);
  if(src && (!P.target || P.target.dead)) setTarget(src);
  if(P.hp <= 0) die();
}
function die(){
  P.dead = true; P.hp = 0; P.casting = null; P.dash = null; P.leap = null;
  for(const m of mobs) if(m.state==="chase") evade(m);
  document.getElementById("dead").hidden = false;
  log("Du har dött.", "#ff6b5e");
}
function revive(){
  P.dead = false;
  const sp = [TOWN, OUTPOST].sort((a,b)=>Math.hypot(P.x/TILE-a.x,P.y/TILE-a.y)-Math.hypot(P.x/TILE-b.x,P.y/TILE-b.y))[0];
  P.x = sp.x*TILE+16; P.y = (sp.y+2)*TILE+16;
  P.hp = P.maxHp*0.6; P.mana = P.maxMana*0.6; P.target = null; P.shield = 0;
  document.getElementById("dead").hidden = true;
  showBanner(sp===TOWN?"Frostvik":"Askvakten", "Du har återuppstått", 2.5);
  save(true);
}
function evade(m){ m.state = "return"; m.evading = true; m.dots = []; m.tele = null; }

// ---- abilities
function tryUse(id){
  if(!id || P.dead || !running) return;
  const a = AB[id];
  if(!S.learned.includes(id)) return;
  if(P.casting){ if(P.casting.kind==="gather") cancelCast(); else return; }
  if(!a.offGcd && P.gcd > 0) return;
  if((P.cds[id]||0) > 0) return err("Inte redo än");
  let t = null;
  if(a.tgt === "enemy"){
    t = P.target;
    if(!t || t.dead || t.evading){ t = nearestEnemy(a.range + 60); if(!t) return err("Du har inget mål"); setTarget(t); }
    const d = dist(P,t) - t.r;
    if(d > a.range) return err("För långt bort");
    if(a.minRange && d < a.minRange) return err("För nära");
  }
  if(a.check){ const c = a.check(t); if(c !== true) return err(c); }
  const type = resType(), cost = costOf(id);
  if(P[type] < cost) return err(`Inte tillräckligt med ${RES_NAME[type].toLowerCase()}`);
  const ct = castTime(id);
  if(!a.offGcd) P.gcd = 1.0;
  if(ct > 0){ P.casting = {kind:"spell", id, t, total:ct, el:0, label:a.name}; if(t) engage(t); }
  else { P[type] -= cost; finishAbility(id, t); }
}
function finishAbility(id, t){
  const a = AB[id];
  if(a.cd) P.cds[id] = a.cd;
  if(id==="pyroblast" && P.buffs.hotstreak) delete P.buffs.hotstreak;
  a.run(t);
  if(t) engage(t);
  if(t && P.target !== t) setTarget(t);
}
function cancelCast(why){ if(!P.casting) return; if(why && P.casting.kind==="spell") err(why); P.casting = null; }
function completeCast(){
  const c = P.casting; P.casting = null;
  if(c.kind === "gather") return finishGather(c.node);
  const a = AB[c.id], t = c.t;
  if(a.tgt==="enemy"){ if(!t || t.dead) return; if(dist(P,t)-t.r > a.range+40) return err("För långt bort"); }
  const type = resType(), cost = costOf(c.id);
  if(P[type] < cost) return err(`Inte tillräckligt med ${RES_NAME[type].toLowerCase()}`);
  P[type] -= cost; finishAbility(c.id, t);
}
function autoInfo(){
  if(P.form==="bear") return {range:55, spd:2.0, mult:1.0, rage:8};
  if(P.form==="cat") return {range:52, spd:1.1, mult:0.55};
  if(S.cls==="warrior") return {range:52, spd:2.2, mult:1.0, rage:9};
  if(S.cls==="hunter") return {range:320, spd:2.0, mult:0.85, ranged:true};
  return {range:52, spd:2.4, mult:0.6};
}
function autoAttack(dt){
  const ai = autoInfo(); P.autoT = Math.max(0, P.autoT - dt);
  const t = P.target; if(!ai || !t || t.dead || t.evading || P.casting || P.dash || P.autoT>0) return;
  if(dist(P,t) - t.r > ai.range) return;
  P.autoT = ai.spd; P.swing = 0.2;
  if(ai.ranged) proj(t, "#e9e2c8", 3, ()=>hit(t, pow()*ai.mult, "phys", "auto"), "arrow");
  else { hit(t, pow()*ai.mult, "phys", "auto"); if(ai.rage) addRes("rage", ai.rage); }
  engage(t);
}
function usePotion(kind){
  if(P.dead) return;
  if(P.potCd > 0) return err("Drycker är inte redo än");
  if(kind==="hp"){ const k = ["potHp3","potHp2","potHp"].find(x=>S.bag[x]>0); if(!k) return err("Du har inga läkedrycker"); useItem(k); }
  else { const k = ["potMana2","potMana"].find(x=>S.bag[x]>0); if(!k) return err("Du har inga manadrycker"); useItem(k); }
}
function useItem(k){
  if(!S.bag[k]) return;
  if(k.startsWith("pot")){ if(P.potCd>0) return err("Drycker är inte redo än"); P.potCd = 20; }
  if(k==="potHp") healP(P.maxHp*0.4);
  else if(k==="potHp2") healP(P.maxHp*0.75);
  else if(k==="potHp3") healP(P.maxHp);
  else if(k==="potMana"||k==="potMana2"){ P.mana = Math.min(P.maxMana, P.mana + P.maxMana*(k==="potMana2"?1:0.5)); floatText(P.x, P.y-40, "+mana", "#7fb2ff"); }
  else if(k==="elixir"){ buff("elixir", 300); log("Styrkeelixiret ger dig +20% skada i 5 minuter.", "#ffd36b"); }
  else return;
  removeItem(k, 1); burst(P.x, P.y-10, "#ff6b8a", 8);
  if(panelKind==="bag") renderPanel();
}

// ---- items / gathering / xp
function addItem(k, n){ S.bag[k] = (S.bag[k]||0) + n; }
function removeItem(k, n){ S.bag[k] = (S.bag[k]||0) - n; if(S.bag[k] <= 0) delete S.bag[k]; }
function startGather(n){
  const d = n.def, sk = S.skills[d.skill];
  if(sk < d.req) return err(`Kräver ${d.skill==="mining"?"Gruvdrift":"Örtplockning"} ${d.req} (du har ${sk})`);
  P.casting = {kind:"gather", node:n, total:1.6, el:0, label:(d.skill==="mining"?"Bryter ":"Plockar ")+ITEMS[d.item].name};
}
function finishGather(n){
  if(!n.active) return;
  const d = n.def; n.active = false; n.respawn = 45;
  const qty = Math.random()<0.25 ? 2 : 1; addItem(d.item, qty);
  floatText(n.x, n.y-24, `+${qty} ${ITEMS[d.item].name}`, "#f2e2a0");
  const sk = S.skills[d.skill], diff = sk - d.req;
  const gain = diff < 30 ? 2 : diff < 60 ? 1 : 0;
  if(gain && sk < SKILL_MAX){ S.skills[d.skill] = Math.min(SKILL_MAX, sk + gain); log(`${d.skill==="mining"?"Gruvdrift":"Örtplockning"} ökade till ${S.skills[d.skill]}.`, "#9fd6e8"); }
  gainXP((6 + S.level*3) * (gain?1:0.5));
  burst(n.x, n.y, d.color, 10);
  refreshTracker();
}
function gainXP(n){
  if(S.level >= MAX_LVL) return;
  n = Math.round(n * (S.race==="human" ? 1.1 : 1));
  S.xp += n; floatText(P.x, P.y-58, `+${n} XP`, "#b79bff");
  while(S.level < MAX_LVL && S.xp >= xpNeed(S.level)){ S.xp -= xpNeed(S.level); S.level++; levelUp(); }
  if(S.level >= MAX_LVL) S.xp = 0;
}
function levelUp(){
  recompute(true); P.rage = P.rage||0;
  ring(P.x, P.y, 70, "#ffd36b"); burst(P.x, P.y, "#ffd36b", 30);
  const canTrain = allBarIds().some(id=>AB[id].lvl===S.level && !S.learned.includes(id));
  let sub = canTrain ? "Din tränare i Frostvik har något nytt att lära dig." : "Du känner dig starkare.";
  if(S.level === 10) sub = "Talangsystemet är upplåst! Tryck N." + (canTrain ? " Besök också din tränare." : "");
  else if(S.level > 10) sub += " +1 talangpoäng.";
  if(canTrain) log("Du kan lära dig något nytt hos din tränare.", "#9fd6e8");
  showBanner(`Nivå ${S.level}!`, sub, 4);
  log(`Du nådde nivå ${S.level}.`, "#ffd36b");
  buildHotbar(); save(true);
}
function allBarIds(){ return S.cls==="druid" ? [...BARS.druid, ...BARS.druid_bear, ...BARS.druid_cat].filter(Boolean) : BARS[S.cls]; }

// ---- quests
const qById = id => QUESTS.find(q=>q.id===id);
function qAvailable(q){ return !S.quests[q.id] && S.level >= q.lvl && (q.req||[]).every(r=>S.quests[r]&&S.quests[r].state==="done"); }
function qSoon(q){ return !S.quests[q.id] && S.level < q.lvl && (q.req||[]).every(r=>S.quests[r]&&S.quests[r].state==="done"); }
function qProg(q, i){ const o = q.obj[i]; if(o[0]==="gather") return Math.min(S.bag[o[1]]||0, o[2]); return Math.min(S.quests[q.id].prog[i]||0, o[2]); }
function qReady(q){ const s = S.quests[q.id]; return s && s.state==="active" && q.obj.every((o,i)=>qProg(q,i)>=o[2]); }
function objName(o){ return o[0]==="kill" ? MOBS[o[1]].name : ITEMS[o[1]].name; }
function acceptQuest(id){ const q = qById(id); S.quests[id] = {state:"active", prog:q.obj.map(()=>0)}; log(`Nytt uppdrag: ${q.name}`, "#e6bd5c"); refreshTracker(); save(); }
function questKill(type){
  for(const q of QUESTS){ const s = S.quests[q.id]; if(!s || s.state!=="active") continue;
    q.obj.forEach((o,i)=>{ if(o[0]==="kill" && o[1]===type && s.prog[i] < o[2]){ s.prog[i]++; log(`${q.name}: ${MOBS[type].name} ${s.prog[i]}/${o[2]}`, "#e6bd5c"); if(qReady(q)) log(`${q.name} är klart – gå tillbaka och lämna in.`, "#7be08a"); } }); }
  refreshTracker();
}
function turnIn(id){
  const q = qById(id); if(!qReady(q)) return;
  q.obj.forEach(o=>{ if(o[0]==="gather") removeItem(o[1], o[2]); });
  S.quests[id].state = "done"; S.gold += q.gold;
  if(q.items) for(const [k,n] of Object.entries(q.items)) addItem(k, n);
  log(`Uppdrag klart: ${q.name}. +${q.gold} guld.`, "#7be08a");
  gainXP(q.xp); refreshTracker(); save(true);
  if(id==="q15") showBanner("Rimfrosts hjälte", `${S.name} har besegrat Draugkungen!`, 6);
}

// ======================= UPDATE =======================
const keys = new Set(); const joy = {x:0, y:0};
function collides(x, y, r){
  const x0 = Math.floor((x-r)/TILE), x1 = Math.floor((x+r)/TILE), y0 = Math.floor((y-r)/TILE), y1 = Math.floor((y+r)/TILE);
  for(let ty=y0; ty<=y1; ty++) for(let tx=x0; tx<=x1; tx++){ if(!solidAt(tx,ty)) continue;
    const cx = clamp(x, tx*TILE, tx*TILE+TILE), cy = clamp(y, ty*TILE, ty*TILE+TILE); if((x-cx)**2 + (y-cy)**2 < r*r) return true; }
  return false;
}
function moveEnt(e, dx, dy){ const r = Math.min(e.r, 12); if(!collides(e.x+dx, e.y, r)) e.x += dx; if(!collides(e.x, e.y+dy, r)) e.y += dy; }

function update(dt){
  time += dt;
  updPlayer(dt);
  for(const m of mobs) updMob(m, dt);
  // separation between chasing mobs
  const act = mobs.filter(m=>!m.dead && m.state==="chase");
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){ const a=act[i], b=act[j], d=dist(a,b), min=a.r+b.r; if(d<min && d>0.01){ const push=(min-d)/2, ux=(a.x-b.x)/d, uy=(a.y-b.y)/d; moveEnt(a, ux*push, uy*push); moveEnt(b, -ux*push, -uy*push); } }
  for(const n of nodes) if(!n.active){ n.respawn -= dt; if(n.respawn <= 0) n.active = true; }
  // projectiles
  for(const p of projs){
    if(p.toPlayer){ const dx=P.x-p.x, dy=(P.y-14)-p.y, d=Math.hypot(dx,dy); if(d < 10 || P.dead){ p.done=true; if(!P.dead) playerDamage(p.dmg, p.src, "ranged"); burst(p.x,p.y,p.color,6); continue; } p.x+=dx/d*p.sp*dt; p.y+=dy/d*p.sp*dt; continue; }
    if(!p.t || p.t.dead){ p.done = true; continue; }
    const dx = p.t.x-p.x, dy = (p.t.y-10)-p.y, d = Math.hypot(dx,dy);
    if(d < 10){ p.done = true; p.onHit(); burst(p.x, p.y, p.color, p.kind==="arrow"?4:9); continue; }
    p.x += dx/d*p.sp*dt; p.y += dy/d*p.sp*dt; p.ang = Math.atan2(dy,dx);
    if(p.kind!=="arrow" && Math.random()<0.6) parts.push({x:p.x, y:p.y, vx:rand(-20,20), vy:rand(-20,20), life:0.35, max:0.35, color:p.color, size:3});
  }
  projs = projs.filter(p=>!p.done);
  // ground effects
  for(const z of zones){ z.left -= dt; z.tick -= dt;
    if(z.tick <= 0){ z.tick += 1; aoe(z.x, z.y, z.r, m=>{ hit(m, z.dmg, z.school, z.ab); if(z.slows) slow(m, 0.5, 2); }); }
    for(let i=0;i<2;i++){ const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*z.r; parts.push({x:z.x+Math.cos(a)*r, y:z.y+Math.sin(a)*r-30, vx:-30, vy:120, life:0.3, max:0.3, color:SCHOOL_COLOR[z.school], size:2}); } }
  zones = zones.filter(z=>z.left>0);
  for(const p of parts){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  parts = parts.filter(p=>p.life>0);
  for(const f of floats) f.t += dt;
  floats = floats.filter(f=>f.t<1.2);
  // zone banner
  const z = zoneAtTile(Math.floor(P.x/TILE), Math.floor(P.y/TILE));
  if(z !== curZone){ curZone = z; showBanner(ZONES[z].name, ZONES[z].lv, 2.5); }
  // safe camps: monsters give up at the gates
  for(const m of mobs) if(m.state==="chase" && (townDist(m.x/TILE,m.y/TILE)<9 || campDist(m.x/TILE,m.y/TILE)<6)) evade(m);
}

function updPlayer(dt){
  P.hurt = Math.max(0, (P.hurt||0)-dt); P.swing = Math.max(0, (P.swing||0)-dt);
  if(P.dead) return;
  P.gcd = Math.max(0, P.gcd-dt); P.potCd = Math.max(0, P.potCd-dt);
  for(const k in P.cds){ P.cds[k] -= dt; if(P.cds[k] <= 0) delete P.cds[k]; }
  for(const k in P.buffs){ P.buffs[k] -= dt; if(P.buffs[k] <= 0) delete P.buffs[k]; }
  if(P.shield>0){ P.shieldT -= dt; if(P.shieldT<=0) P.shield = 0; }
  let ix = 0, iy = 0;
  if(keys.has("a")||keys.has("arrowleft")) ix -= 1; if(keys.has("d")||keys.has("arrowright")) ix += 1;
  if(keys.has("w")||keys.has("arrowup")) iy -= 1; if(keys.has("s")||keys.has("arrowdown")) iy += 1;
  if(panelKind && panelKind!=="help") { /* movement still allowed */ }
  ix += joy.x; iy += joy.y;
  const il = Math.hypot(ix, iy); if(il > 1){ ix /= il; iy /= il; }
  P.moving = false;
  if(P.dash){
    const t = P.dash.t; P.dash.el = (P.dash.el||0) + dt;
    if(!t || t.dead || P.dash.el > 0.6){ P.dash = null; }
    else { const d = dist(P,t), dx = (t.x-P.x)/d, dy = (t.y-P.y)/d; moveEnt(P, dx*P.dash.speed*dt, dy*P.dash.speed*dt); P.fx = dx<0?-1:1; P.moving = true;
      if(Math.random()<0.8) parts.push({x:P.x, y:P.y-10, vx:0, vy:0, life:0.3, max:0.3, color:"#d9c49a", size:4});
      if(d < t.r + P.r + 14){ stun(t, 1); P.dash = null; } }
  } else if(P.leap){ moveEnt(P, P.leap.vx*dt, P.leap.vy*dt); P.leap.t -= dt; P.moving = true; if(P.leap.t <= 0) P.leap = null; }
  else if(il > 0.05){
    if(P.casting) cancelCast(P.casting.kind==="spell" ? "Avbrutet – du rörde dig" : null);
    const sp = 150 * (P.form==="cat"?1.3:1) * (P.buffs.dash?1.7:1);
    moveEnt(P, ix*sp*dt, iy*sp*dt); if(Math.abs(ix) > 0.1) P.fx = ix<0?-1:1; P.moving = true;
  }
  if(P.casting){ P.casting.el += dt; if(P.casting.kind==="gather" && !P.casting.node.active) P.casting = null; else if(P.casting.el >= P.casting.total) completeCast(); }
  autoAttack(dt);
  P.combatT -= dt; const inC = P.combatT > 0;
  P.mana = Math.min(P.maxMana, P.mana + P.maxMana*(inC?0.012:0.05)*dt);
  P.focus = Math.min(100, P.focus + (inC?7:15)*dt);
  P.energy = Math.min(100, P.energy + 12*dt);
  if(!inC) P.rage = Math.max(0, P.rage - 3*dt);
  if(!inC && P.combatT < -1) P.hp = Math.min(P.maxHp, P.hp + P.maxHp*0.04*dt);
  for(const h of P.hots){ h.tick -= dt; if(h.tick <= 0){ h.tick += 1; h.left -= 1; healP(h.per); } }
  P.hots = P.hots.filter(h=>h.left>0);
}

function updMob(m, dt){
  if(m.dead){ m.respawn -= dt; if(m.respawn <= 0) respawnMob(m); return; }
  m.flash = Math.max(0, m.flash-dt); m.swing = Math.max(0, m.swing-dt);
  for(const d of m.dots){ d.tick -= dt; if(d.tick <= 0){ d.tick += 1; d.left -= 1; damageMob(m, Math.max(1, Math.round(d.per)), false, d.school); if(m.dead) return; } }
  m.dots = m.dots.filter(d=>d.left>0);
  m.slowT = Math.max(0, m.slowT-dt); m.rootT = Math.max(0, m.rootT-dt); m.stunT = Math.max(0, m.stunT-dt);
  const dp = P.dead ? 1e9 : dist(m, P);
  const spd = m.sp * (m.slowT>0 ? 1-m.slowPct : 1);
  if(m.state === "idle"){
    m.hp = Math.min(m.maxHp, m.hp + m.maxHp*0.1*dt);
    if(dp < aggroRange(m)){ aggro(m); social(m); return; }
    m.wanderT -= dt;
    if(m.wanderT <= 0){ m.wanderT = rand(3,7); if(!m.def.boss && m.type!=="leader"){ m.wx = m.hx + rand(-60,60); m.wy = m.hy + rand(-60,60); } }
    if(m.wx !== null){ const dx = m.wx-m.x, dy = m.wy-m.y, d = Math.hypot(dx,dy); if(d < 4) m.wx = null; else { moveEnt(m, dx/d*spd*0.35*dt, dy/d*spd*0.35*dt); m.fx = dx<0?-1:1; m.walk = true; } } else m.walk = false;
  } else if(m.state === "chase"){
    if(P.dead){ evade(m); return; }
    if(m.lx === undefined) anchor(m);
    if(Math.hypot(m.x-m.lx, m.y-m.ly) > 600 || (time - m.lastHit > 12 && dp > 380)){ evade(m); log(`${m.name} ger upp och återvänder.`, "#93a4ad"); return; }
    P.combatT = Math.max(P.combatT, 2);
    if(m.stunT > 0) return;
    if(m.tele){ m.tele.t -= dt;
      if(m.tele.t <= 0){ const sp = m.def.special; if(Math.hypot(P.x-m.tele.x, P.y-m.tele.y) < m.tele.r + P.r) playerDamage(m.dmg*sp.mult, m); ring(m.tele.x, m.tele.y, m.tele.r, "#ff5a40"); burst(m.tele.x, m.tele.y, "#ff8a5a", 24); m.tele = null; }
      return; }
    if(m.def.special){ m.specT -= dt; if(m.specT <= 0 && dp < 240){ const sp = m.def.special; m.specT = sp.every; m.tele = {x:m.x, y:m.y, r:sp.r, t:sp.windup, max:sp.windup}; floatText(m.x, m.y-m.r-30, sp.name+"!", "#ff8a5a", true); log(`${m.name} förbereder ${sp.name} – spring ut ur cirkeln!`, "#ff8a5a"); return; } }
    const reach = m.def.ranged || (m.r + P.r + 8);
    m.walk = false;
    if(dp > reach-4 && m.rootT <= 0) steer(m, P.x, P.y, dt, spd);
    else m.fx = P.x<m.x?-1:1;
    m.atkT -= dt;
    if(dp <= reach + 6 && m.atkT <= 0){ m.atkT = m.atkSpd; m.swing = 0.2;
      if(m.def.ranged) projs.push({toPlayer:true, x:m.x, y:m.y-16, dmg:m.dmg, src:m, color:"#cfe9ff", size:5, sp:300});
      else playerDamage(m.dmg, m, "melee"); }
  } else if(m.state === "return"){
    const dx = m.hx-m.x, dy = m.hy-m.y, d = Math.hypot(dx,dy);
    m.hp = Math.min(m.maxHp, m.hp + m.maxHp*0.5*dt);
    if(d < 8){ m.state = "idle"; m.evading = false; m.hp = m.maxHp; }
    else { const s = m.sp*1.4*dt; m.x += dx/d*s; m.y += dy/d*s; m.fx = dx<0?-1:1; m.walk = true; }
  }
}

// ---- effects
function floatText(x, y, txt, color, big){ floats.push({x, y, txt, color, t:0, big}); }
function burst(x, y, color, n){ for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = rand(30,140); parts.push({x, y:y-10, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.3,0.6), max:0.6, color, size:rand(2,4)}); } }
function ring(x, y, r, color){ for(let i=0;i<36;i++){ const a = i/36*Math.PI*2; parts.push({x:x+Math.cos(a)*r*0.3, y:y+Math.sin(a)*r*0.3, vx:Math.cos(a)*r*1.6, vy:Math.sin(a)*r*1.6, life:0.42, max:0.42, color, size:3}); } }
function slash(t){ if(!t) return; for(let i=0;i<8;i++){ const a = -0.8 + i*0.2; parts.push({x:t.x+Math.cos(a)*14, y:t.y-12+Math.sin(a)*14, vx:Math.cos(a+1.5)*60, vy:Math.sin(a+1.5)*60, life:0.22, max:0.22, color:"#ffffff", size:3}); } P.swing = 0.2; }

  else if(o.cls){ c.fillStyle = o.cls==="priest" ? "#d8b65a" : "#6b4a2b"; c.fillRect(-1,-18,3,30); c.fillStyle = o.cls==="mage" ? "#8fd8ff" : o.cls==="priest" ? "#fff2b0" : "#7fdc5a"; c.beginPath(); c.arc(0.5,-19,3.5,0,7); c.fill(); }

}
function drawBeast(c, x, y, form, fx){
  const walk = P.moving ? Math.sin(time*12) : 0;
  c.save(); c.translate(x, y); c.scale(fx<0?-1:1, 1);

  for(const n of npcs){ const d = dist(P,n); if(d < 58 && d < bd){ bd = d; best = {type:"npc", obj:n}; } }
  if(best) return best;
  for(const n of nodes){ if(!n.active) continue; const d = dist(P,n); if(d < 42 && d < bd){ bd = d; best = {type:"node", obj:n}; } }
  return best;
}
function interact(){ if(P.dead) return; const it = nearestInteract(); if(!it) return; if(it.type==="npc") openPanel("npc", it.obj.id); else if(!P.casting) startGather(it.obj); }
</script>
<script>
// ======================= UI =======================
const $ = id => document.getElementById(id);
function setT(el, v){ if(el._v !== v){ el._v = v; el.textContent = v; } }
function setW(el, f){ const v = (clamp(f,0,1)*100).toFixed(1)+"%"; if(el._w !== v){ el._w = v; el.style.width = v; } }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let lastErr = 0;
function log(txt, color){ const d = document.createElement("div"); d.textContent = txt; if(color) d.style.color = color; const l = $("log"); l.appendChild(d); while(l.children.length > 7) l.firstChild.remove(); }
function err(txt){ if(performance.now() - lastErr < 600) return; lastErr = performance.now(); floatText(P.x, P.y-64, txt, "#ff8a7a"); }
let bannerT = 0;
function showBanner(big, small, dur){ $("banner").innerHTML = `<div class="big">${esc(big)}</div><div class="small">${esc(small||"")}</div>`; bannerT = dur||3; $("banner").style.opacity = 1; }

// ---- icons
function drawIcon(cv, icon, color){
  const g = cv.getContext("2d"), s = cv.width; g.clearRect(0,0,s,s);
  const bg = g.createRadialGradient(s*0.35,s*0.3,2,s/2,s/2,s*0.75); bg.addColorStop(0, color); bg.addColorStop(1, "#0d1216"); g.fillStyle = bg; g.fillRect(0,0,s,s);
  g.save(); g.translate(s/2, s/2); g.scale(s/48, s/48);
  g.strokeStyle = "#fff"; g.fillStyle = "rgba(255,255,255,.92)"; g.lineWidth = 3; g.lineCap = "round"; g.lineJoin = "round";
  const P_ = (pts, fill) => { g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); if(fill){ g.closePath(); g.fill(); } else g.stroke(); };
  const C = (x,y,r,fill) => { g.beginPath(); g.arc(x,y,r,0,7); fill?g.fill():g.stroke(); };
  switch(icon){
    case "orb": C(4,-3,9,true); P_([[-4,3],[-16,14]]); P_([[0,7],[-10,16]]); break;
    case "shard": P_([[0,-16],[8,0],[0,16],[-8,0]], true); break;
    case "burst": for(let i=0;i<8;i++){ const a=i*Math.PI/4; P_([[Math.cos(a)*5,Math.sin(a)*5],[Math.cos(a)*15,Math.sin(a)*15]]); } break;
    case "nova": C(0,0,5,true); C(0,0,11); C(0,0,17); break;
    case "storm": C(-5,-6,7,true); C(5,-7,8,true); for(let i=-1;i<=1;i++) P_([[i*7,6],[i*7-4,16]]); break;
    case "meteor": C(5,5,10,true); P_([[-3,-3],[-16,-16]]); P_([[2,-6],[-8,-17]]); P_([[-6,2],[-17,-8]]); break;
    case "sword": P_([[-12,12],[12,-12]]); P_([[-14,6],[-6,14]]); break;
    case "axe": P_([[-12,14],[8,-10]]); g.beginPath(); g.arc(8,-10,9,-2.4,0.8); g.fill(); break;
    case "dash": P_([[-14,-10],[-2,0],[-14,10]]); P_([[0,-10],[12,0],[0,10]]); break;
    case "horn": g.beginPath(); g.moveTo(-14,8); g.quadraticCurveTo(0,-14,14,-6); g.lineTo(12,4); g.quadraticCurveTo(0,-4,-10,12); g.closePath(); g.fill(); break;
    case "claw": for(let i=-1;i<=1;i++) P_([[i*8-6,-14],[i*8+6,14]]); break;
    case "whirl": g.beginPath(); for(let a=0;a<12;a+=0.2){ const r=2+a*1.3; const x=Math.cos(a)*r, y=Math.sin(a)*r; a?g.lineTo(x,y):g.moveTo(x,y);} g.stroke(); break;
    case "arrow": case "firearrow": case "icearrow": P_([[-14,14],[12,-12]]); P_([[12,-12],[2,-12],[12,-12],[12,-2]]); P_([[-14,14],[-14,7]]); P_([[-14,14],[-7,14]]); break;
    case "multi": for(let i=-1;i<=1;i++) P_([[-12+i*6,12+i*0],[8+i*6,-12]]); break;
    case "leap": g.beginPath(); g.moveTo(12,12); g.quadraticCurveTo(0,-20,-12,4); g.stroke(); P_([[-12,4],[-12,-6],[-12,4],[-3,6]]); break;
    case "aim": C(0,0,11); P_([[0,-17],[0,-6]]); P_([[0,6],[0,17]]); P_([[-17,0],[-6,0]]); P_([[6,0],[17,0]]); C(0,0,2.5,true); break;
    case "sun": C(0,0,7,true); for(let i=0;i<8;i++){ const a=i*Math.PI/4; P_([[Math.cos(a)*11,Math.sin(a)*11],[Math.cos(a)*16,Math.sin(a)*16]]); } break;
    case "cross": g.fillRect(-4,-15,8,30); g.fillRect(-15,-4,30,8); break;
    case "skull": C(0,-3,11,true); g.fillRect(-6,6,12,7); g.fillStyle = "#222"; C(-4,-3,3,true); C(4,-3,3,true); break;
    case "shield": P_([[-12,-13],[12,-13],[11,2],[0,15],[-11,2]], true); break;
    case "mind": C(0,0,13); g.beginPath(); g.ellipse(0,0,13,6,0,0,7); g.stroke(); C(0,0,4,true); break;
    case "leaf": g.beginPath(); g.moveTo(-13,13); g.quadraticCurveTo(-12,-12,13,-13); g.quadraticCurveTo(12,12,-13,13); g.fill(); g.strokeStyle = "#2c5a24"; g.lineWidth = 2; P_([[-11,11],[9,-9]]); break;
    case "moon": C(0,0,13,true); g.globalCompositeOperation = "destination-out"; C(7,-4,11,true); g.globalCompositeOperation = "source-over"; break;
    case "bloom": for(let i=0;i<5;i++){ const a=i*Math.PI*0.4; C(Math.cos(a)*8,Math.sin(a)*8,6,true); } g.fillStyle = "#f2e86b"; C(0,0,4,true); break;
    case "roots": for(let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(i*9,16); g.quadraticCurveTo(i*9+8,0,i*9-2,-15); g.stroke(); } break;
    case "star": { g.beginPath(); for(let i=0;i<10;i++){ const r=i%2?6:16, a=i*Math.PI/5-Math.PI/2; const x=Math.cos(a)*r, y=Math.sin(a)*r; i?g.lineTo(x,y):g.moveTo(x,y);} g.closePath(); g.fill(); } break;
    case "bear": C(0,5,10,true); C(-11,-7,4.5,true); C(-4,-12,4.5,true); C(4,-12,4.5,true); C(11,-7,4.5,true); break;
    case "cat": P_([[-13,-14],[-6,-4],[6,-4],[13,-14],[13,4],[0,14],[-13,4]], true); g.fillStyle = "#222"; C(-5,1,2,true); C(5,1,2,true); break;
    case "fist": g.beginPath(); g.roundRect(-11,-10,22,20,5); g.fill(); g.strokeStyle = "#555"; g.lineWidth = 1.5; for(let i=-1;i<=1;i++) P_([[i*6,-10],[i*6,-2]]); break;
    case "fang": P_([[-14,-10],[14,-10],[8,-10],[4,10],[0,-10],[-4,10],[-8,-10]], true); break;
    case "flask": g.fillRect(-3,-15,6,8); g.beginPath(); g.moveTo(-3,-7); g.lineTo(-12,10); g.quadraticCurveTo(0,17,12,10); g.lineTo(3,-7); g.closePath(); g.fill(); break;
    default: g.font = "800 20px sans-serif"; g.textAlign = "center"; g.fillText("?",0,7);
  }
  g.restore();
}

// ---- hotbar
let slotEls = [];
function currentBar(){ return (S.cls==="druid" ? (P.form ? BARS["druid_"+P.form] : BARS.druid) : BARS[S.cls]).filter(id=>S.learned.includes(id)); }
function buildHotbar(){
  const hb = $("hotbar"); hb.innerHTML = ""; slotEls = [];
  currentBar().forEach((id, i)=>{
    const b = document.createElement("button"); b.className = "slot"; b.dataset.i = i;
    if(!id){ b.style.visibility = "hidden"; hb.appendChild(b); slotEls.push(null); return; }
    const a = AB[id]; const c = document.createElement("canvas"); c.width = c.height = 96; drawIcon(c, a.icon, id==="firearrow"?"#ff7a2e":id==="icearrow"?"#6fc6f0":SCHOOL_COLOR[a.school]==="#f2f2f2"?"#8c939a":SCHOOL_COLOR[a.school]);
    b.appendChild(c); b.insertAdjacentHTML("beforeend", `<span class="k">${i<9?i+1:0}</span><span class="cd"></span>`);
    b.title = `${a.name} – ${a.desc()}`; b.setAttribute("aria-label", a.name);
    b.addEventListener("click", ()=>tryUse(id)); hb.appendChild(b); slotEls.push({b, id, cd:b.querySelector(".cd")});
  });
  const pots = [["hp","Q","potHp","#c03a52"]]; if(CLASSES[S.cls].res==="mana") pots.push(["mana","R","potMana","#3f86e0"]);
  pots.forEach(([kind, key, item, col])=>{ const b = document.createElement("button"); b.className = "slot pot"; const c = document.createElement("canvas"); c.width = c.height = 96; drawIcon(c, "flask", col); b.appendChild(c);
    b.insertAdjacentHTML("beforeend", `<span class="k">${key}</span><span class="cd"></span><span class="cnt"></span>`); b.title = kind==="hp" ? "Läkedryck (Q)" : "Manadryck (R)";
    b.addEventListener("click", ()=>usePotion(kind)); hb.appendChild(b); slotEls.push({b, pot:kind, cd:b.querySelector(".cd"), cnt:b.querySelector(".cnt")}); });
}
function updHotbar(){
  const type = resType();
  for(const s of slotEls){ if(!s) continue;
    if(s.pot){ const n = s.pot==="hp" ? (S.bag.potHp||0)+(S.bag.potHp2||0)+(S.bag.potHp3||0) : (S.bag.potMana||0)+(S.bag.potMana2||0); setT(s.cnt, String(n)); setT(s.cd, P.potCd>0 ? Math.ceil(P.potCd)+"" : ""); s.b.classList.toggle("oom", n===0); continue; }
    const a = AB[s.id], locked = S.level < a.lvl, cd = P.cds[s.id]||0;
    s.b.classList.toggle("locked", locked);
    s.b.classList.toggle("oom", !locked && P[type] < costOf(s.id));
    let oor = false; if(a.tgt==="enemy" && P.target && !P.target.dead){ const d = dist(P,P.target)-P.target.r; oor = d > a.range || (a.minRange && d < a.minRange); }
    s.b.classList.toggle("oor", !!oor);
    s.b.classList.toggle("active", (s.id==="bear"&&P.form==="bear")||(s.id==="cat"&&P.form==="cat"));
    setT(s.cd, cd>0 ? (cd>=10?Math.ceil(cd):cd.toFixed(1)) : (!a.offGcd && P.gcd>0 ? "·" : ""));
  }
}

// ---- HUD
function updHUD(dt){
  setT($("pname"), S.name); setT($("plvl"), "Nivå "+S.level);
  setT($("pdesc"), `${RACES[S.race].name} ${CLASSES[S.cls].name}${P.form==="bear"?" · Björnform":P.form==="cat"?" · Kattform":""}`);

  const type = resType(), mr = maxRes(type); const ri = $("presi"); if(ri._c !== type){ ri._c = type; ri.style.background = RES_COLOR[type]; }
  setW(ri, P[type]/mr); setT($("prest"), `${RES_NAME[type]} ${Math.floor(P[type])} / ${mr}${P.form==="cat"&&P.cp?` · Kombo ${P.cp}`:""}`);
  const bl = []; if(P.buffs.shout) bl.push("Stridsrop"); if(P.buffs.elixir) bl.push("Elixir"); if(P.buffs.dash) bl.push("Rusning"); if(P.buffs.hotstreak) bl.push("Het svit"); if(P.hots.length) bl.push("Helas"); if(P.shield>0) bl.push("Sköld");
  setT($("pbuffs"), bl.join(" · "));

  if(t && !t.dead){ tf.hidden = false; setT($("tname"), t.name); const tl = $("tlvl"); setT(tl, (t.elite?"Elit ":"")+"Nivå "+t.lvl); tl.className = "num "+lvlClass(t.lvl);
    setW($("thpi"), t.hp/t.maxHp); setT($("thpt"), `${Math.max(0,Math.ceil(t.hp))} / ${t.maxHp}`);
    const st = []; if(t.evading) st.push("Undviker"); if(t.stunT>0) st.push("Bedövad"); if(t.rootT>0) st.push("Fastfrusen"); if(t.slowT>0) st.push("Nedsaktad"); if(t.dots.length) st.push(t.dots.length+" effekt"+(t.dots.length>1?"er":""));
    setT($("tdesc"), st.join(" · ") || (t.state==="chase"?"I strid":"Lugn")); }
  else tf.hidden = true;
  setT($("zone"), ZONES[curZone]?.name || ""); setT($("gold"), `${S.gold} guld`);
  const need = xpNeed(S.level); setW($("xpi"), S.level>=MAX_LVL ? 1 : S.xp/need); setT($("xpt"), S.level>=MAX_LVL ? "Maxnivå" : `${S.xp} / ${need} XP`);

  updHotbar();
}
function refreshTracker(){

// ---- panels
let panelKind = null, panelArg = null;
function openPanel(kind, arg){ if(panelKind===kind && arg===panelArg && kind!=="npc"){ closePanel(); return; } panelKind = kind; panelArg = arg; renderPanel(); $("panel").hidden = false; }
function closePanel(){ panelKind = null; $("panel").hidden = true; }

  } else if(panelKind==="help"){
    h += `<h2>Så spelar du</h2><div class="list">
      <div class="item"><div><b>Gå</b><div class="d">W A S D eller piltangenterna. På mobil: styrspaken nere till vänster.</div></div></div>
      <div class="item"><div><b>Välj mål</b><div class="d">Klicka eller tryck på en fiende, eller tryck Tab för närmaste. Färgen på nivån visar hur svår den är: grön lätt, gul jämn, röd farlig.</div></div></div>

      <div class="item"><div><b>Erfarenhet</b><div class="d">Du går upp i nivå genom att döda monster, klara uppdrag och samla malm och örter. Max är nivå 30. Monster som är 5 nivåer under dig ger ingen XP, och monster över din nivå är svårare att träffa och slår hårdare.</div></div></div>
      <div class="item"><div><b>Tränare</b><div class="d">Nya förmågor lär du dig hos din klass tränare i Frostvik. De kostar guld. En blå ! över tränaren betyder att det finns något nytt att lära.</div></div></div>
      <div class="item"><div><b>Talanger</b><div class="d">Från nivå 10 får du talangpoäng (tryck N) som gör dina förmågor eller din hjälte starkare.</div></div></div>
      <div class="item"><div><b>Elitfiender</b><div class="d">Bossar och elitfiender gör attacker med en röd cirkel. Spring ut ur cirkeln innan den fylls.</div></div></div>
      <div class="item"><div><b>Sparning</b><div class="d">Spelet sparas automatiskt${cloud?" i ditt konto och":""} i webbläsaren.</div></div></div>
      <div class="item"><div><b>Övrigt</b><div class="d">C karaktär, B väska, L uppdrag, Esc stänger fönster. Smeden förbättrar vapnet med malm, alkemisten gör drycker av örter.</div></div><button class="btn" data-act="newchar">Ny karaktär</button></div></div>`;
  } else if(panelKind==="npc"){
    const n = NPCS.find(x=>x.id===panelArg);
    h += `<h2>${n.name}</h2><div class="muted">&lt;${n.role}&gt;</div>`;
    const mine = QUESTS.filter(q=>q.npc===n.id);
    const ready = mine.filter(qReady), avail = mine.filter(qAvailable), active = mine.filter(q=>S.quests[q.id]?.state==="active"&&!qReady(q)), soon = mine.filter(qSoon);
    if(ready.length||avail.length||active.length||soon.length){ h += `<h3>Uppdrag</h3><div class="list">`;
      ready.forEach(q=>{ h += `<div class="item"><div><b style="color:var(--hp)">${esc(q.name)}</b><div class="d">Bra jobbat! Belöning: ${q.xp} XP, ${q.gold} guld${q.items?", "+Object.entries(q.items).map(([k,v])=>`${v} ${ITEMS[k].name}`).join(", "):""}.</div></div><button class="btn pri" data-act="turnin" data-id="${q.id}">Lämna in</button></div>`; });
      avail.forEach(q=>{ h += `<div class="item"><div><b style="color:var(--coin)">${esc(q.name)}</b> <span class="muted">· nivå ${q.lvl}</span><div class="d">${esc(q.text)}</div><div class="d">Belöning: ${q.xp} XP, ${q.gold} guld</div></div><button class="btn pri" data-act="accept" data-id="${q.id}">Acceptera</button></div>`; });
      active.forEach(q=>{ h += `<div class="item"><div><b>${esc(q.name)}</b><div class="d">${q.obj.map((o,i)=>`${esc(objName(o))}: ${qProg(q,i)}/${o[2]}`).join(" · ")}</div></div></div>`; });
      soon.forEach(q=>{ h += `<div class="item" style="opacity:.6"><div><b>${esc(q.name)}</b><div class="d">Kom tillbaka när du är nivå ${q.lvl}.</div></div></div>`; });
      h += `</div>`; }
    if(n.trains){
      if(n.trains !== S.cls){ h += `<p class="muted">Jag tränar bara ${CLASSES[n.trains].name}s. Leta upp din egen tränare här i Frostvik.</p>`; }
      else { const ready = allBarIds().filter(id=>AB[id].lvl<=S.level && !S.learned.includes(id)); const later = allBarIds().some(id=>AB[id].lvl>S.level && !S.learned.includes(id));
        h += `<h3>Lär dig</h3>`;
        h += ready.length ? `<div class="list">${ready.map(id=>{ const a = AB[id], c = trainCost(id); return `<div class="item"><div><b>${a.name}</b> <span class="coin">${c} guld</span><div class="d">${esc(a.desc())}</div></div><button class="btn pri" data-act="learn" data-id="${id}" ${S.gold<c?"disabled":""}>Lär dig</button></div>`; }).join("")}</div>` : `<p class="muted">Du kan allt jag kan lära dig just nu.</p>`;
        if(later) h += `<p class="muted">Kom tillbaka när du har blivit starkare.</p>`; }
    }
    if(n.shop){
      h += `<h3>Köp</h3><div class="list">${SHOP.map(([k,p])=>`<div class="item"><div><b>${ITEMS[k].name}</b> <span class="coin">${p} guld</span><div class="d">${ITEMS[k].desc}</div></div><button class="btn" data-act="buy" data-k="${k}" data-p="${p}" ${S.gold<p?"disabled":""}>Köp</button></div>`).join("")}</div>`;
      const sell = Object.keys(S.bag).filter(k=>S.bag[k]>0); const junk = sell.filter(k=>ITEMS[k].kind==="junk").reduce((a,k)=>a+ITEMS[k].sell*S.bag[k],0);
      h += `<h3>Sälj</h3><div class="row" style="margin-bottom:8px"><button class="btn" data-act="selljunk" ${junk?"":"disabled"}>Sälj allt skräp (${junk} guld)</button></div><div class="list">${sell.map(k=>`<div class="item"><div><b>${ITEMS[k].name}</b> <span class="muted">× ${S.bag[k]}</span></div><button class="btn" data-act="sell" data-k="${k}">Sälj 1 (${ITEMS[k].sell} guld)</button></div>`).join("") || `<div class="muted">Inget att sälja.</div>`}</div>`;
    }
    if(n.id==="bror"){ const c = smithCost(S.weapon);
      h += `<h3>Smedja</h3><div class="item"><div><b>${WEAPON_NAMES[S.cls]} +${S.weapon}</b><div class="d">${c ? `Förbättra till +${S.weapon+1} (mer skada): ${c.n} ${ITEMS[c.ore].name} och ${c.gold} guld. Du har ${S.bag[c.ore]||0} ${ITEMS[c.ore].name.toLowerCase()}.` : "Ditt vapen är fullt förbättrat."}</div></div>${c?`<button class="btn pri" data-act="upgrade" ${((S.bag[c.ore]||0)>=c.n && S.gold>=c.gold)?"":"disabled"}>Förbättra</button>`:""}</div>`; }
    if(n.id==="linnea"){
      h += `<h3>Alkemi</h3><div class="list">${RECIPES.map((r,i)=>{ const ok = Object.entries(r.need).every(([k,v])=>(S.bag[k]||0)>=v); return `<div class="item"><div><b>${ITEMS[r.out].name}</b><div class="d">${Object.entries(r.need).map(([k,v])=>`${v} ${ITEMS[k].name} (har ${S.bag[k]||0})`).join(" + ")} · ${ITEMS[r.out].desc}</div></div><button class="btn" data-act="craft" data-i="${i}" ${ok?"":"disabled"}>Brygg</button></div>`; }).join("")}</div>`; }
    if(n.id==="edda" && !avail.length && !ready.length && !active.length && !soon.length) h += `<p class="muted">Tack för allt du gjort för Frostvik, ${esc(S.name)}. ${S.level>=20?"Väktaren Runa i lägret Askvakten långt österut behöver din hjälp nu.":"Bli starkare, så har jag mer att be dig om."}</p>`;
    if(n.id==="runa" && !avail.length && !ready.length && !active.length && !soon.length) h += `<p class="muted">${S.quests.q25?.state==="done"?`Isjätten är besegrad. Hela landet sjunger om ${esc(S.name)}.`:"Kom tillbaka när du har blivit starkare."}</p>`;
  } else if(panelKind==="confirmnew"){
    h += `<h2>Ny karaktär?</h2><p class="muted">${esc(S.name)} (nivå ${S.level}) ersätts av en ny hjälte. Det går inte att ångra.</p><div class="row"><button class="btn" data-act="close">Avbryt</button><button class="btn pri" data-act="reallynew">Skapa ny karaktär</button></div>`;
  }
  el.innerHTML = h;
}
$("panel").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return; const a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;
  if(a==="close") return closePanel();
  if(a==="accept") acceptQuest(id);
  if(a==="turnin") turnIn(id);
  if(a==="learn"){ const c = trainCost(id); if(S.gold>=c && !S.learned.includes(id)){ S.gold -= c; S.learned.push(id); log(`Du lärde dig ${AB[id].name}.`, "#9fd6e8"); burst(P.x,P.y,"#9fd6e8",16); buildHotbar(); save(true); } }
  if(a==="abandon"){ delete S.quests[id]; refreshTracker(); }
  if(a==="use") useItem(k);
  if(a==="buy"){ const p = +b.dataset.p; if(S.gold>=p){ S.gold -= p; addItem(k,1); } }
  if(a==="sell"){ S.gold += ITEMS[k].sell; removeItem(k,1); refreshTracker(); }
  if(a==="selljunk"){ for(const kk of Object.keys(S.bag)) if(ITEMS[kk].kind==="junk"){ S.gold += ITEMS[kk].sell*S.bag[kk]; delete S.bag[kk]; } }
  if(a==="upgrade"){ const c = smithCost(S.weapon); if(c && (S.bag[c.ore]||0)>=c.n && S.gold>=c.gold){ removeItem(c.ore, c.n); S.gold -= c.gold; S.weapon++; log(`Ditt vapen är nu +${S.weapon}.`, "#e6bd5c"); burst(P.x,P.y,"#ffd36b",16); save(true); } }
  if(a==="craft"){ const r = RECIPES[+b.dataset.i]; for(const [kk,v] of Object.entries(r.need)) removeItem(kk, v); addItem(r.out, r.n); log(`Du bryggde ${ITEMS[r.out].name}.`, "#9cf07a"); refreshTracker(); }
  if(a==="tal"){ const t = TALENTS[S.cls].find(x=>x.id===id); S.talents[id] = (S.talents[id]||0)+1; recompute(false); buildHotbar(); log(`Talang: ${t.name} ${S.talents[id]}/${t.max}`, "#e6bd5c"); save(); }
  if(a==="respec"){ S.talents = {}; recompute(false); buildHotbar(); }
  if(a==="newchar"){ panelKind = "confirmnew"; }
  if(a==="reallynew"){ closePanel(); running = false; S = null; try{ localStorage.removeItem(LS_KEY); }catch(_){} localSave = null; showCreate(); return; }
  renderPanel();
});

// ======================= CREATION =======================
let pick = {race:"human", cls:"mage"}, localSave = null;
function showCreate(){
  $("create").hidden = false; renderPicks(); renderCont();
}
function renderCont(){
  const s = localSave, box = $("contbox");
  box.innerHTML = s ? `<button class="btn pri" id="cont" style="font-size:17px;padding:10px 22px">Fortsätt som ${esc(s.name)} · nivå ${s.level} ${RACES[s.race].name} ${CLASSES[s.cls].name}</button>` : "";
  if(s) $("cont").onclick = ()=>startGame(s);
  $("start").textContent = s ? "Skapa ny karaktär" : "Börja äventyret";
}
function renderPicks(){
  $("races").innerHTML = Object.entries(RACES).map(([k,r])=>`<button class="pick ${pick.race===k?"sel":""}" data-race="${k}"><b><i class="sw" style="background:${r.skin}"></i>${r.name}</b><span>${r.desc}</span></button>`).join("");
  $("classes").innerHTML = Object.entries(CLASSES).map(([k,c])=>`<button class="pick ${pick.cls===k?"sel":""}" data-cls="${k}"><b><i class="sw" style="background:${c.color}"></i>${c.name}</b></button>`).join("");
  const pv = $("preview").getContext("2d"); pv.setTransform(1,0,0,1,0,0); pv.clearRect(0,0,120,120); pv.setTransform(2.2,0,0,2.2,0,0);
  drawHero(pv, 27, 48, {race:pick.race, cls:pick.cls, skin:RACES[pick.race].skin, hair:RACES[pick.race].hair, body:CLASSES[pick.cls].color, fx:1});
}
$("races").addEventListener("click", e=>{ const b = e.target.closest("[data-race]"); if(b){ pick.race = b.dataset.race; renderPicks(); } });
$("classes").addEventListener("click", e=>{ const b = e.target.closest("[data-cls]"); if(b){ pick.cls = b.dataset.cls; renderPicks(); } });
let confirmNew = false;
$("start").addEventListener("click", ()=>{
  const name = ($("cname").value||"").trim().slice(0,16) || "Hjälte";
  if(localSave && !confirmNew){ confirmNew = true; $("start").textContent = `Klicka igen för att ersätta ${localSave.name}`; return; }
  confirmNew = false; startGame(newSave(name, pick.race, pick.cls), true);
});

function startGame(sv, fresh){
  S = Object.assign(newSave(sv.name, sv.race, sv.cls), sv);
  S.skills = Object.assign({mining:1, herb:1}, sv.skills||{});
  if(!Array.isArray(sv.learned)) S.learned = allBarIds().filter(id=>AB[id].lvl<=S.level && AB[id].lvl<=16);
  S.learned = S.learned.filter(id=>AB[id]);
  spawnAll();
  P = {x:TOWN.x*TILE+16, y:(TOWN.y+2)*TILE+16, r:11, hp:1, maxHp:0, mana:0, maxMana:0, rage:0, focus:100, energy:100, cp:0, form:null, target:null, casting:null,
    gcd:0, cds:{}, buffs:{}, hots:[], shield:0, shieldT:0, autoT:0, combatT:0, potCd:0, fx:1, moving:false, dash:null, leap:null, dead:false};
  if(S.x && S.y && !collides(S.x, S.y, 10)){ P.x = S.x; P.y = S.y; }
  recompute(true);
  $("create").hidden = true; $("dead").hidden = true; closePanel();
  buildHotbar(); refreshTracker(); running = true; curZone = null;
  localSave = serialize();
  if(fresh){ log("Välkommen till Frostvik! Prata med Kapten Edda (gult !) för ditt första uppdrag.", "#e6bd5c"); log("Tryck H för hjälp med kontrollerna.", "#93a4ad"); save(true); }
}

// ======================= INPUT =======================
addEventListener("keydown", e=>{
  if(!running || e.target.tagName==="INPUT") return;
  const k = e.key.toLowerCase();
  if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){ keys.add(k); e.preventDefault(); return; }
  if(e.repeat) return;
  if(k.length===1 && k>="0" && k<="9"){ tryUse(currentBar()[k==="0"?9:+k-1]); return; }
  if(k==="tab"){ e.preventDefault(); cycleTarget(); return; }
  if(k==="e") return interact();
  if(k==="q") return usePotion("hp");
  if(k==="r") return usePotion("mana");
  const pm = {c:"char", b:"bag", n:"talents", l:"quests", h:"help"}; if(pm[k]) return openPanel(pm[k]);
  if(k==="escape"){ if(panelKind) closePanel(); else if(P.casting) cancelCast(); else setTarget(null); }
});
addEventListener("keyup", e=>keys.delete(e.key.toLowerCase()));
addEventListener("blur", ()=>keys.clear());
$("menu").addEventListener("click", e=>{ const b = e.target.closest("[data-p]"); if(b) openPanel(b.dataset.p); });
$("revive").addEventListener("click", revive);
cv.addEventListener("pointerdown", e=>{
  if(!running) return;
  const wx = e.clientX/ZOOM + cam.x, wy = e.clientY/ZOOM + cam.y;
  let best = null, bd = 34;
  for(const m of mobs){ if(m.dead) continue; const cy = m.y - m.r; const d = Math.hypot(m.x-wx, cy-wy); if(d < bd + m.r*0.5){ bd = d; best = m; } }
  if(best){ setTarget(best); return; }
  for(const n of npcs){ if(Math.hypot(n.x-wx, n.y-20-wy) < 26){ if(dist(P,n) < 90) openPanel("npc", n.id); else err("För långt bort"); return; } }
  for(const n of nodes){ if(n.active && Math.hypot(n.x-wx, n.y-wy) < 22){ if(dist(P,n) < 60) startGather(n); else err("För långt bort"); return; } }
});
// touch joystick
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
if(isTouch){ $("joy").hidden = false; $("interact").hidden = false; $("tabbtn").hidden = false; }
(function(){ const j = $("joy"), k = j.querySelector("i"); let id = null;
  const mv = e=>{ const r = j.getBoundingClientRect(); let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2); const l = Math.hypot(dx,dy), mx = 45; if(l > mx){ dx = dx/l*mx; dy = dy/l*mx; } joy.x = dx/mx; joy.y = dy/mx; k.style.transform = `translate(${dx}px,${dy}px)`; };
  j.addEventListener("pointerdown", e=>{ id = e.pointerId; j.setPointerCapture(id); mv(e); });
  j.addEventListener("pointermove", e=>{ if(e.pointerId===id) mv(e); });
  const end = e=>{ if(e.pointerId!==id) return; id = null; joy.x = joy.y = 0; k.style.transform = ""; };
  j.addEventListener("pointerup", end); j.addEventListener("pointercancel", end);
})();
$("interact").addEventListener("click", interact);
$("tabbtn").addEventListener("click", cycleTarget);

// ======================= SAVE =======================
const LS_KEY = "rimfrost-save-v1";
let cloud = null, cloudBusy = false, cloudDirty = false, lastCloud = 0, saveT = 0;
function serialize(){ return {v:2, name:S.name, race:S.race, cls:S.cls, level:S.level, xp:S.xp, gold:S.gold, weapon:S.weapon, bag:S.bag, skills:S.skills, talents:S.talents, quests:S.quests, learned:S.learned, x:P?Math.round(P.x):null, y:P?Math.round(P.y):null, t:Date.now()}; }
function save(important){
  if(!S || !running) return;
  const data = serialize(); localSave = data;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(_){}
  if(cloud && (important || Date.now()-lastCloud > 30000)) pushCloud();
}
function pushCloud(){
  if(!cloud) return; if(cloudBusy){ cloudDirty = true; return; }
  cloudBusy = true; lastCloud = Date.now();
  cloud.ref.set({json: JSON.stringify(serialize()), t: Date.now()}).catch(()=>{ cloud = null; }).finally(()=>{ cloudBusy = false; if(cloudDirty && cloud){ cloudDirty = false; pushCloud(); } });
}
async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/" + id + "/save");
    const snap = await ref.get();
    cloud = {ref};
    if(snap.exists){ const d = snap.data(); const s = d && d.json ? JSON.parse(d.json) : null;
      if(s && s.name && (!localSave || (s.t||0) > (localSave.t||0))){ localSave = s; if(!running) renderCont(); } }
  }catch(_){ cloud = null; }
}
addEventListener("visibilitychange", ()=>{ if(document.hidden) save(true); });
addEventListener("pagehide", ()=>save());

// ======================= LOOP / BOOT =======================
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000 || 0); last = ts;
  if(running){ update(dt); updHUD(dt); saveT += dt; if(saveT > 5){ saveT = 0; save(); } }
  render();
  requestAnimationFrame(loop);
}
function boot(data){
  resize(); genWorld(); makeTiles(); makeMinimap();
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) localSave = JSON.parse(raw); }catch(_){ localSave = null; }
  const hs = data && data.save;
  if(hs && hs.name) startGame(hs); else showCreate();
  initCloud();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({save: running && S ? serialize() : null}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
