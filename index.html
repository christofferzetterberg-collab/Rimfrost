  pet.hp -= amt; pet.flash = 0.12; P.combatT = Math.max(P.combatT, 4); if(pet.kind==="bear") pet.res = Math.min(100, pet.res+5); floatText(pet.x + rand(-8,8), pet.y - pet.r - 14, ""+amt, "#ff9a7a");
  if(pet.hp <= 0){ pet.hp = 0; pet.dead = true; log(`Your ${pet.name.toLowerCase()} has fallen. Call it again when the fight is over.`, "#ff8a7a"); for(const m of mobs) if(m.tgtId === "pet" || m.tgtId === coopMyId()+":pet") m.tgtId = null; } }
function petStrike(t, coef){ if(!t || t.dead) return; const amt = Math.max(1, Math.round(pow()*coef*genMult()*rand(0.92,1.08)*lvlPenalty(t)));
  PET_ATK = true; try{ damageMob(t, amt, false, "phys"); } finally{ PET_ATK = false; } }
function updPet(dt){
  if(!running || !P || !S) return;
  if(S.cls !== "hunter"){ pet = null; petBarUpd(); return; }
  if(pet && pet._S !== S) pet = null;
  if(!pet){ if(S.petType && PETS[S.petType] && !P.dead) pet = petMake(S.petType); if(!pet){ petBarUpd(); return; } }
  const d = PETS[pet.kind], dg = P.inDungeon||null;
  { const mh = Math.round(P.maxHp*d.hp); if(mh !== pet.maxHp){ pet.hp = Math.min(mh, pet.hp*mh/pet.maxHp); pet.maxHp = mh; } }
  pet.lvl = S.level; pet.flash = Math.max(0, pet.flash-dt); pet.swing = Math.max(0, pet.swing-dt); pet.atkT -= dt; pet.growl = Math.max(0, pet.growl-dt); pet.clawT = Math.max(0, pet.clawT-dt); pet.sweepT = Math.max(0, pet.sweepT-dt);
  if(pet.dg !== dg || dist(pet,P) > 900){ pet.dg = dg; pet.x = P.x - 26*(P.fx||1); pet.y = P.y + 10; pet.path = null; }
  if(pet.dead){ pet.cur = null; return; }
  petBarUpd();
  const fight = petFight();
  if(pet.hold && !fight) pet.hold = false;
  if(!fight) pet.hp = Math.min(pet.maxHp, pet.hp + pet.maxHp*0.08*dt);
  if(pet.kind==="wolf") pet.res = Math.min(100, pet.res + 12*dt); else if(!fight) pet.res = Math.max(0, pet.res - 5*dt);   // wolf: energy, bear: rage
  // who to fight: the target you sent it at; otherwise (only while you are in combat) what is attacking you
  if(pet.cmd && (pet.cmd.dead || pet.cmd.evading || (pet.cmd.def.dg||null)!==dg || dist(pet.cmd,P) > 900)) pet.cmd = null;
  let t = pet.cmd || null;
  if(!t && !pet.hold && P.combatT > 0){
    t = (P.target && !P.target.dead && !P.target.evading && P.target.state==="chase" && (P.target.def.dg||null)===dg && dist(P.target,P) < 600) ? P.target : null;
    if(!t){ let bd = 420; for(const m of mobs){ if(m.dead || m.evading || m.state!=="chase" || (m.def.dg||null)!==dg) continue; const dd = dist(m,P); if(dd < bd){ bd = dd; t = m; } } }
  }
  if(pet.kind==="bear" && pet.growl <= 0 && t && dist(pet,t) < pet.r + t.r + 40){   // Growl: free, only works on what the bear is fighting
    pet.growl = GROWL_CD;
    if(coopMob(t)){ if(COOP.role==="guest") coopOp("growl", t, []); else coopGrowlApply(t, coopMyId()); } else { t.tauntT = GROWL_TAUNT; t.thPet = Math.max(t.thPet||0, (t.thMe||0)*1.3 + 40); }
    floatText(pet.x, pet.y-pet.r-30, "Growl!", "#e6bd5c", true); ring(pet.x, pet.y, 40, "#e6bd5c"); pet.swing = 0.25; coopPetSend("growl"); }
  // Sweep (bear, 40 rage): hits every fighting enemy around the bear and builds aggro on all of them
  if(pet.kind==="bear" && pet.res >= 40 && pet.sweepT <= 0){
    const near = mobs.filter(m=>!m.dead && !m.evading && m.state==="chase" && (m.def.dg||null)===dg && dist(m,pet) < 90);
    if(near.length >= 2){ pet.res -= 40; pet.sweepT = 1.5; pet.swing = 0.25; ring(pet.x, pet.y, 50, "#d84a42"); floatText(pet.x, pet.y-pet.r-30, "Sweep", "#ff8a7a"); coopPetSend("sweep"); for(const m of near) petStrike(m, 0.5); } }
  pet.cur = t || null;   // what the pet is fighting right now (also drives the Recall button)
  pet.walk = false; pet.state = t ? "chase" : "follow";
  if(t){
    const reach = pet.r + t.r + 12;
    if(dist(pet,t) > reach){ steer(pet, t.x, t.y, dt, petSpd()*(pet.kind==="bear" ? 0.85 : 0.95)); pet.walk = true; }   // a little slower than you while fighting
    else { pet.fx = t.x < pet.x ? -1 : 1;
      if(pet.atkT <= 0){ pet.atkT = d.atk; pet.swing = 0.2;
        petStrike(t, d.coef); if(pet.kind==="bear") pet.res = Math.min(100, pet.res + 8); }
      // Claw (wolf, 40 energy): an extra hit on top of the normal attacks
      if(pet.kind==="wolf" && pet.res >= 40 && pet.clawT <= 0 && !t.dead){ pet.res -= 40; pet.clawT = 1.2; pet.swing = 0.25; floatText(pet.x, pet.y-pet.r-30, "Claw", "#e8c84a"); coopPetSend("claw"); petStrike(t, 0.55); } }
  } else if(dist(pet,P) > 70){ const dd = dist(pet,P); steer(pet, P.x - 24*(P.fx||1), P.y + 8, dt, petSpd()*(dd > 200 ? 1.4 : dd > 110 ? 1.15 : 1)); pet.walk = true; }   // out of combat: your speed, catching up when far behind
}
// ---- effects
function floatText(x, y, txt, color, big){ floats.push({x, y, txt, color, t:0, big}); }
function burst(x, y, color, n){ if(VFX_REC) VFX_REC.push(["b", Math.round(x), Math.round(y), color, n]); const el = fxEl(color); if(el) sfx("explo", el, x, y, 30+n*2.2, 0.55); for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = rand(30,140); parts.push({x, y:y-10, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.3,0.6), max:0.6, color, size:rand(2,4)}); } }
function ring(x, y, r, color){ if(VFX_REC) VFX_REC.push(["r", Math.round(x), Math.round(y), r, color]); const el = color!=="#ff5a40" && fxEl(color); if(el) sfx("ring", el, x, y, r*2.5, 0.75); for(let i=0;i<36;i++){ const a = i/36*Math.PI*2; parts.push({x:x+Math.cos(a)*r*0.3, y:y+Math.sin(a)*r*0.3, vx:Math.cos(a)*r*1.6, vy:Math.sin(a)*r*1.6, life:0.42, max:0.42, color, size:3}); } }
function slash(t){ if(!t) return; if(VFX_REC && t.nid != null) VFX_REC.push(["s", t.nid]); for(let i=0;i<8;i++){ const a = -0.8 + i*0.2; parts.push({x:t.x+Math.cos(a)*14, y:t.y-12+Math.sin(a)*14, vx:Math.cos(a+1.5)*60, vy:Math.sin(a+1.5)*60, life:0.22, max:0.22, color:"#ffffff", size:3}); } P.swing = 0.2; }
</script>
<script>
// ======================= GEAR / EQUIPMENT =======================
// quality 0..5: gray, white, green, blue, purple, orange
const QUAL = [
  {name:"Poor",       color:"#9d9d9d", mult:0.5},
  {name:"Common",      color:"#ffffff", mult:0.8},
  {name:"Uncommon",     color:"#1eff00", mult:1.0},
  {name:"Rare",    color:"#0070dd", mult:1.25},
  {name:"Epic",       color:"#a335ee", mult:1.55},
  {name:"Legendary", color:"#ff8000", mult:1.9}
];
const SLOTS = {
  head:{name:"Head", w:0.5}, shoulder:{name:"Shoulders", w:0.4}, chest:{name:"Chest", w:0.6}, hands:{name:"Hands", w:0.35},
  legs:{name:"Legs", w:0.55}, feet:{name:"Feet", w:0.35}, weapon:{name:"Weapon", w:1.0}, offhand:{name:"Off-hand", w:0.4},
  neck:{name:"Neck", w:0.3}, ring:{name:"Ring", w:0.3}
};
const SLOT_ORDER = ["head","neck","shoulder","chest","hands","legs","feet","ring","weapon","offhand"];
// armor types and which classes may use them
const ARMOR = {
  cloth:{name:"Cloth", cls:["mage","priest"], def:0.10},
  leather:{name:"Leather", cls:["hunter","druid"], def:0.20},
  plate:{name:"Plate", cls:["warrior","paladin"], def:0.30}
};
const CLASS_ARMOR = {mage:"cloth", priest:"cloth", hunter:"leather", druid:"leather", warrior:"plate", paladin:"plate"};
// weapon / offhand types
const WTYPES = {
  sword:{name:"Sword", cls:["warrior","paladin"], icon:"sword", base:["Longsword","Broadsword","Blade"]},
  axe:{name:"Axe", cls:["warrior"], icon:"axeDouble", base:["Battleaxe","Cleaver","Hatchet"]},
  mace:{name:"Mace", cls:["paladin"], icon:"hammer", base:["Warhammer","Cudgel","Maul"]},
  bow:{name:"Bow", cls:["hunter"], icon:"bow", base:["Longbow","Hunting Bow","War Bow"]},
  staff:{name:"Staff", cls:["mage","priest","druid"], icon:"upg_wand", base:["Staff","Walking Staff","Runestaff"]},
  wand:{name:"Wand", cls:["mage","priest"], icon:"wand", base:["Wand","Scepter"]},
  shield:{name:"Shield", cls:["warrior","paladin"], icon:"shield", base:["Shield","Buckler","Tower Shield"], off:true},
  tome:{name:"Tome", cls:["mage","priest","druid"], icon:"tome", base:["Tome","Spellbook","Grimoire"], off:true}
};
const CLASS_WEAP = {warrior:["sword","axe"], paladin:["sword","mace"], hunter:["bow"], mage:["staff","wand"], priest:["staff","wand"], druid:["staff"]};
const CLASS_OFF = {warrior:["shield"], paladin:["shield"], mage:["tome"], priest:["tome"], druid:["tome"], hunter:[]};
const ARMOR_BASE = {
  cloth:{head:"Hood", shoulder:"Mantle", chest:"Robe", hands:"Gloves", legs:"Trousers", feet:"Slippers"},
  leather:{head:"Leather Cap", shoulder:"Leather Spaulders", chest:"Leather Vest", hands:"Leather Gloves", legs:"Leather Pants", feet:"Leather Boots"},
  plate:{head:"Helm", shoulder:"Pauldrons", chest:"Breastplate", hands:"Gauntlets", legs:"Greaves", feet:"Sabatons"}
};
const JEWEL_BASE = {neck:["Necklace","Amulet","Pendant"], ring:["Ring","Signet","Band"]};
const SLOT_ICON = {head:"helmet", shoulder:"upg_helmet", chest:"armor", hands:"upg_armor", legs:"armor", feet:"upg_armor", neck:"gemBlue", ring:"gemRed"};
const STAT_NAME = {pow:"Attack Power", sp:"Spell Power", hp:"Health", mana:"Mana", crit:"Critical Strike", def:"Armor", str:"Strength", agi:"Agility", sta:"Stamina", int:"Intellect"};
const STAT_SUFFIX = {pow:"Power", sp:"Sorcery", hp:"Endurance", mana:"Wisdom", crit:"Precision", def:"Protection", str:"Might", agi:"Swiftness", sta:"Fortitude", int:"Brilliance"};
const PREFIX = [["Beggar's","Thrall's","Apprentice's"], [""], [""], ["Warden's","Master's","Knight's","Huntmaster's"], ["Stormcaller's","Nightfall","Runesmith's","Wolfking's"], ["Rimfrost","Ice Giant's","Draugr King's","Elder"]];
const GEAR_MAX = 30;

function mulberry(seed){ return ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h; }
const pickR = (arr, r) => arr[Math.floor(r()*arr.length)];

// which classes can use an item
function gearClasses(it){ if(it.arm) return ARMOR[it.arm].cls; if(it.wt) return WTYPES[it.wt].cls; return Object.keys(CLASSES); }
function canWear(it){ return gearClasses(it).includes(S.cls); }
function gearTypeName(it){ return it.arm ? ARMOR[it.arm].name : it.wt ? WTYPES[it.wt].name : "Jewelry"; }

// primary stat budget per quality (at item level 30 on a slot with weight 0.5; scales down with item level, up with slot weight) and the stats each class wants
const ITEM_BUDGET = [1.2, 2.4, 4.8, 8.5, 14, 22];
const PRIMARY_POOL = {warrior:["str","sta","agi"], paladin:["str","int","sta"], hunter:["agi","sta"], druid:["int","agi","sta","str"], mage:["int","sta"], priest:["int","sta"]};
// make one item. opts: {slot, cls, q, il, r}
function makeGear(opts){
  const r = opts.r || Math.random, q = opts.q, il = Math.max(1, Math.min(MAX_LVL, Math.round(opts.il)));
  const cls = opts.cls || pickR(Object.keys(CLASSES), r);
  let slot = opts.slot;
  if(!slot){ const pool = SLOT_ORDER.filter(s=>s!=="offhand" || CLASS_OFF[cls].length); slot = pickR(pool, r); }
  const it = {id:Math.random().toString(36).slice(2,10), slot, q, il, st:{}, v:2};   // v:2 = items with primary stats
  if(slot==="weapon") it.wt = pickR(CLASS_WEAP[cls], r);
  else if(slot==="offhand") it.wt = pickR(CLASS_OFF[cls].length ? CLASS_OFF[cls] : ["shield"], r);
  else if(slot!=="neck" && slot!=="ring") it.arm = CLASS_ARMOR[cls];
  // stat budget
  let pts = (4 + il*1.15) * QUAL[q].mult * SLOTS[slot].w * 2;
  const role = ["warrior","hunter"].includes(cls) ? "phys" : ["mage","priest"].includes(cls) ? "caster" : "hybrid";
  const add = (k, p) => { if(p <= 0) return; it.st[k] = (it.st[k]||0) + p; };
  let defShare = it.arm ? ARMOR[it.arm].def : it.wt==="shield" ? 0.4 : 0;
  add("def", pts*defShare); pts *= 1-defShare;
  if(slot==="weapon"){ if(role==="phys") add("pow", pts*0.75); else if(role==="caster") add("sp", pts*0.75); else { add("pow", pts*0.4); add("sp", pts*0.35); } pts *= 0.25; }
  else if(it.wt==="tome"){ add("sp", pts*0.5); pts *= 0.5; }
  // points -> real numbers
  const conv = {pow:0.17, sp:0.17, hp:2.4, mana:3, crit:0.07, def:0.1};
  for(const k of Object.keys(it.st)){ let v = it.st[k]*conv[k]; v = (k==="crit"||k==="def") ? Math.round(v*10)/10 : Math.round(v); if(v <= 0) delete it.st[k]; else it.st[k] = v; }
  // primary stats: a budget from quality, item level and slot, split over 1-3 stats that suit the class
  { let T = ITEM_BUDGET[q] * (0.3 + 0.7*il/MAX_LVL) * (0.5 + SLOTS[slot].w) * (0.9 + 0.2*r());
    T = Math.max(q <= 1 ? 1 : 2, Math.round(T));
    const pool = PRIMARY_POOL[cls], n = Math.min(pool.length, q <= 1 ? 1 : q === 2 ? 2 : 3);
    const main = r() < 0.6 ? pool[0] : pickR(pool, r), chosen = [main];
    while(chosen.length < n){ const k = pickR(pool, r); if(!chosen.includes(k)) chosen.push(k); }
    const wts = chosen.map((k,i)=> i===0 ? 2 : 1), tot = wts.reduce((a,b)=>a+b, 0);
    chosen.forEach((k,i)=>{ const v = Math.round(T*wts[i]/tot); if(v >= 1) it.st[k] = v; }); }
  it.n = gearName(it, r);
  return it;
}
// item name: [prefix] base [of Suffix], e.g. "Warden's Longsword of Power"
function gearName(it, r){
  const base = it.wt ? pickR(WTYPES[it.wt].base, r) : (it.slot==="neck"||it.slot==="ring") ? pickR(JEWEL_BASE[it.slot], r) : ARMOR_BASE[it.arm][it.slot];
  const pre = pickR(PREFIX[it.q], r);
  const w = k => k==="crit" ? 40 : (k==="pow"||k==="sp") ? 10 : (k==="str"||k==="agi"||k==="int") ? 12 : k==="sta" ? 8 : 1;
  const top = Object.keys(it.st).filter(k=>k!=="def").sort((a,b)=>it.st[b]*w(b) - it.st[a]*w(a))[0];
  return (pre ? pre+" " : "") + base + (it.q >= 2 && top ? " of " + STAT_SUFFIX[top] : "");
}
// items from before the primary-stat update are retired when a character loads
function retireOldGear(){ let n = 0;
  if(S.gear){ const keep = S.gear.filter(it=>it && it.v===2); n += S.gear.length - keep.length; S.gear = keep; }
  if(S.eq) for(const sl of Object.keys(S.eq)){ const it = S.eq[sl]; if(!it || it.v!==2){ delete S.eq[sl]; n++; } }
  if(n) setTimeout(()=>{ try{ log(`${n} old item${n>1?"s were":" was"} retired in the stat update.`, "#e6bd5c"); }catch(_){} }, 1500); }
function gearPrice(it){ return Math.max(2, Math.round(Math.pow(it.il, 1.5) * QUAL[it.q].mult * SLOTS[it.slot].w * 3 + 3)); }
function gearSell(it){ return Math.max(1, Math.round(gearPrice(it) / 5)); }
function gearIcon(it){ return it.wt ? WTYPES[it.wt].icon : SLOT_ICON[it.slot]; }

// total stats from what you wear
function gearStat(k){ if(!S || !S.eq) return 0; let v = 0; for(const it of Object.values(S.eq)) if(it && it.st[k]) v += it.st[k]; return v; }

// quality roll for drops
function rollQuality(src){
  const r = Math.random();
  const table = src==="boss" ? [[3,0.70],[4,0.26],[5,0.04]] : src==="elite" ? [[2,0.55],[3,0.35],[4,0.09],[5,0.01]]
    : [[0,0.45],[1,0.30],[2,0.20],[3,0.045],[4,0.0045],[5,0.0005]];
  let acc = 0; for(const [q,p] of table){ acc += p; if(r < acc) return q; } return table[table.length-1][0];
}
function gainGear(it, how){
  if(!S.gear) S.gear = [];
  if(S.gear.length >= GEAR_MAX){ log(`Your bag is full – ${it.n} was lost. Sell something to a merchant.`, "#ff6b5e"); return false; }
  S.gear.push(it); if(how!=="You bought" && how!=="You forged") snd(it.q >= 3 ? "rare" : "loot");
  log(`${how||"You received"}: [${it.n}]`, QUAL[it.q].color);
  if(it.q >= 4) showBanner(QUAL[it.q].name + " item!", it.n, 4);
  return true;
}
// gear drop when a monster dies
function mobGearDrop(m){
  if(m.def.mini){ gainGear(makeGear({q:2, il:m.lvl, cls:S.cls}), "Loot"); return; }
  if(BEASTS.has(m.type) || m.def.passive) return;
  const src = m.def.boss ? "boss" : m.elite ? "elite" : "normal";
  const chance = src==="boss" ? 1 : src==="elite" ? 0.6 : 0.08;
  if(Math.random() >= chance) return;
  const cls = Math.random() < 0.7 ? S.cls : null;
  gainGear(makeGear({q:rollQuality(src), il:m.lvl, cls}), "Loot");
  if(src==="boss" && Math.random() < 0.5) gainGear(makeGear({q:rollQuality("elite"), il:m.lvl, cls:S.cls}), "Loot");
}
// quest rewards: every third quest and every chain's last quest give gear
function questGearQ(q){ if(q.n || q.pick) return -1; const num = +q.id.replace(/\D/g,""); const last = !QUESTS.some(o=>o.id[0]===q.id[0] && +o.id.replace(/\D/g,"") > num); return last ? 3 : num % 3 === 0 ? 2 : -1; }
function questGear(q){ const qq = questGearQ(q); if(qq < 0) return null; return makeGear({q:qq, il:q.lvl + 1, cls:S.cls}); }

// vendor stock: stable per vendor, class and level band
function vendorLevel(n){ if(n.cityVendor) return Math.max(1, Math.min(MAX_LVL, S.level)); const z = zinfo(parentZone(zoneAtTile(Math.floor(n.x/TILE), Math.floor(n.y/TILE)))); const max = z && z.lv ? z.lv[1] : 5; return Math.max(1, Math.min(max, Math.max(S.level, 3))); }
function vendorStock(n){
  const il = vendorLevel(n), r = mulberry(hashStr(n.id + S.cls + il));
  const out = [];
  for(const slot of SLOT_ORDER){ if(slot==="offhand" && !CLASS_OFF[S.cls].length) continue; out.push(makeGear({slot, cls:S.cls, q:1, il, r})); }
  for(let i=0;i<3;i++) out.push(makeGear({cls:S.cls, q:2, il, r}));
  out.forEach((it,i)=>it.id = "v_"+n.id+"_"+i);
  return out;
}

// equip / unequip
function equipGear(id){
  const i = S.gear.findIndex(x=>x.id===id); if(i<0) return;
  const it = S.gear[i];
  if(!canWear(it)) return err(`A ${CLASSES[S.cls].name} cannot use ${gearTypeName(it).toLowerCase()}.`);
  if(S.level < it.il) return err(`Requires level ${it.il}.`);
  S.gear.splice(i, 1);
  const old = S.eq[it.slot]; if(old) S.gear.push(old);
  S.eq[it.slot] = it; snd(it.slot==="weapon"||it.slot==="offhand" ? "eq_weapon" : it.arm ? "eq_"+it.arm : "eq_jewel"); recompute(false); log(`You equipped ${it.n}.`, QUAL[it.q].color); save();
}
function unequipGear(slot){
  const it = S.eq[slot]; if(!it) return;
  if(S.gear.length >= GEAR_MAX) return err("Your bag is full.");
  delete S.eq[slot]; S.gear.push(it); snd("eq_cloth", {vol:0.7}); recompute(false); save();
}

// html helpers
function gearIco(it, px){ px = px||34; return `<span class="gico" style="width:${px}px;height:${px}px;border-color:${QUAL[it.q].color}"><img src="assets/weapons/${gearIcon(it)}.png" alt=""></span>`; }
function statLines(it, cmp){
  return Object.keys(STAT_NAME).filter(k=>it.st[k] || (cmp && cmp.st[k])).map(k=>{
    const v = it.st[k]||0, unit = (k==="crit"||k==="def") ? "%" : "";
    let diff = ""; if(cmp){ const d = Math.round((v - (cmp.st[k]||0))*10)/10; if(d) diff = ` <span style="color:${d>0?"#7be08a":"#ff6b5e"}">(${d>0?"+":""}${d}${unit})</span>`; }
    return v ? `+${v}${unit} ${STAT_NAME[k]}${diff}` : `<span class="muted">${STAT_NAME[k]}${diff}</span>`; }).join(" · ");
}
function gearDesc(it, showCmp){
  const ok = canWear(it), lvlOk = S.level >= it.il, cur = S.eq ? S.eq[it.slot] : null;

}

// the three gate letters, then the two locked doors; secret walls come after
const DG_GATE_CH = ["G","H","I"], DG_LOCK_CH = ["X","Y"];
function dgBuildGrid(sp, W, H){
  const g = []; for(let y=0;y<H;y++) g.push(Array(W).fill("#"));
  const put = (x,y,ch)=>{ if(x>=0 && x<W && y>=0 && y<H) g[y][x] = ch; };
  for(const [id,[rx,ry,rw,rh]] of Object.entries(sp.rooms)) for(let y=0;y<rh;y++) for(let x=0;x<rw;x++) put(rx+x, ry+y, ".");
  for(const [a,b,door] of sp.links){ const A = sp.rooms[a], B = sp.rooms[b]; if(!A || !B) throw new Error("bad link "+a+"-"+b);
    const oy0 = Math.max(A[1], B[1]), oy1 = Math.min(A[1]+A[3], B[1]+B[3]), ox0 = Math.max(A[0], B[0]), ox1 = Math.min(A[0]+A[2], B[0]+B[2]);
    if(oy1 - oy0 >= 3){ const y = Math.floor((oy0+oy1)/2), [L,R] = A[0] < B[0] ? [A,B] : [B,A], xm = Math.floor((L[0]+L[2]+R[0])/2);
      for(let x=L[0]+L[2]-1; x<=R[0]; x++) for(let k=-1;k<=1;k++) put(x, y+k, door && x===xm ? door : ".");
    } else if(ox1 - ox0 >= 3){ const x = Math.floor((ox0+ox1)/2), [T,Bt] = A[1] < B[1] ? [A,B] : [B,A], ym = Math.floor((T[1]+T[3]+Bt[1])/2);
      for(let y=T[1]+T[3]-1; y<=Bt[1]; y++) for(let k=-1;k<=1;k++) put(x+k, y, door && y===ym ? door : ".");
    } else throw new Error("link "+a+"-"+b+" has no overlap"); }
  for(const [id,list] of Object.entries(sp.feat)){ const [rx,ry,rw,rh] = sp.rooms[id];
    for(const f of list){
      if(f[0]==="#rect"){ const [,ch,x,y,w,h] = f; for(let j=0;j<h;j++) for(let i=0;i<w;i++) put(rx+x+i, ry+y+j, ch); }
      else if(f[0]==="#ring"){ const [,ch,cx,cy,rin,rout] = f; for(let j=-rout;j<=rout;j++) for(let i=-rout;i<=rout;i++){ const d = Math.max(Math.abs(i),Math.abs(j)); if(d>=rin && d<=rout) put(rx+cx+i, ry+cy+j, ch); } }
      else put(rx+f[1], ry+f[2], f[0]); } }
  return g;
}
// every feature tile in reading order, plus the groups of gates and secret walls
function dgScan(g){
  const ents = [], gates = {G:[],H:[],I:[],X:[],Y:[]}, zs = [];
  for(let y=0;y<g.length;y++) for(let x=0;x<g[y].length;x++){ const ch = g[y][x];
    if(gates[ch]) gates[ch].push([x,y]); else if(ch==="z") zs.push([x,y]); else if(ch!=="#" && ch!==".") ents.push({ch,x,y}); }
  const seen = new Set(), secrets = [];   // connected groups of secret wall tiles
  for(const [x,y] of zs){ const k = x+","+y; if(seen.has(k)) continue; const grp = [], q = [[x,y]]; seen.add(k);
    while(q.length){ const [cx,cy] = q.pop(); grp.push([cx,cy]); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = cx+dx, ny = cy+dy, nk = nx+","+ny; if(!seen.has(nk) && zs.some(z=>z[0]===nx && z[1]===ny)){ seen.add(nk); q.push([nx,ny]); } } }
    secrets.push(grp); }
  return {ents, gates, secrets};
}

const TILE_BY_NAME = () => ({T_ROCK, T_CRYPT, T_ASH, T_SNOW, T_CLIFF, T_CWALL, T_ICE, T_BOULDER, T_WATER, T_LAVA, T_SPINE});
const ROOM_SIZES = [[8,8],[10,9],[11,10],[10,10],[11,10],[10,9],[14,13]];
let dobjs = [];                 // levers, runes, tablets, portals inside dungeons
let MOB_GEN = 0;                // bumped whenever monsters are rebuilt (invalidates the co-op id cache)
const DSTATE = {};              // per dungeon: {keep, done}
const RUNE_COL = [["Red","#e0453a"],["Blue","#3f86e0"],["Green","#3fbf5a"],["Yellow","#f0d040"]];

// ---- dungeons v2: build the four dungeons from DG_SPEC
function carveDungeons(){
  for(const D of Object.values(DUNGEONS)){
    Object.assign(D, DG_SPEC[D.id]);
    const T = TILE_BY_NAME(), x0 = OW + 4, y0 = D.oy, grid = dgBuildGrid(D, DG_W, DG_H), sc = dgScan(grid);
    D.L = {x0, y0, floor:T[D.floor], wall:T[D.wall], obst:T[D.obst]}; D.ents = sc.ents; D.hz = []; D.hzMap = new Map(); D.gates = [];
    const mkGate = (kind, tiles, key)=>({kind, tiles:tiles.map(([x,y])=>[x0+x, y0+y]), open:tiles.length===0, key});
    for(const ch of DG_GATE_CH) D.gates.push(mkGate("gate", sc.gates[ch]));
    DG_LOCK_CH.forEach((ch,i)=>D.gates.push(mkGate("lock", sc.gates[ch], i)));
    for(const grp of sc.secrets) D.gates.push(mkGate("secret", grp));
    const setT = (x,y,t)=>{ if(x>OW && x<MW-1 && y>0 && y<MH-1){ map[y*MW+x] = t; zmap[y*MW+x] = D.id; } };
    for(let y=0;y<DG_H;y++) for(let x=0;x<DG_W && x0+x<MW-1;x++) setT(x0+x, y0+y, grid[y][x]==="#" ? D.L.wall : D.L.floor);
    for(const e of sc.ents) if(e.ch==="~" || e.ch==="v"){ const h = {x:x0+e.x, y:y0+e.y, k:e.ch==="v" ? "collapse" : D.hazard, ph:0, t:0, f:false, fT:0}; D.hz.push(h); D.hzMap.set(h.y*MW+h.x, h); }
    { let pi = 0; const done = new Set(); for(const h0 of D.hz){ if(done.has(h0)) continue; pi++; const st = [h0]; done.add(h0);   // each connected patch of hazard floor shares one rhythm
      while(st.length){ const h = st.pop(); h.ph = (pi*3) % 8; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n = D.hzMap.get((h.y+dy)*MW+h.x+dx); if(n && !done.has(n) && n.k===h.k){ done.add(n); st.push(n); } } } } }
    const s0 = sc.ents.find(e=>e.ch==="S"), b0 = sc.ents.find(e=>e.ch==="B");
    D.L.sx = x0+s0.x; D.L.sy = y0+s0.y; D.L.bx = x0+b0.x; D.L.by = y0+b0.y;
    deco.push({k:"brazier", x:(D.L.sx-2)*TILE+16, y:(D.L.sy-2)*TILE+16}, {k:"brazier", x:(D.L.sx+2)*TILE+16, y:(D.L.sy-2)*TILE+16});
    for(const [ox,oy] of [[-5,-5],[5,-5],[-5,5],[5,5]]) deco.push({k:"brazier", x:(D.L.bx+ox)*TILE+16, y:(D.L.by+oy)*TILE+16});
    deco.push({k:"brazier", x:(D.ent.x-1)*TILE+16, y:(D.ent.y-1)*TILE+16}, {k:"brazier", x:(D.ent.x+1)*TILE+16, y:(D.ent.y-1)*TILE+16});
  }
}
function setGate(D, g, closed){ for(const [x,y] of g.tiles) map[y*MW+x] = closed ? (g.kind==="secret" ? D.L.wall : T_GATE) : D.L.floor; }
// (re)build a dungeon: fresh monsters, closed doors, unsolved puzzles. players = group size (1 = solo mode)
function resetDungeon(D, seed, players){
  for(const o of (D.objs||[])) if(o.kind==="block" && map[o.ty*MW+o.tx]===T_BLOCK) map[o.ty*MW+o.tx] = D.L.floor;
  MOB_GEN++; mobs = mobs.filter(m=>m.def.dg !== D.id); dobjs = dobjs.filter(o=>o.dg !== D.id);
  D.seed = seed == null ? Math.floor(Math.random()*1e9) : seed;
  D.players = players || (coopOn() ? 1 + Math.min(3, Object.keys(COOP.remotes).length) : 1); D.mode = D.players > 1 ? "group" : "solo";
  const rr = rng(hashStr(D.id) ^ D.seed), L = D.L, lv = ZONES[D.id].lv, hpM = 1 + 0.7*(D.players-1), dmM = 1 + 0.12*(D.players-1);
  let nc = 0; const nb = 100000 + Object.keys(DUNGEONS).indexOf(D.id)*1000; D.mobs = []; D.adds = [];   // co-op: same ids on every computer
  const put = (type, e, lvl, dormant)=>{ const m = makeMob(type, L.x0+e.x, L.y0+e.y, lvl); m.nid = nb + nc++; if(hpM > 1){ m.maxHp = Math.round(m.maxHp*hpM); m.hp = m.maxHp; m.dmg *= dmM; }
    D.mobs.push(m); if(dormant){ m.dormant = true; D.adds.push(m); } else mobs.push(m); return m; };
  const rl = ()=> lv[0] + Math.floor(rr()*(lv[1]-lv[0]+1)), byCh = ch => D.ents.filter(e=>e.ch===ch); let wi = 0;
  for(const e of D.ents){ const ch = e.ch;
    if(ch==="1" || ch==="2" || ch==="3") put(D.pack[+ch-1], e, rl());
    else if(ch==="M") put(D.mini[0], e, MOBS[D.mini[0]].lv[0]);
    else if(ch==="N") put(D.mini[1], e, MOBS[D.mini[1]].lv[0]);
    else if(ch==="B") put(D.boss, e, MOBS[D.boss].lv[0]);
    else if(ch==="w"){ for(let k=0;k<D.players;k++) put(D.pack[wi++ % 3], e, lv[1], true); } }
  D.keys = [false, false]; D.prog = [0,0,0]; D.order = []; D.ph = D.bfx.phases.map(()=>false); D.stT = 3;
  for(const g of D.gates){ g.open = g.tiles.length === 0; if(!g.open) setGate(D, g, true); }
  D.hz.forEach(h=>{ h.t = 0; h.f = false; h.fT = 0; });
  const mk = o=>{ o.dg = D.id; o.oi = dobjs.filter(x=>x.dg===D.id).length; dobjs.push(o); return o; }, wx = e=>(L.x0+e.x)*TILE+16, wy = e=>(L.y0+e.y)*TILE+16, GI = {a:0,b:1,c:2,d:0,e:1,f:2,p:0,q:1,u:2};
  for(const ch of ["a","b","c"]) byCh(ch).forEach((e,i)=>mk({kind:"lever", gate:GI[ch], i, on:false, x:wx(e), y:wy(e)}));
  for(const ch of ["d","e","f"]){ const list = byCh(ch); if(!list.length) continue; const order = [0,1,2,3]; for(let k=3;k>0;k--){ const j = Math.floor(rr()*(k+1)); [order[k], order[j]] = [order[j], order[k]]; }
    D.order[GI[ch]] = order; list.forEach((e,i)=>mk({kind:"rune", gate:GI[ch], c:i, on:false, x:wx(e), y:wy(e)})); }
  for(const e of byCh("t")){ let best = null, bd = 1e9; for(const o of dobjs) if(o.dg===D.id && o.kind==="rune"){ const d = Math.hypot(o.x-wx(e), o.y-wy(e)); if(d < bd){ bd = d; best = o; } }
    if(best) mk({kind:"tablet", gate:best.gate, x:wx(e), y:wy(e)}); }
  for(const ch of ["p","q","u"]) byCh(ch).forEach(e=>mk({kind:"plate", gate:GI[ch], on:false, tx:L.x0+e.x, ty:L.y0+e.y, x:wx(e), y:wy(e)}));
  byCh("x").forEach(e=>{ const o = mk({kind:"block", tx:L.x0+e.x, ty:L.y0+e.y, hx:L.x0+e.x, hy:L.y0+e.y, on:false, x:wx(e), y:wy(e)}); map[o.ty*MW+o.tx] = T_BLOCK; });
  byCh("R").forEach(e=>mk({kind:"altar", x:wx(e), y:wy(e)}));
  byCh("K").forEach(e=>mk({kind:"chest", key:0, on:false, x:wx(e), y:wy(e)}));
  byCh("J").forEach(e=>mk({kind:"chest", key:1, on:false, x:wx(e), y:wy(e)}));
  byCh("C").forEach(e=>mk({kind:"chest", loot:true, on:false, x:wx(e), y:wy(e)}));
  D.gates.forEach((g,gi)=>{ if(g.kind==="lock" && g.tiles.length){ const t = g.tiles[g.tiles.length>>1]; mk({kind:"lock", key:g.key, gi, on:false, x:t[0]*TILE+16, y:t[1]*TILE+16}); }
    else if(g.kind==="secret"){ const t = g.tiles[g.tiles.length>>1]; mk({kind:"crack", gi, on:false, x:t[0]*TILE+16, y:t[1]*TILE+16}); } });
  const s0 = byCh("S")[0]; mk({kind:"exit", x:wx(s0), y:wy(s0)});
  D.objs = dobjs.filter(o=>o.dg===D.id);
  DSTATE[D.id] = {keep:false, done:false};
}
function spawnDungeons(){ dobjs = []; for(const D of Object.values(DUNGEONS)){ resetDungeon(D); dobjs.push({dg:null, dgEnt:D.id, kind:"entrance", x:D.ent.x*TILE+16, y:D.ent.y*TILE+16}); } }

function openGate(D, gi, quiet){ const g = D.gates[gi]; if(!g || g.open) return; g.open = true; setGate(D, g, false); if(quiet) return; snd("door"); setTimeout(()=>snd("solved"), 250);
  const [gx, gy] = g.tiles[g.tiles.length>>1]; ring(gx*TILE+16, gy*TILE+16, 70, "#ffd36b");
  const txt = g.kind==="lock" ? ["The door unlocks!", "The way forward is open"] : g.kind==="secret" ? ["A hidden passage opens!", "Something was hidden here"] : [`The ${D.gate} opens!`, "The way forward is clear"];
  showBanner(txt[0], txt[1], 3); log(txt[0], "#7be08a"); }
// remote = this action was done by a co-op friend (no damage to you; quiet = you are not inside that dungeon)
function useDObj(o, remote, ex){
  const D = DUNGEONS[o.dg], q = !!remote && P.inDungeon !== o.dg;
  if(o.kind === "entrance") return openPanel("npc", DUNGEONS[o.dgEnt].keeper.id);
  if(o.kind === "exit" || o.kind === "exitEnd") return leaveDungeon(false);
  if(o.kind === "lever"){

// ---- hotbar
let slotEls = [];
function currentBar(){ ensureBars(); return S.bars[barKeyNow()].map(id=>id && S.learned.includes(id) ? id : null); }
function currentBar2(){ ensureBars(); return S.bars[barKey2()].map(id=>id && S.learned.includes(id) ? id : null); }
function fillBar(hb, ids, label){
  ids.forEach((id, i)=>{
    const b = document.createElement("button"); b.className = "slot"; b.dataset.i = i;
    if(!id){ b.classList.add("empty"); b.insertAdjacentHTML("beforeend", `<span class="k">${label(i)}</span>`); b.title = "Empty slot – place a spell here from the Spellbook"; b.addEventListener("click", ()=>openPanel("spells")); hb.appendChild(b); slotEls.push(null); return; }
    const a = AB[id]; const c = document.createElement("canvas"); c.width = c.height = 96; { const ic = abIcon(id); drawIcon(c, ic[0], ic[1]); }
    b.appendChild(c); b.insertAdjacentHTML("beforeend", `<span class="k">${label(i)}</span><span class="cd"></span>`);
    b.dataset.tipab = id; b.setAttribute("aria-label", a.name);
    b.addEventListener("click", ()=>tryUse(id)); hb.appendChild(b); slotEls.push({b, id, cd:b.querySelector(".cd")});
  });
}
function buildHotbar(){
  const hb = $("hotbar"); hb.innerHTML = ""; slotEls = [];
  fillBar(hb, currentBar(), i=>keyName(KB["bar"+(i+1)]));
  const pots = [["hp","Q","potHp","#c03a52"]]; if(CLASSES[S.cls].res==="mana") pots.push(["mana","R","potMana","#3f86e0"]);
  pots.forEach(([kind, key, item, col])=>{ const b = document.createElement("button"); b.className = "slot pot"; const c = document.createElement("canvas"); c.width = c.height = 96; drawItemSprite(c, item, col); b.appendChild(c);
    b.insertAdjacentHTML("beforeend", `<span class="k">${keyName(KB[kind==="hp"?"potHp":"potMana"])}</span><span class="cd"></span><span class="cnt"></span>`); b.title = kind==="hp" ? "Healing Potion" : "Mana Potion";
    b.addEventListener("click", ()=>usePotion(kind)); hb.appendChild(b); slotEls.push({b, pot:kind, cd:b.querySelector(".cd"), cnt:b.querySelector(".cnt")}); });
  const hb2 = $("hotbar2"), bar2 = currentBar2(); hb2.innerHTML = ""; hb2.hidden = !bar2.some(Boolean);   // the second bar only shows once it has a spell on it
  if(!hb2.hidden) fillBar(hb2, bar2, i=>"⇧"+((i+1)%10));
}
function updHotbar(){
  const type = resType();
  for(const s of slotEls){ if(!s) continue;
    if(s.pot){ const n = s.pot==="hp" ? (S.bag.potHp||0)+(S.bag.potHp2||0)+(S.bag.potHp3||0) : (S.bag.potMana||0)+(S.bag.potMana2||0); setT(s.cnt, String(n)); setT(s.cd, P.potCd>0 ? Math.ceil(P.potCd)+"" : ""); s.b.classList.toggle("oom", n===0); continue; }
    const a = AB[s.id], locked = S.level < a.lvl, cd = P.cds[s.id]||0;
    s.b.classList.toggle("locked", locked);
    s.b.classList.toggle("oom", !locked && P[type] < costOf(s.id));
    let oor = false; if(a.tgt==="enemy" && P.target && !P.target.dead){ const d = dist(P,P.target)-P.target.r; oor = d > a.range || (a.minRange && d < a.minRange); }
    s.b.classList.toggle("oor", !!oor);
    s.b.classList.toggle("active", (s.id==="bear"&&P.form==="bear")||(s.id==="cat"&&P.form==="cat")||(s.id==="leopard"&&P.form==="leopard"));
    setT(s.cd, cd>0 ? (cd>=10?Math.ceil(cd):cd.toFixed(1)) : "");
    s.cd.classList.toggle("run", cd>0); s.cd.classList.toggle("soon", cd>0 && cd<3); if(cd>0) s.cd.style.setProperty("--p", clamp(cd/(a.cd||cd||1), 0, 1).toFixed(3));
    s.b.classList.toggle("oncd", cd>0); s.b.classList.toggle("gcd", cd<=0 && !a.offGcd && P.gcd>0);
    if(s.prev>0 && cd<=0){ s.b.classList.remove("ready"); void s.b.offsetWidth; s.b.classList.add("ready"); } s.prev = cd;
  }
}

// ---- HUD
function updHUD(dt){
  setT($("pname"), S.name); setT($("plvl"), "Level "+S.level);
  setT($("pdesc"), `${RACES[S.race].name} ${CLASSES[S.cls].name}${P.form==="bear"?" · Bear Form":P.form==="cat"?" · Wolf Form":P.form==="leopard"?" · Leopard Form":""}`);
  setW($("phpi"), P.hp/P.maxHp); setW($("pshi"), P.shield/P.maxHp); setT($("phpt"), `${Math.ceil(P.hp)} / ${P.maxHp}`);
  const type = resType(), mr = maxRes(type); const ri = $("presi"); if(ri._c !== type){ ri._c = type; ri.style.background = RES_COLOR[type]; }
  setW(ri, P[type]/mr); setT($("prest"), `${RES_NAME[type]} ${Math.floor(P[type])} / ${mr}${P.form==="cat"&&P.cp?` · Combo ${P.cp}`:""}`);
  renderEffects($("pbuffs"), playerEffects());
  const t = P.target, tf = $("tframe");
  if(t && !t.dead){ tf.hidden = false; setT($("tname"), t.name); const tl = $("tlvl"); setT(tl, (t.def.boss?"Boss ":t.elite?"Elite ":"")+"Level "+t.lvl); tl.className = "num "+lvlClass(t.lvl);
    setW($("thpi"), t.hp/t.maxHp); setT($("thpt"), `${Math.max(0,Math.ceil(t.hp))} / ${t.maxHp}`);
    const st = []; if(t.evading) st.push("Evading"); 
    if(P.autoTarget===t) st.unshift(dist(P,t)-t.r > (autoInfo()||{range:52}).range ? "Attacking – move closer" : "Attacking"); setT($("tdesc"), st.join(" · ") || (t.state==="chase"?"In combat":"Calm")); renderEffects($("tbuffs"), targetEffects(t)); }
  else tf.hidden = true;
  setT($("zone"), ZONES[curZone]?.name || ""); setT($("gold"), `${S.gold} gold`);
  const need = xpNeed(S.level); setW($("xpi"), S.level>=MAX_LVL ? 1 : S.xp/need); setT($("xpt"), S.level>=MAX_LVL ? "Max level" : `${S.xp} / ${need} XP`);
  coopPartyHUD();
  const cast = $("cast");
  if(P.casting){ P.castDone = null; cast.hidden = false; setW($("casti"), Math.min(1, P.casting.el/P.casting.total)); setT($("castt"), P.casting.label); }
  else if(P.castDone && P.castDone.t > 0){ P.castDone.t -= dt; cast.hidden = false; setW($("casti"), 1); setT($("castt"), P.castDone.label); }
  else cast.hidden = true;
  const tb = $("talbtn"); if(tb) tb.classList.toggle("glow", talentPoints() - talentsSpent() > 0);
  if(bannerT > 0){ bannerT -= dt; if(bannerT < 0.6) $("banner").style.opacity = Math.max(0, bannerT/0.6); }
  updHotbar(); chatUpd(dt);
}
function refreshTracker(){
  const act = QUESTS.filter(q=>S.quests[q.id] && S.quests[q.id].state==="active");
  let h = `<h4>Quests</h4>`;
  if(!act.length) h += `<div class="o">No active quests. Look for a yellow ! above someone nearby.</div>`;
  for(const q of act){ const rd = qReady(q); h += `<div class="q ${rd?"done":""}"><b>${esc(q.name)}</b>${q.obj.map((o,i)=>`<div class="o">${esc(objName(o))}: ${qProg(q,i)}/${o[2]}</div>`).join("")}${rd?`<div class="o" style="color:var(--hp)">Turn in to ${esc(npcName(qTurnInNpc(q)))}</div>`:""}</div>`; }
  $("tracker").innerHTML = h;
}

let worldBuilt = false, worldLeftAt = 0;
function startGame(sv, fresh){
  S = Object.assign(newSave(sv.name, sv.race, sv.cls), sv); if(!S.id){ S.id = newId(); }
  S.skills = Object.assign({mining:1, herb:1}, sv.skills||{});
  if(!Array.isArray(sv.learned)) S.learned = allBarIds().filter(id=>AB[id].lvl<=S.level && AB[id].lvl<=16);
  S.learned = S.learned.filter(id=>AB[id]); ensureBars();
  if(S.cls==="druid" && !S.learned.includes("touch")){ S.learned.push("touch"); autoPlace("touch"); }
  if(!worldBuilt){ spawnAll(); worldBuilt = true; }
  else { const el = Math.max(0, (Date.now() - worldLeftAt)/1000);   // same world as before: dead monsters and picked nodes keep their respawn timers, which also ran while you were away
    for(const m of mobs){ if(m.def.dg) continue; if(m.dead){ m.respawn -= el; if(m.respawn <= 0) respawnMob(m); } else if(m.state !== "idle" || m.hp < m.maxHp) respawnMob(m); }
    for(const n of nodes.concat(qobjs)) if(!n.active){ n.respawn -= el; if(n.respawn <= 0) n.active = true; } }
  if(sv.dgs && DUNGEONS[sv.dgs.id] && sv.dgs.snap && sv.dgs.snap.v === 2){ const D = DUNGEONS[sv.dgs.id]; resetDungeon(D, sv.dgs.seed, sv.dgs.snap.players); dgApply(D, sv.dgs.snap); DSTATE[D.id].keep = true; }   // dungeon progress survives a refresh
  if(!sv.v || sv.v < 3){ S.quests = {}; S.qbag = {}; S.x = S.y = null; }
  if(!sv.ws){ if(S.x) S.x *= 2; if(S.y) S.y *= 2; if(S.death){ S.death.x *= 2; S.death.y *= 2; } }   // the world became twice as big
  S.qbag = S.qbag || {}; S.gear = Array.isArray(S.gear) ? S.gear : []; S.eq = S.eq || {}; retireOldGear(); S.pick = sv.pick || null; initExplore(); if(S.pick) setTimeout(()=>openPanel("pick"), 1500);
  const home = HUBS[RACE_HUB[S.race]];
  P = {x:home.x*TILE+16, y:(home.y+2)*TILE+16, r:11, hp:1, maxHp:0, mana:0, maxMana:0, rage:0, focus:100, energy:100, cp:0, form:null, target:null, casting:null,
    gcd:0, cds:{}, buffs:{}, hots:[], shield:0, shieldT:0, autoT:0, combatT:0, potCd:0, fx:1, moving:false, dash:null, leap:null, dead:false};
  if(S.x && S.y && !collides(S.x, S.y, 10)){ P.x = S.x; P.y = S.y; }
  recompute(true);
  if(sv.hp != null && sv.mana != null && sv.t && !S.death){ const el = Math.max(0, (Date.now()-sv.t)/1000);   // keep hp and mana from last time, plus the regeneration while away
    P.hp = Math.min(P.maxHp, Math.max(1, sv.hp) + P.maxHp*0.04*el); P.mana = Math.min(P.maxMana, sv.mana + P.maxMana*0.016*(1 + gearStat("int")*0.01)*el); }
  $("create").hidden = true; $("dead").hidden = true; closePanel();
  npcs = npcs.filter(n=>!n.spirit);   // spirit healers from an earlier session
  restoreDeath();
  buildHotbar(); refreshTracker(); running = true; curZone = null;
  localSave = serialize();
  if(fresh){ log(`Welcome to ${home.name}! Talk to the people with a yellow ! for your first quests.`, "#e6bd5c"); log("Press H for help with the controls.", "#93a4ad"); save(true); }
}

const ARROWS = {arrowup:"up", arrowdown:"down", arrowleft:"left", arrowright:"right"};
function moveDir(k){ if(ARROWS[k]) return ARROWS[k]; const a = kbAction(k); return a==="up"||a==="down"||a==="left"||a==="right" ? a : null; }
addEventListener("keydown", e=>{
  if(!running || e.target.tagName==="INPUT" || e.target.tagName==="SELECT") return;
  const k = e.key.toLowerCase();
  if(rebinding){ e.preventDefault(); if(!["shift","control","alt","meta"].includes(k)) finishRebind(k); return; }
  const dir = moveDir(k); if(dir){ keys.add(dir); e.preventDefault(); return; }
  if(e.repeat) return;
  if(e.shiftKey && /^Digit\d$/.test(e.code)){ e.preventDefault(); const id = currentBar2()[(+e.code.slice(5)+9)%10]; if(id) tryUse(id); return; }   // second bar: Shift+1..0
  if(k==="escape"){ if(panelKind) closePanel(); else if(P.casting) cancelCast(); else if(P.target) setTarget(null); else if(P.ftarget) P.ftarget = null; else openPanel("menu"); return; }
  const a = kbAction(k); if(!a) return;
  if(a.startsWith("bar")){ const id = currentBar()[+a.slice(3)-1]; if(id) tryUse(id); return; }
  if(a==="target"){ e.preventDefault(); cycleTarget(); return; }
  if(a==="attack") return startAttack();
  if(a==="petAtk") return petToggleAttack();
  if(a==="chat") return chatOpen();
  if(a==="interact") return interact();
  if(a==="potHp") return usePotion("hp");
  if(a==="potMana") return usePotion("mana");
  if(a==="rest") return toggleRest();
  const pm = {char:"char", bag:"bag", talents:"talents", quests:"quests", info:"help", map:"map", spells:"spells", craft:"craft"}; if(pm[a]){ e.preventDefault(); return openPanel(pm[a]); }
});
addEventListener("keyup", e=>{ const d = moveDir(e.key.toLowerCase()); if(d) keys.delete(d); });

// start auto attack on the current target (right-click, T or the touch button)
function startAttack(m){ if(P.dead) return; m = m || P.target;
  if(!m || m.dead || m.evading){
    const cand = mobs.filter(o=>!o.dead && !o.evading && dist(P,o)-o.r < 400).sort((a,b)=>(!!a.def.passive - !!b.def.passive) || (dist(P,a)-dist(P,b))); m = cand[0];
    if(!m) return err("No enemy nearby"); } setTarget(m); P.autoTarget = m; }   // the swing timer (P.autoT) is left alone, so spamming Hit cannot attack faster
function mobAt(e){ const wx = e.clientX/ZOOM + cam.x, wy = e.clientY/ZOOM + cam.y; let best = null, bd = 34;
  for(const m of mobs){ if(m.dead) continue; const cy = m.y - Math.max(m.r, 22); const d = Math.hypot(m.x-wx, cy-wy); if(d < bd + m.r*0.5){ bd = d; best = m; } } return best; }
let lastRight = 0;
// right-click (also Ctrl+click on a Mac, and double-click) starts attacking
cv.addEventListener("contextmenu", e=>{ e.preventDefault(); if(running && performance.now()-lastRight > 150) startAttack(mobAt(e)); });
cv.addEventListener("dblclick", e=>{ if(running){ const m = mobAt(e); if(m) startAttack(m); } });
cv.addEventListener("pointerdown", e=>{
  if(!running) return;
  const wx = e.clientX/ZOOM + cam.x, wy = e.clientY/ZOOM + cam.y;
  const fr = coopFriendAt(wx, wy); if(fr && e.button === 0 && !e.ctrlKey){ coopSelect(fr.id); return; }
  const pt = e.button === 0 && !e.ctrlKey ? coopPetAt(wx, wy) : null; if(pt){ coopSelect(pt); return; }
  const best = mobAt(e);
  if(e.button === 2 || (e.button === 0 && e.ctrlKey)){ lastRight = performance.now(); startAttack(best); return; }
  if(best){ setTarget(best); return; }
  if(isTouch){ for(const o of dobjs){ if(Math.hypot(o.x-wx, o.y-16-wy) < 30 && dobjLabel(o)){ if(dist(P,o) < 70) useDObj(o); else err("Too far away"); return; } } }

function dgSaveNow(){ try{ for(const D of Object.values(DUNGEONS)){ const st = DSTATE[D.id]; if(st && !st.done && ((P && P.inDungeon===D.id) || st.keep)) return {id:D.id, seed:D.seed, snap:dgSnap(D)}; } }catch(_){ } return null; }
function storeChars(important){

}

    const i = chars.findIndex(x=>x.id===c.id); if(i<0) chars.push(c); else if((c.t||0) > (chars[i].t||0)) chars[i] = c; }

}
async function initCloud(){

}

// ======================= LOOP / BOOT =======================
let last = 0;
function loop(ts){

<script>
// ======================= CO-OP (PC) – step 1: see each other in the same world =======================
// One player hosts and gets a short code; friends join with the code. Connections go directly between

const COOP = {peer:null, conns:[], role:null, code:null, status:"", remotes:{}, sendT:0, busy:false};
const PEER_PREFIX = "rimfrost-coop-v1-";
function coopLoad(){ return new Promise((ok, no)=>{ if(window.Peer) return ok(); const s = document.createElement("script"); s.src = "assets/lib/peerjs.min.js"; s.onload = ok; s.onerror = ()=>no(new Error("The co-op library could not be loaded")); document.head.appendChild(s); }); }
function coopNewCode(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; for(let i=0;i<5;i++) c += A[Math.floor(Math.random()*A.length)]; return c; }
function coopRefresh(){ if(panelKind==="coop") renderPanel(); }
function coopOn(){ return COOP.conns.length > 0; }
// ---- co-op chat: the history lasts for the session, text is never run as code
let chatShowT = 0, chatLast = 0; const chatSeen = new Set();   // who has already been announced as joined
function chatAdd(name, text, sys){ const box = $("chatlog"); if(!box) return; const d = document.createElement("div");
  if(sys){ d.className = "sys"; d.textContent = text; } else { const b = document.createElement("b"); b.textContent = name + ": "; d.appendChild(b); d.appendChild(document.createTextNode(text)); }
  box.appendChild(d); while(box.children.length > 100) box.firstChild.remove(); box.scrollTop = box.scrollHeight; chatShowT = 12; }
function chatOpen(){ if(!coopOn()) return; const inp = $("chatin"); inp.hidden = false; $("chat").hidden = false; $("chat").classList.add("show"); keys.clear(); inp.value = ""; inp.focus(); }
function chatClose(){ const inp = $("chatin"); inp.hidden = true; inp.blur(); chatShowT = 6; }
function chatSend(txt){ txt = (txt||"").trim().slice(0, 200); if(!txt) return; const now = performance.now(); if(now - chatLast < 700) return err("Slow down"); chatLast = now;
  chatAdd(S.name, txt, false); coopBroadcast({t:"chat", id:coopMyId(), n:S.name, m:txt}); }
function chatUpd(dt){ const pf = $("pframe"); if(pf) pf.classList.toggle("selself", coopOn() && !P.ftarget);   // heals and buffs go to you when nobody else is selected
  const el = $("chat"); if(!el) return; const on = coopOn(); if(el.hidden === on) el.hidden = !on;
  if(!on){ chatSeen.clear(); const l = $("chatlog"); if(l.children.length) l.innerHTML = ""; if(!$("chatin").hidden) chatClose(); return; }
  if(chatShowT > 0) chatShowT -= dt; el.classList.toggle("show", !$("chatin").hidden || chatShowT > 0); el.classList.toggle("typing", !$("chatin").hidden); }
$("chatin").addEventListener("keydown", e=>{ e.stopPropagation(); if(e.key==="Enter"){ chatSend($("chatin").value); chatClose(); } else if(e.key==="Escape") chatClose(); });

  COOP.status = t==="peer-unavailable" ? "No game was found with that code." : t==="network" || t==="server-error" || t==="socket-error" || t==="socket-closed" ? "Could not reach the co-op service. Check your internet connection." : t==="browser-incompatible" ? "This browser does not support co-op." : t==="blocked" ? "The game was found, but your computers could not connect directly. A firewall or the network (for example a work computer or work network) is probably blocking it." : "Something went wrong: " + (t || (e && e.message) || e);

async function coopHost(){
  if(COOP.busy) return; COOP.busy = true; coopLeave(true); COOP.status = "Starting…"; coopRefresh();
  try{ await coopLoad(); }catch(e){ return coopErr(e); }
  const tryOpen = (n)=>{ COOP.code = coopNewCode(); const peer = new Peer(PEER_PREFIX + COOP.code, window.COOP_SERVER || {debug:0}); COOP.peer = peer; COOP.role = "host";
    peer.on("open", ()=>{ COOP.busy = false; COOP.status = "Waiting for friends to join…"; coopRefresh(); });
    peer.on("connection", c=>coopAttach(c));
    peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch(e){} });
    peer.on("error", e=>{ if(e.type==="unavailable-id" && n < 4){ peer.destroy(); tryOpen(n+1); } else coopErr(e); }); };

}
async function coopJoin(code){

  if(COOP.busy) return; COOP.busy = true; coopLeave(true); COOP.status = "Connecting…"; coopRefresh();
  try{ await coopLoad(); }catch(e){ return coopErr(e); }
  const peer = new Peer(undefined, window.COOP_SERVER || {debug:0}); COOP.peer = peer; COOP.role = "guest"; COOP.code = code;
  peer.on("open", ()=>{ const c = peer.connect(PEER_PREFIX + code, {reliable:true}); coopAttach(c);
    setTimeout(()=>{ if(COOP.role==="guest" && !coopOn() && COOP.busy) coopErr({type:"blocked"}); }, 15000); });
  peer.on("error", e=>coopErr(e));
}
function coopAttach(c){
  c.on("open", ()=>{ if(COOP.role==="guest" && P && P.inDungeon) leaveDungeon(); COOP.conns.push(c); COOP.busy = false; COOP.status = "Connected"; coopSendState(true); coopRefresh(); });

function coopDrop(c){

  if(COOP.role==="guest"){ COOP.status = "The host closed the game."; COOP.remotes = {}; COOP.dgWait = null; if(P && P.inDungeon) leaveDungeon(); }

}
function coopLeave(silent){
  for(const c of COOP.conns){ try{ c.close(); }catch(e){} }

function coopBroadcast(msg, except){ for(const c of COOP.conns) if(c !== except && c.open){ try{ c.send(msg); }catch(e){} } }
function coopData(c, d){

  if(d.t==="bye"){ const r = COOP.remotes[d.id]; if(r){ log(`${r.name} left the game.`, "#93a4ad"); chatAdd(null, `${r.name} left`, true); delete COOP.remotes[d.id]; } return; }

  if(d.t==="vfx"){ coopVfxPlay(d); return; }
  if(d.t==="pfx"){ coopPetFx(d); return; }
  if(d.t==="phit"){ if(d.to===coopMyId()) petDamage(d.dmg, coopMobByNid(d.nid)); return; }
  if(d.t==="hit"){ if(d.to===coopMyId()){ const m = coopMobByNid(d.nid); playerDamage(d.dmg, m, d.kind); } else if(COOP.role==="host") coopSendTo(d.to, d); return; }
  if(d.t==="kill"){ if(d.to && d.to.includes(coopMyId())){ const m = coopMobByNid(d.nid); if(m) killRewards(m, d.n); } return; }
  if(d.t==="mobs"){ if(COOP.role==="guest") coopApplyMobs(d.m); return; }
  if(d.t==="fx"){ if(d.to===coopMyId()) coopReceiveFx(d); else if(COOP.role==="host") coopSendTo(d.to, d); return; }
  if(d.t!=="st" || !d.id || (COOP.peer && d.id===COOP.peer.id)) return;
  let r = COOP.remotes[d.id];
  if(!r){ r = COOP.remotes[d.id] = {id:d.id, x:d.x, y:d.y}; log(`${d.name} joined the game.`, "#7be08a"); if(!chatSeen.has(d.id)){ chatSeen.add(d.id); chatAdd(null, `${d.name} joined`, true); } snd("qaccept"); coopRefresh(); }
  const oldPet = r.pet && r.pet.kind ? r.pet : null;
  Object.assign(r, d, {x:r.x, y:r.y, tx:d.x, ty:d.y, seen:performance.now(), via:c.peer});
  { const q = d.pet, pd = q && PETS[q.k];   // a friend's pet
    if(pd){ r.pet = {kind:q.k, name:pd.name, type:pd.type, def:{color:pd.color, shape:pd.shape}, r:pd.r, x:oldPet?oldPet.x:q.x, y:oldPet?oldPet.y:q.y, tx:q.x, ty:q.y, fx:q.fx||1, walk:!!q.w, swing:q.sw?0.2:0,
        flash:oldPet ? (q.hp < oldPet.hp ? 0.12 : oldPet.flash) : 0, hp:q.hp, maxHp:q.mhp, res:q.res||0, ph:oldPet?oldPet.ph:Math.random()*6.28, rootT:0, slowT:0, stunT:0, state:"follow", owner:d.id};
      if(oldPet){ const dh = oldPet.hp - q.hp; if(dh >= 1) floatText(r.pet.x + rand(-8,8), r.pet.y - r.pet.r - 14, ""+dh, "#ff9a7a"); else if(-dh > q.mhp*0.25) floatText(r.pet.x, r.pet.y - 40, "+"+(-dh), "#62d36b"); }
      if(Math.hypot(q.x-r.pet.x, q.y-r.pet.y) > 400){ r.pet.x = q.x; r.pet.y = q.y; } }
    else r.pet = null; }
  if(Math.hypot(r.tx-r.x, r.ty-r.y) > 400){ r.x = r.tx; r.y = r.ty; }   // teleports and dungeon entries snap
}
// a friend's spell and arrow visuals
function coopVfxPlay(d){ const r = COOP.remotes[d.id]; if(!r || (r.dg||null) !== (P.inDungeon||null) || !Array.isArray(d.v)) return;
  for(const v of d.v){ const k = v[0];
    if(k==="p"){ const m = coopMobByNid(v[1]); if(m && !m.dead) projs.push({x:r.x, y:r.y-14, t:m, color:v[2], size:v[3], onHit:()=>{}, kind:v[4], sp:v[5] || (v[4]==="arrow" ? 680 : 540)}); }
    else if(k==="z") zones.push({x:v[1], y:v[2], r:v[3], left:v[4], tick:99, dmg:0, school:v[5], vis:true});
    else if(k==="b") burst(v[1], v[2], v[3], v[4]);
    else if(k==="r") ring(v[1], v[2], v[3], v[4]);
    else if(k==="s"){ const m = coopMobByNid(v[1]); if(m) for(let i=0;i<8;i++){ const a = -0.8 + i*0.2; parts.push({x:m.x+Math.cos(a)*14, y:m.y-12+Math.sin(a)*14, vx:Math.cos(a+1.5)*60, vy:Math.sin(a+1.5)*60, life:0.22, max:0.22, color:"#ffffff", size:3}); } } } }
// a friend's pet abilities (Growl, Sweep, Claw)
function coopPetSend(k){ if(coopOn()) coopBroadcast({t:"pfx", id:coopMyId(), k}); }
function coopPetFx(d){ const r = COOP.remotes[d.id], p = r && r.pet; if(!p || (r.dg||null) !== (P.inDungeon||null)) return;
  if(d.k==="growl"){ floatText(p.x, p.y-p.r-30, "Growl!", "#e6bd5c", true); ring(p.x, p.y, 40, "#e6bd5c"); }
  else if(d.k==="sweep"){ ring(p.x, p.y, 50, "#d84a42"); floatText(p.x, p.y-p.r-30, "Sweep", "#ff8a7a"); }
  else if(d.k==="claw") floatText(p.x, p.y-p.r-30, "Claw", "#e8c84a"); }
function coopState(){
  const act = P.act && P.act.t < P.act.dur ? {anim:P.act.anim, t:P.act.t, dur:P.act.dur} : null;
  const cast = P.casting ? {kind:P.casting.kind, el:P.casting.el, total:P.casting.total} : null;
  return {t:"st", id:COOP.peer.id, name:S.name, race:S.race, cls:S.cls, lvl:S.level, x:Math.round(P.x), y:Math.round(P.y), dir:P.dir, fx:P.fx, mv:!!P.moving,
    hp:Math.round(P.hp), mhp:P.maxHp, form:P.form||null, dead:!!P.dead, ghost:!!P.ghost, sit:!!P.sitting, dg:P.inDungeon||null, act, cast,
    rt:resType(), rv:Math.round(P[resType()]||0), rm:Math.round(maxRes(resType())),
    pet: pet && !pet.dead ? {k:pet.kind, x:Math.round(pet.x), y:Math.round(pet.y), fx:pet.fx, w:pet.walk?1:0, sw:pet.swing>0?1:0, hp:Math.round(pet.hp), mhp:pet.maxHp, res:Math.round(pet.res||0)} : null};
}
function coopSendState(force){ if(!coopOn() || !COOP.peer || !S || !P) return; coopBroadcast(coopState()); }
// a browser pauses the game in a background tab, so keep sending a heartbeat to stay connected
setInterval(()=>{ if(document.hidden) coopSendState(); }, 1000);
function coopUpdate(dt){
  if(!coopOn()) return;

  for(const [id, r] of Object.entries(COOP.remotes)){
    if(now - r.seen > 20000){ log(`${r.name} lost connection.`, "#93a4ad"); delete COOP.remotes[id]; continue; }

    if(r.act) r.act.t += dt;
    if(r.pet){ r.pet.x += (r.pet.tx - r.pet.x)*k; r.pet.y += (r.pet.ty - r.pet.y)*k; r.pet.flash = Math.max(0, r.pet.flash-dt); r.pet.swing = Math.max(0, r.pet.swing-dt); }

// ---------- step 2: shared monsters. The host runs every overworld monster; guests send their attacks to the host.
let COOP_ATK = null;                       // who is attacking right now (set while the host applies a guest's attack)
const coopMyId = () => (COOP.peer && COOP.peer.id) || "me";
const coopIsMe = () => !COOP_ATK || COOP_ATK === coopMyId();
const coopAttacker = () => COOP_ATK || coopMyId();

  const st = DSTATE[d.dg], inside = P.inDungeon===d.dg || coopRemoteIn(d.dg);
  if(!inside && (!st || !st.keep || st.done)) resetDungeon(D);   // nobody inside and no saved progress: fresh dungeon
  DSTATE[d.dg].keep = false;
  try{ c.send({t:"dgst", dg:d.dg, seed:D.seed, players:D.players, snap:dgSnap(D)}); }catch(e){} }
function coopDgEnter(d){ if(COOP.dgWait !== d.dg) return; COOP.dgWait = null; clearTimeout(COOP.dgWaitT);
  const D = DUNGEONS[d.dg]; if(!D || (P.dead && !P.ghost)) return;
  resetDungeon(D, d.seed, d.players); dgApply(D, d.snap); enterDungeonLocal(d.dg, true); }
function coopDgEvent(o, ex){ if(!coopOn()) return; coopBroadcast({t:"dgo", dg:o.dg, e:"use", oi:o.oi, ...(ex||{})}); }
function coopDgRemote(d){ const D = DUNGEONS[d.dg]; if(!D || !D.objs) return;
  if(d.e === "use"){ const o = D.objs[d.oi]; if(o) useDObj(o, true, d); }
  else if(d.e === "plate"){ const o = D.objs[d.oi]; if(o) o.on = !!d.on; }
  else if(d.e === "gate") openGate(D, d.gi, P.inDungeon !== D.id);
  else if(d.e === "roll"){ const o = D.objs[d.oi]; if(o) dgRollApply(D, o, d.rolls || [], d.win); }
  else if(d.e === "phase" && !D.ph[d.ph]){ D.ph[d.ph] = true; dgWake(D, d.ph, false); } }
addEventListener("beforeunload", ()=>{ if(coopOn()) coopLeave(true); });
</script>

<script>
// installable web app: register the service worker and offer updates
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => { const b = document.getElementById("swupdate"); b.hidden = false; b.onclick = () => { try{ if(typeof save === "function" && typeof running !== "undefined" && running) save(true); }catch(_){} w.postMessage("skipWaiting"); }; };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if(!w) return;
      w.addEventListener("statechange", () => { if(w.state === "installed" && navigator.serviceWorker.controller) offer(w); }); });
    setInterval(() => reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
}

<script>
// ===== DEV TOOLS =====  Only active when the page is opened with ?dev at the end of the address (e.g. https://.../Rimfrost/?dev).
// Press the key under Esc (` or §) or the DEV button to show/hide the panel. Normal players never see it.
(function(){
  if(!/[?&]dev(=|&|$)/.test(location.search)) return;
  const box = document.createElement("div"); box.hidden = true;
  box.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99999;width:240px;max-height:85vh;overflow:auto;background:rgba(10,14,20,.95);color:#dfe8ec;border:1px solid #ffd36b;border-radius:8px;padding:8px;font:12px sans-serif";
  const row = (...els) => { const d = document.createElement("div"); d.style.cssText = "display:flex;gap:4px;margin:4px 0;align-items:center"; els.forEach(e=>d.appendChild(e)); box.appendChild(d); return d; };
  const btn = (txt, fn) => { const b = document.createElement("button"); b.textContent = txt; b.style.cssText = "flex:1;padding:4px 6px;cursor:pointer"; b.onclick = ()=>{ try{ if(!S || !P){ return; } fn(); }catch(e){ console.error(e); } }; return b; };
  const num = (v, w) => { const i = document.createElement("input"); i.type = "number"; i.value = v; i.style.cssText = "width:"+(w||60)+"px"; return i; };
  const sel = opts => { const s = document.createElement("select"); s.style.cssText = "flex:1;min-width:0"; opts.forEach(([v,t])=>{ const o = document.createElement("option"); o.value = v; o.textContent = t; s.appendChild(o); }); return s; };
  const title = document.createElement("div"); title.textContent = "DEV TOOLS  (§ or the DEV button to hide)"; title.style.cssText = "font-weight:700;color:#ffd36b"; box.appendChild(title);

  function setLevel(n){ n = Math.max(1, Math.min(MAX_LVL, n|0)); S.level = n; S.xp = 0;
    for(const id of allBarIds()) if(AB[id].lvl <= n && !S.learned.includes(id)){ S.learned.push(id); autoPlace(id); }
    recompute(true); P.hp = P.maxHp; P.mana = P.maxMana; buildHotbar(); log(`[dev] Level set to ${n}, all abilities learned.`, "#ffd36b"); }
  const lv = num(MAX_LVL, 50);
  row(lv, btn("Set level", ()=>setLevel(+lv.value)), btn("Max", ()=>{ lv.value = MAX_LVL; setLevel(MAX_LVL); }));
  row(btn("+10 000 gold", ()=>{ S.gold += 10000; }), btn("Heal full", ()=>{ if(!P.dead){ P.hp = P.maxHp; P.mana = P.maxMana; } }));
  const god = document.createElement("input"); god.type = "checkbox"; const gl = document.createElement("label"); gl.append(god, " God mode (never die)");
  row(gl);
  setInterval(()=>{ if(god.checked && typeof P !== "undefined" && P && !P.dead){ P.hp = P.maxHp; } }, 100);
  row(btn("Kill target", ()=>{ if(P.target && !P.target.dead) damageMob(P.target, 1e7, false, "phys"); }));

  const hubs = sel(Object.entries(HUBS).map(([id,h])=>[id, h.name]));
  row(hubs, btn("Go", ()=>{ if(P.inDungeon) leaveDungeon(false); const h = HUBS[hubs.value]; P.x = h.x*TILE+16; P.y = (h.y+2)*TILE+16; }));
  const dgs = sel(Object.keys(DUNGEONS).map(id=>[id, ZONES[id] ? ZONES[id].name : id]));
  row(dgs, btn("Enter", ()=>{ if(P.inDungeon) leaveDungeon(false); enterDungeon(dgs.value); }));
  const ts = {sta:num(0), int:num(0), str:num(0), agi:num(0)};
  const tl = document.createElement("div"); tl.textContent = "Test charm (stats: Sta / Int / Str / Agi)"; tl.style.cssText = "font-size:11px;margin-top:6px"; box.appendChild(tl);
  row(...Object.entries(ts).map(([k,e])=>{ e.title = STAT_NAME[k]; e.placeholder = k[0].toUpperCase()+k.slice(1); e.style.cssText = "flex:1;min-width:0;width:0"; return e; }));
  row(btn("Equip test charm", ()=>{ const st = {}; for(const [k,e] of Object.entries(ts)) if(+e.value > 0) st[k] = +e.value;
    if(Object.keys(st).length) S.eq.neck = {id:"devcharm", slot:"neck", q:5, il:S.level, st, n:"[dev] Test Charm", v:2}; else delete S.eq.neck; recompute(false); log("[dev] test charm: "+(Object.entries(st).map(([k,v])=>"+"+v+" "+STAT_NAME[k]).join(", ")||"removed"), "#ffd36b"); }));
  const items = sel(Object.keys(ITEMS).sort().map(id=>[id, ITEMS[id].name || id])), qty = num(1, 44);
  row(items, qty, btn("Give", ()=>{ addItem(items.value, Math.max(1, qty.value|0)); log(`[dev] +${qty.value} ${ITEMS[items.value].name||items.value}`, "#ffd36b"); }));
  // ---- BALANCE TEST: a bot fights a standard monster with your current character and reports the result.
  // It uses the real abilities (same code path as the hotbar), a fixed priority list per class, no potions, no kiting.
  const ROT = {
    mage:    {def:[["icearmor",0.7]], heal:[], buff:[], dmg:[["meteor"],["pyroblast"],["sparkrain"],["fireblast"],["blizzard"],["fireball"]]},
    warrior: {def:[["secondwind",0.5]], heal:[], buff:[["shout","shout"]], dmg:[["execute"],["quake"],["rend",9],["heroic"]]},
    hunter:  {def:[], heal:[], buff:[], dmg:[["stormarrow"],["aimed"],["firearrow"],["poison",12],["steady"]]},
    priest:  {def:[["pws",0.7],["renew",0.8,12]], heal:[["heal",0.45]], buff:[], dmg:[["judgment"],["mindblast"],["swp",12],["darkpulse"],["holynova"],["smite"]]},
    druid:   {def:[["bark",0.8],["rejuv",0.7,12]], heal:[["bloom",0.5],["touch",0.4]], buff:[], dmg:[["starfire"],["hurricane"],["moonfire",9],["wrath"]]},
    druid_bear: {def:[["frenzy",0.3]], heal:[], buff:[], dmg:[["bash"],["roar",0,"multi"],["swipe",0,"multi"],["maul"]]},
    druid_cat:  {def:[], heal:[], buff:[], dmg:[["bite",0,"cp3"],["rake",9],["claw"]]},
    paladin: {def:[["holyshield",0.7],["bubble",0.25]], heal:[["palheal",0.45]], buff:[["avenging","avenging"]], dmg:[["judge"],["crusader"],["palstrike"],["hammer"],["consecrate"]]}
  };
  const SCEN = {n1:["1 normal monster", "wolf", 1], n3:["3 normal monsters", "wolf", 3], e1:["1 elite monster", "oldgray", 1]};
  const scen = sel(Object.entries(SCEN).map(([k,v])=>[k, v[0]]));
  const formSel = sel([["caster","Druid: caster"],["bear","Druid: bear"],["cat","Druid: wolf"]]);
  const petSel = sel([["none","Hunter pet: none"],["bear","Hunter pet: bear"],["wolf","Hunter pet: wolf"]]);
  const resBox = document.createElement("pre"); resBox.style.cssText = "white-space:pre-wrap;margin:4px 0;color:#cfe0e6;font:11px monospace;max-height:160px;overflow:auto";
  let results = []; try{ results = JSON.parse(localStorage.getItem("rimfrost_dev_results")||"[]"); }catch(e){}
  const showRes = ()=>{ resBox.textContent = results.length ? results.map(r=>r.txt).join("\n") : "No tests yet."; };
  const saveRes = ()=>{ try{ localStorage.setItem("rimfrost_dev_results", JSON.stringify(results)); }catch(e){} showRes(); };
  let testing = null;
  function finishTest(outcome){
    const T0 = testing; if(!T0) return; testing = null; clearInterval(T0.iv); err = T0.err;
    const secs = Math.max(0.1, time - T0.t0), total = T0.mobs.reduce((a,m)=>a+m.maxHp, 0), left = T0.mobs.reduce((a,m)=>a+(m.dead?0:m.hp), 0);
    const kill = outcome==="win", dps = (total-left)/secs, c = CLASSES[S.cls].name;
    const petTxt = T0.pet ? ` | pet ${pet && !pet.dead ? Math.round(pet.hp/pet.maxHp*100)+"% hp" : "DIED"}` : "";
    const txt = `${c}${T0.form ? " ("+T0.form+")" : ""}${T0.pet ? " +"+T0.pet : ""} L${S.level} | ${SCEN[T0.sc][0]} | ${kill ? "won in "+secs.toFixed(1)+"s" : outcome==="dead" ? "DIED after "+secs.toFixed(1)+"s ("+Math.round(left/total*100)+"% monster hp left)" : "TIMEOUT ("+Math.round(left/total*100)+"% left)"} | dps ${dps.toFixed(0)} | hp lost ${Math.round(T0.lost/P.maxHp*100)}% | lowest hp ${Math.round(T0.minHp*100)}% | healed ${Math.round(T0.healed/P.maxHp*100)}%${petTxt}${T0.mana ? " | mana left "+Math.round(P.mana/P.maxMana*100)+"%"+(T0.oom!=null ? " (empty at "+T0.oom.toFixed(0)+"s)" : "") : ""}`;
    results.push({txt}); if(results.length > 40) results.shift(); saveRes(); console.log("[dev test]", txt);
    mobs = mobs.filter(m=>!m._dev); P.target = null; P.autoTarget = null; projs = []; zones = [];
    if(P.dead){ P.dead = false; P.ghost = false; S.death = null; showSpiritHealers(false); const d = document.getElementById("dead"); if(d) d.hidden = true; }
    if(S.cls==="druid" && P.form) setForm(null);
    if(pet){ pet.dead = false; pet.hp = pet.maxHp; }
    P.hp = P.maxHp; P.mana = P.maxMana; P.cds = {}; P.gcd = 0; P.shield = 0; P.casting = null; log("[dev] "+txt, "#ffd36b");
  }
  function botTick(){
    const T0 = testing; if(!T0) return;
    if(!running || !S || !P){ finishTest("timeout"); return; }
    const alive = T0.mobs.filter(m=>!m.dead);
    if(P.dead){ finishTest("dead"); return; }
    if(!alive.length){ finishTest("win"); return; }
    if(time - T0.t0 > 120){ finishTest("timeout"); return; }
    if(P.hp < T0.last) T0.lost += T0.last - P.hp; else T0.healed += P.hp - T0.last;
    T0.last = P.hp; T0.minHp = Math.min(T0.minHp, P.hp/P.maxHp);
    if(T0.mana && T0.oom == null && P.mana < P.maxMana*0.1) T0.oom = time - T0.t0;
    { const mh = alive.reduce((a,m)=>a+m.hp,0); if(mh < T0.mobHp - 0.5 || T0.lost > T0.lostSeen){ T0.lastProg = time; } T0.mobHp = mh; T0.lostSeen = T0.lost; }
    if(time - T0.lastProg > 6){ T0.lastProg = time; alive.forEach((m,i)=>{ m.x = m.hx = P.x + 55 + i*20; m.y = m.hy = P.y; aggro(m); }); }   // monster stuck? bring it to you
    if(P.sitting) standUp();
    if(!P.target || P.target.dead || !alive.includes(P.target)) P.target = alive.sort((a,b)=>dist(P,a)-dist(P,b))[0];
    if(autoInfo() && P.autoTarget !== P.target) P.autoTarget = P.target;
    if(P.casting) return;
    const cfg = ROT[S.cls==="druid" && P.form ? "druid_"+P.form : S.cls]; if(!cfg) return; const hpf = P.hp / P.maxHp, last = T0.used;
    const tryOne = (id, minGap)=>{
      if(!S.learned.includes(id) || (P.cds[id]||0) > 0 || S.level < AB[id].lvl) return false;
      if(minGap && last[id] != null && time - last[id] < minGap) return false;
      if(!AB[id].offGcd && P.gcd > 0) return false;
      const type = resType(); if(P[type] < costOf(id)) return false;
      tryUse(id);
      if(P.gcd > 0 || P.casting || (P.cds[id]||0) > 0){ last[id] = time; return true; } return false; };
    if(pet && !pet.dead && pet.hp/pet.maxHp < 0.5 && tryOne("mendpet")) return;
    for(const [id, at] of cfg.heal) if(hpf < at && tryOne(id)) return;
    for(const [id, at, gap] of cfg.def) if(hpf < at && tryOne(id, gap)) return;
    for(const [id, key] of cfg.buff) if(!P.buffs[key] && tryOne(id)) return;
    for(const [id, gap, cond] of cfg.dmg){ if(cond==="multi" && alive.length < 2) continue; if(cond==="cp3" && (P.cp||0) < 3) continue; if(tryOne(id, gap)) return; }
  }
  function startTest(){
    if(testing){ finishTest("timeout"); return; }
    if(coopOn()) return log("[dev] Leave co-op before running balance tests.", "#ff8a7a");
    if(P.dead) return log("[dev] Revive first.", "#ff8a7a");
    if(nearHub(P.x/TILE, P.y/TILE, 2)) return log("[dev] Walk out of town / camp first - monsters give up at the gates.", "#ff8a7a");
    const [nm, type, n] = SCEN[scen.value], L = Math.max(1, Math.min(MAX_LVL, lv.value|0));
    setLevel(L); if(S.cls==="hunter"){ if(petSel.value==="none"){ S.petType = null; pet = null; } else { S.petType = petSel.value; pet = petMake(petSel.value); } }
    if(S.cls==="druid"){ const f = formSel.value==="caster" ? null : formSel.value; if(P.form !== f) setForm(f); } P.cds = {}; P.gcd = 0; P.shield = 0; P.buffs = {}; P.hp = P.maxHp; P.mana = P.maxMana; if(resType()==="rage") P.rage = 0; if(resType()==="focus") P.focus = 100;
    const spots = [[200,0],[-200,0],[0,200],[0,-200],[130,0],[-130,0],[0,130],[0,-130]];
    const sp = spots.find(([dx,dy])=>!collides(P.x+dx, P.y+dy, 12)) || [130,0];
    const ms = []; for(let i=0;i<n;i++){ const m = makeMob(type, 0, 0, L); m.x = m.hx = P.x+sp[0]+(i-(n-1)/2)*26*(sp[0]===0?1:0); m.y = m.hy = P.y+sp[1]+(i-(n-1)/2)*26*(sp[0]===0?0:1); m._dev = true; mobs.push(m); ms.push(m); aggro(m); }
    testing = {pet:(pet && !pet.dead) ? pet.kind : null, form:P.form, mobs:ms, sc:scen.value, t0:time, last:P.hp, lost:0, healed:0, minHp:1, used:{}, err:err, mana:resType()==="mana", oom:null, lastProg:time, mobHp:ms.reduce((a,m)=>a+m.hp,0), sp:sp};
    err = ()=>{};   // keep the bot from spamming "not ready" text
    testing.iv = setInterval(botTick, 50);
    log(`[dev] Test started: ${S.cls} L${L} vs ${nm}.`, "#ffd36b");
  }
  const sh = document.createElement("div"); sh.textContent = "Balance test (current character)"; sh.style.cssText = "margin-top:8px;font-weight:700;color:#ffd36b"; box.appendChild(sh);
  row(scen, btn("Run", startTest));
  row(formSel);
  row(petSel);
  row(btn("Copy results", ()=>{ const t = results.map(r=>r.txt).join("\n"); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>log("[dev] Results copied.", "#ffd36b")).catch(()=>prompt("Copy:", t)); }), btn("Clear", ()=>{ results = []; saveRes(); }));
  box.appendChild(resBox); showRes();
  const note = document.createElement("div"); note.textContent = "Changes are saved with your character like normal play. Use a test character."; note.style.cssText = "color:#93a4ad;margin-top:6px"; box.appendChild(note);

  document.body.appendChild(box);
  const toggle = ()=>{ box.hidden = !box.hidden; };
  const tb = document.createElement("button"); tb.textContent = "DEV"; tb.onclick = toggle;
  tb.style.cssText = "position:fixed;left:50%;top:4px;transform:translateX(-50%);z-index:99999;padding:2px 10px;font:700 11px sans-serif;background:#1b2a33;color:#ffd36b;border:1px solid #ffd36b;border-radius:6px;cursor:pointer;opacity:.85";
  document.body.appendChild(tb);
  // the key under Esc: ` on an English keyboard, § on a Swedish one
  addEventListener("keydown", e=>{ if((e.code === "Backquote" || e.key === "`" || e.key === "§" || e.key === "½") && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT"){ toggle(); e.preventDefault(); } }, true);
})();
</script>
